# PKB MCP HTTP Server
#
# Serves the personal knowledge base over HTTP (MCP protocol) on port 8026.
# Tailscale handles auth/encryption — no TLS needed.
#
# Usage:
#   docker compose -f pkb-server/docker-compose.yml up -d
#
# Memory: ~2.7GB for BGE-M3 model weights; startup ~4s.

services:
  pkb-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pkb-mcp-server
    restart: unless-stopped
    ports:
      - "8026:8026"
    volumes:
      # PKB data directory (knowledge graph, vector store, documents)
      - /opt/nic/brain:/data
      # BGE-M3 embedding model (read-only — shared with host)
      - /opt/debian/cache/aops/models/bge-m3:/models/bge-m3:ro
    environment:
      - ACA_DATA=/data
      - PKB_MODEL_DIR=/models/bge-m3
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8026/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
