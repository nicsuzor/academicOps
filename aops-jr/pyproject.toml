[project]
name = "aops-jr"
version = "0.0.1"
description = "aops-jr coordinator package — the polecat dispatch CLI, standalone from the aops framework package"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "click>=8.2.0"]

[project.scripts]
polecat = "polecat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["polecat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
