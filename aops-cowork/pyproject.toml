# aops-cowork shipped-plugin manifest (SSoT for the deployed Cowork runtime deps).
#
# This is a TRACKED source file. aops-cowork is a REAL package composed at build
# time, not a manifest fabricated from templates/: scripts/build.py copies the
# aops-core base content into dist/aops-cowork and then overlays this package's
# own files (this pyproject, .claude-plugin/plugin.json, skills/cowork-sync).
#
# The cowork build ships NO hooks — the shared aops-core hook stack serves the
# Cowork surface when aops-core is installed from the dist marketplace (see
# task aops-04075740 / mem-fe29111a). So the wheel ships only `lib`; listing a
# `hooks` package that isn't on disk would break `uv sync --frozen` at runtime.
#
# At build time scripts/build.py stamps `version` (this 0.0.0 placeholder is
# replaced with the real build version) and runs `uv lock` against the stamped
# copy in dist/ so pyproject.toml and uv.lock ship in lockstep. The version here
# is intentionally a placeholder and is NOT used by any released artifact.
[project]
name = "aops-cowork"
version = "0.0.0"
description = "AcademicOps variant for Cowork - includes native task list synchronization"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Nicolas Suzor" },
]
keywords = ["academicOps", "research", "framework", "workflow", "cowork"]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "filelock>=3.13.0",
  "psutil>=5.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
