# Provenance metadata and agy tool map configuration.
# Documented re-extraction step:
# 1. Test candidate tool names in an agent's `tools:` frontmatter key and check the exit code and logs of `agy --agent <name>`.
# 2. Omit unregistered tools (e.g. browser tools not registered in the container environment, deprecated tools like multi_replace_file_content, and call_mcp_tool/delete_knowledge).
# 3. Save the 21 accepted tool names below.

[provenance]
agy_version = "1.1.13"
extraction_date = "2026-08-19"
extraction_command = "Declare candidate tool names in agent tools: frontmatter and test agy execution inside aops-crew container"

[vocabulary]
accepted_tools = [
  "ask_permission",
  "ask_question",
  "define_subagent",
  "find_by_name",
  "finish",
  "generate_image",
  "grep_search",
  "invoke_subagent",
  "list_dir",
  "manage_subagents",
  "manage_task",
  "notebook_edit",
  "read_url_content",
  "replace_file_content",
  "run_command",
  "schedule",
  "search_web",
  "send_message",
  "view_file",
  "wait",
  "write_to_file",
]

[tool_map]
Read = ["view_file"]
Write = ["write_to_file"]
Edit = ["replace_file_content"]
Bash = ["run_command"]
Grep = ["grep_search"]
Glob = ["find_by_name"]
AskUserQuestion = ["ask_question"]
WebSearch = ["search_web"]
WebFetch = ["read_url_content"]
NotebookEdit = ["notebook_edit"]
Agent = ["invoke_subagent", "manage_subagents", "send_message"]
SendMessage = ["send_message"]
TaskCreate = ["manage_task"]
TaskGet = ["manage_task"]
TaskList = ["manage_task"]
TaskUpdate = ["manage_task"]
TaskStop = ["manage_task"]
Skill = []
ToolSearch = []
ListMcpResourcesTool = []
TodoWrite = []
Monitor = []
ListAgents = []
