# Provenance metadata and agy tool map configuration.
# Documented re-extraction step:
# 1. Run an agy session with `--output-format stream-json` to extract candidate tool names from the `init` event `tools` array (56 host native tool names).
# 2. Test each candidate tool name ALONE in an agent's `tools:` frontmatter key and check the exit code of `agy --agent <name>`.
# 3. Omit `call_mcp_tool` and `delete_knowledge` (both cause exit code 1 / LOUD failure at execution time when declared in agent frontmatter `tools:` list).
# 4. Save the 54 accepted tool names below.

[provenance]
agy_version = "1.1.11"
extraction_date = "2026-08-10"
extraction_command = "Declare each candidate tool name ALONE in agent tools: frontmatter and test agy --agent exit code"

