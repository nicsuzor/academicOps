# Declares the academicOps marketplace: name, owner, and the plugin set. See
# specs/ARCHITECTURE.md for the plugin table this mirrors. build.py reads
# this as the single source of truth for plugin directory -> marketplace name.

name = "academicOps"
description = "academicOps - Research workflow automation framework"

[owner]
name = "Nicolas Suzor"
email = "nic@suzor.net"
#
[[plugins]]
directory = "pkb"
name = "pkb"
description = "pauli. Memory, effectual planning, workflow composition, PKB MCP client config."
category = "productivity"

[[plugins]]
directory = "ida"
name = "ida"
description = "ida — the interactive face; pc — the polecat container launcher."
category = "productivity"

[[plugins]]
directory = "orchestrate"
name = "orchestrate"
description = "james — the container worker; marsha — QA and UX excellence; adversary — red-team review."
category = "productivity"

[[plugins]]
directory = "rbg"
name = "rbg"
description = "Automatic in-session rule enforcement."
category = "productivity"

[[plugins]]
directory = "ts"
name = "ts"
description = "Tailscale bring-up for remote sessions."
category = "productivity"

[[plugins]]
directory = "tools"
name = "tools"
description = "Domain research skills."
category = "productivity"

[[plugins]]
directory = "aops-debug"
name = "aops-debug"
description = "Debug plugin that dumps raw hook payloads."
category = "productivity"
