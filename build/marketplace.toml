# Declares the academicOps marketplace: name, owner, and the plugin set. See
# specs/ARCHITECTURE.md for the plugin table this mirrors. build.py reads
# this as the single source of truth for plugin directory -> marketplace name.

name = "academicOps"
description = "academicOps - Research workflow automation framework"

[owner]
name = "Nicolas Suzor"
email = "nic@suzor.net"
#
[[plugins]]
directory = "ida"
name = "ida"
description = "The strategic face, and the only agent that speaks to the user."
category = "productivity"
shared = [
  { src = "lib/hooks/agy_tracer.py", dst = "hooks/agy_tracer.py" },
  { src = "lib/hooks/token_extractor.py", dst = "hooks/token_extractor.py" },
  { src = "lib/hooks/messages/honesty.md", dst = "hooks/messages/honesty.md" },
  { src = "lib/hooks/messages/honesty.user.md", dst = "hooks/messages/honesty.user.md" },
  { src = "lib/skills/premise-check/SKILL.md", dst = "skills/premise-check/SKILL.md" },
  { src = "lib/skills/premise-check/references/critique-guide.md", dst = "skills/premise-check/references/critique-guide.md" },
]

[[plugins]]
directory = "agy-headless"
name = "agy-headless"
description = "Isolated low-context headless Antigravity (agy) agent profiles and Argdown handback hooks."
category = "productivity"
# Headless agy profiles and agent-scoped agy hooks exist only for the agy client.
clients = ["agy"]
shared = [
  { src = "lib/hooks/agy_tracer.py", dst = "hooks/agy_tracer.py" },
  { src = "lib/hooks/token_extractor.py", dst = "hooks/token_extractor.py" },
  { src = "lib/hooks/messages/honesty.md", dst = "hooks/messages/honesty.md" },
  { src = "lib/skills/premise-check/SKILL.md", dst = "bundled-skills/premise-check/SKILL.md" },
  { src = "lib/skills/premise-check/references/critique-guide.md", dst = "bundled-skills/premise-check/references/critique-guide.md" },
]

[[plugins]]
directory = "rbg"
name = "rbg"
description = "Automatic in-session rule enforcement."
category = "productivity"

[[plugins]]
directory = "tools"
name = "tools"
description = "Domain research skills."
category = "productivity"

[[plugins]]
directory = "aops-debug"
name = "aops-debug"
description = "Debug plugin that dumps raw hook payloads."
category = "productivity"

[[plugins]]
directory = "ida-telegram"
name = "ida-telegram"
description = "Ida's custom Telegram channel and Mini App plugin for Claude Code."
category = "productivity"
# A Claude Code channel. agy has no channels, so there is nothing to build for it.
clients = ["claude", "openclaw"]
