# Declares the academicOps marketplace: name, owner, and the plugin set. See
# specs/ARCHITECTURE.md for the plugin table this mirrors. build.py reads
# this as the single source of truth for plugin directory -> marketplace name.

name = "academicOps"
description = "academicOps - Research workflow automation framework"

[owner]
name = "Nicolas Suzor"
email = "nic@suzor.net"
#
[[plugins]]
directory = "aops"
name = "aops"
description = "Research workflow automation: execution (james), QA (marsha), unattended dispatch (sara), and red-team (adversary)."
category = "productivity"

[[plugins]]
directory = "ida"
name = "ida"
description = "The strategic face, and the only agent that speaks to the user."
category = "productivity"

[[plugins]]
directory = "pkb"
name = "pkb"
description = "Memory: pauli, the sole writer to the Personal Knowledge Base, and the PKB MCP server."
category = "productivity"

[[plugins]]
directory = "rbg"
name = "rbg"
description = "Automatic in-session rule enforcement."
category = "productivity"

[[plugins]]
directory = "ts"
name = "ts"
description = "Tailscale bring-up for remote sessions."
category = "productivity"

[[plugins]]
directory = "tools"
name = "tools"
description = "Domain research skills."
category = "productivity"

[[plugins]]
directory = "aops-debug"
name = "aops-debug"
description = "Debug plugin that dumps raw hook payloads."
category = "productivity"
