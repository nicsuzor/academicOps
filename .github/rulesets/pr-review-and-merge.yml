# GitHub Ruleset: PR Review and Merge rules
# Ruleset ID: 13762049
# Applied to: refs/heads/dev of nicsuzor/academicOps
#
# Record of the live ruleset. Applying it needs repository admin:
#   PUT repos/nicsuzor/academicOps/rulesets/13762049
#
# dev merges on green: Lint and Pytest pass on the PR head; no approval is
# required. Review into main is the human gate (main-requires-review.yml).

name: PR Review and Merge rules

target: branch
conditions:
  ref_name:
    include:
      - refs/heads/dev
    exclude: []

enforcement: active

# Kept as null (not []) so the payload matches the live API value.
bypass_actors:

rules:
  - type: deletion

  - type: non_fast_forward

  - type: pull_request
    parameters:
      required_approving_review_count: 0
      dismiss_stale_reviews_on_push: false
      require_code_owner_review: false
      require_last_push_approval: false
      required_review_thread_resolution: false
      allowed_merge_methods:
        - rebase
        - squash
        - merge

  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: false
      do_not_enforce_on_create: false
      # Context names are the check-run names GitHub emits for the reusable
      # workflows called from pr-pipeline.yml: "<caller job name> / <callee job name>".
      required_status_checks:
        - context: "Lint / Lint"
        - context: "Pytest / Pytest"
