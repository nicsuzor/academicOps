# GitHub Ruleset: PR Review and Merge rules
# Ruleset ID: 13762049
# Applied to: dev integration branch (refs/heads/dev) of nicsuzor/academicOps
#
# This file is the authoritative reference for the repository ruleset.
# It cannot be auto-applied via REST API (some rule types like merge_queue
# and copilot_code_review_analysis_tools are UI-only), but it serves as:
#   1. A diff-reviewable record of what rules are active
#   2. A sync target for rules that CAN be updated via API (see below)
#   3. Input for the validate-ruleset-alignment CI check
#
# To apply API-compatible rules from this file, run:
#   scripts/sync-ruleset.sh
#
# Rules NOT configurable via REST API (must be set in GitHub UI):
#   - merge_queue (Settings → Rules → Rulesets → add Merge queue rule)
#   - copilot_code_review_analysis_tools (CodeQL — re-add after any API update)
#
# Recommended merge queue settings (set via UI):
#   merge_method: REBASE
#   min_entries_to_merge: 1
#   min_entries_to_merge_wait_minutes: 5
#   max_entries_to_build: 5
#   max_entries_to_merge: 5
#   grouping_strategy: ALLGREEN

name: PR Review and Merge rules

# Which branches this ruleset applies to
target: branch
conditions:
  ref_name:
    include:
      - refs/heads/dev  # dev integration branch (PRs target dev; main is publish-only)
    exclude: []

enforcement: active

# Who can bypass these rules (admin role)
bypass_actors:
  - actor_id: 5          # Repository admin role
    actor_type: RepositoryRole
    bypass_mode: always

rules:
  # ─────────────────────────────────────────
  # Prevent branch deletion
  # ─────────────────────────────────────────
  - type: deletion
    # Purpose: Protects dev from accidental deletion

  # ─────────────────────────────────────────
  # Require linear history (no force-push)
  # ─────────────────────────────────────────
  - type: non_fast_forward
    # Purpose: Prevents force-pushes that would rewrite history on dev

  # ─────────────────────────────────────────
  # Require pull request before merging
  # ─────────────────────────────────────────
  - type: pull_request
    parameters:
      required_approving_review_count: 0
      # v2 (Phase 4): the human gate is the `pr-fix-loop` GitHub Environment approval,
      # which sets the required `admit-status` (see required_status_checks below and
      # specs/workflows/pr-pipeline-v2.md §5). There is no bot approval to count and no
      # separate human review-approval — the Environment approval IS the human decision.
      # This drop (2 → 0) is made in the SAME change that adds `admit-status` to the
      # required checks; otherwise green checks alone would permit a gate-bypassing
      # manual merge (§5 sequencing note).
      dismiss_stale_reviews_on_push: false
      require_code_owner_review: false
      require_last_push_approval: false
      required_review_thread_resolution: false
      allowed_merge_methods:
        - rebase
        - squash
        - merge

  # ─────────────────────────────────────────
  # Required status checks
  # ─────────────────────────────────────────
  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: false
      # strict=false: PR branch does not need to be up to date with base before merge.
      # The merge queue handles rebasing; strict mode is redundant and adds friction.
      do_not_enforce_on_create: false
      required_status_checks:
        # Context names must match the check-run name GitHub actually emits.
        # For reusable-workflow calls, that is "<caller-job-name> / <callee-job-name>"
        # (NOT "<workflow-name> / <caller-job-id> / <callee-job-name>"). In pr-pipeline.yml:
        #   job `lint`      name: Lint       → calls lint.yml      job name: Lint      → "Lint / Lint"
        #   job `typecheck` name: Type Check → calls typecheck.yml job name: Type Check → "Type Check / Type Check"
        #   job `pytest`    name: Pytest     → calls pytest.yml    job name: Pytest    → "Pytest / Pytest"
        - context: "Lint / Lint"
        # DISABLED 2026-05-17 — Type Check gate hollowed out by 10+ prior suppression
        # commits (see RBG audit, PKB task aops-1c3de214). Gate produces 236 errors
        # on every PR from pre-existing source issues that previous "fix" commits
        # silenced rather than fixed. Disabled as explicit, dated, tracked debt
        # while burn-down task aops-1c3de214 fixes the real errors. DO NOT re-add
        # to required checks until aops-1c3de214 closes (acceptance: basedpyright
        # returns 0 errors on a clean clone of main).
        # - context: "Type Check / Type Check"
        - context: "Pytest / Pytest"
        # v2 framework agents (specs/workflows/pr-pipeline-v2.md §7) — each owns its
        # AND-gate slot directly; there is no transitive merge-prep-status gate.
        # enforcer-status: rbg — axiom review (agent-enforcer.yml)
        - context: "enforcer-status"
        # qa-status: marsha — runtime QA (agent-qa.yml)
        - context: "qa-status"
        # review-attestation: fail-closed liveness + named-reviewer-on-this-SHA
        # proof (pr-pipeline.yml `review-attestation` job; #1450, pr-pipeline.md
        # §3.7). Posted `success` only when every named reviewer (enforcer, qa)
        # genuinely ran on THIS head SHA; fails closed on absent/pending/red/stale.
        # Required so a dead/skipped/startup-failed pipeline (which posts nothing)
        # leaves this check unsatisfied → unmergeable, instead of absence silently
        # reading as a pass.
        - context: "review-attestation"
        # Human gate (Environment approval, §5) — NOT an agent. Set to success only by
        # the in-pipeline Stage-2 Admission Gate (the `admit` job in pr-pipeline.yml)
        # when the maintainer approves the `pr-fix-loop` Environment. Replaces v1's
        # merge-prep-status as the merge gate.
        - context: "admit-status"
        # NOTE: alignment-status is advisory (§6) and is intentionally NOT required —
        # pauli runs host-side and informs the human gate, never deadlocks a merge.
        # NOTE: merge-prep-status is REMOVED (Phase 4) — replaced by admit-status. The
        # no-op merge-prep run on every green PR (pathology P5) is gone.

  # ─────────────────────────────────────────
  # Code quality (CodeQL / Copilot analysis)
  # ─────────────────────────────────────────
  - type: code_quality
    parameters:
      severity: errors
    # Note: This rule type is NOT configurable via REST API.
    # If it disappears after an API update (which drops it silently),
    # re-add it via GitHub UI: Settings → Rules → Rulesets → edit → add Code quality rule.
    # The copilot_code_review_analysis_tools (CodeQL) check runs automatically
    # once this rule is active.

  # ─────────────────────────────────────────
  # Merge queue (UI-only, not in API)
  # ─────────────────────────────────────────
  # merge_queue rule must be added via GitHub UI. Recommended settings:
  #   merge_method: REBASE
  #   min_entries: 1
  #   wait_minutes: 5
  #   max_entries_to_build: 5
  #   grouping_strategy: ALLGREEN
  # When enabled, gh pr merge --merge-queue enqueues PRs.
  # The queue rebases each PR on the current main head and reruns required checks
  # before merging, eliminating cascade conflicts from multiple concurrent PRs.
