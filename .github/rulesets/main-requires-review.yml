# GitHub Ruleset: lock main against pushes (release pipeline only)
# Applied to: refs/heads/main (the published distribution branch) of nicsuzor/academicOps
#
# Purpose: `main` holds distribution artifacts only and stays the repository default
# branch so client harnesses (Claude Code, Antigravity) look there for plugins.
# Nobody, admins included, can push to `main`.
# Only the release pipeline automation (GitHub Actions integration id 2921286)
# can push to `main` via `scripts/publish-dist-to-main.sh`.
#
# Non-release PRs opened against `main` are automatically retargeted to `dev`
# by `.github/workflows/auto-retarget-pr.yml`.
#
# Applying/updating this ruleset on GitHub requires repository administrator
# privileges (run via `python3 scripts/sync_main_ruleset.py`).

name: lock main against pushes (release pipeline only)

target: branch
conditions:
  ref_name:
    include:
      - refs/heads/main
    exclude: []

enforcement: active

# Only the release pipeline automation may push to main.
# Admins are deliberately NOT included here, enforcing that nobody, admins included,
# can push to main.
bypass_actors:
  - actor_id: 2921286
    actor_type: Integration
    bypass_mode: always

rules:
  # ─────────────────────────────────────────
  # Block branch deletion
  # ─────────────────────────────────────────
  - type: deletion

  # ─────────────────────────────────────────
  # Prevent force-pushes
  # ─────────────────────────────────────────
  - type: non_fast_forward

  # ─────────────────────────────────────────
  # Block all branch updates (direct pushes and PR merges) by non-bypass actors
  # ─────────────────────────────────────────
  - type: update
