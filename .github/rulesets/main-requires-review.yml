# GitHub Ruleset: main requires fully green releases
# Ruleset ID: none yet (not created live)
# Applied to: refs/heads/main of nicsuzor/academicOps
#
# Record of the ruleset to create. Creating it needs repository admin:
#   POST repos/nicsuzor/academicOps/rulesets
#
# Merges to main are absolutely restricted to fully green releases:
# Lint, Type Check, and Pytest pass on the PR head; no bypass is allowed.

name: main requires fully green releases

target: branch
conditions:
  ref_name:
    include:
      - refs/heads/main
    exclude: []

enforcement: active

bypass_actors:

rules:
  - type: deletion

  - type: non_fast_forward

  - type: pull_request
    parameters:
      required_approving_review_count: 0
      dismiss_stale_reviews_on_push: false
      require_code_owner_review: false
      require_last_push_approval: false
      require_review_thread_resolution: false
      allowed_merge_methods:
        - merge

  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: false
      do_not_enforce_on_create: false
      required_status_checks:
        - context: "Lint / Lint"
        - context: "Type Check / Type Check"
        - context: "Pytest / Pytest"
