# GitHub Ruleset (DRAFT, NOT LIVE): main requires fully green releases
# Ruleset ID: none. No ruleset is live on refs/heads/main of nicsuzor/academicOps,
# so GitHub enforces none of the rules below on main today.
#
# A proposal only; do not apply it as written. main is written by the release
# pipeline's direct `git push origin HEAD:main` (scripts/publish-dist-to-main.sh),
# not by a pull request. With no bypass actor, the pull_request and
# required_status_checks rules below would reject that push and stop publishing.
# Applying it needs a bypass actor for the publishing identity first, and
# repository admin: POST repos/nicsuzor/academicOps/rulesets
# (scripts/sync_main_ruleset.py refuses to apply it without a bypass actor).

name: main requires fully green releases

target: branch
conditions:
  ref_name:
    include:
      - refs/heads/main
    exclude: []

enforcement: active

bypass_actors:

rules:
  - type: deletion

  - type: non_fast_forward

  - type: pull_request
    parameters:
      required_approving_review_count: 0
      dismiss_stale_reviews_on_push: false
      require_code_owner_review: false
      require_last_push_approval: false
      require_review_thread_resolution: false
      allowed_merge_methods:
        - merge

  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: false
      do_not_enforce_on_create: false
      required_status_checks:
        - context: "Lint / Lint"
        - context: "Type Check / Type Check"
        - context: "Pytest / Pytest"
