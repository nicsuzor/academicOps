# Agent: Enforcer (RBG)
# Personality: The Judge — axiom compliance reviewer.
# Status check: enforcer-status (posted to PR head SHA via statuses API)
# Prompt: aops-core/agents/rbg.md + .github/agents/enforcer.agent.md
#
# This is a reusable workflow. academicOps installs its own trigger in:
#   .github/workflows/triggers/enforcer.yml
# External consumers pin to a release tag:
#   uses: nicsuzor/academicOps/.github/workflows/agent-enforcer.yml@enforcer-v1
#
# v2 contract (specs/pr-pipeline-v2.md):
#   §3.1 workflow_call only — no pull_request, workflow_run, workflow_dispatch
#   §3.2 one named status: enforcer-status, posted to inputs.sha
#   §3.6 SHA-based loop-skip (replaces broken Enforcer-By trailer check)

name: "Agent: Enforcer (RBG)"

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review"
        type: string
        required: true
      ref:
        description: "Git ref to checkout (PR head branch)"
        type: string
        required: true
      sha:
        description: "PR head SHA — explicit, not derived (§3.1)"
        type: string
        required: true
    secrets:
      AOPS_BOT_GH_TOKEN:
        description: "PAT for GitHub API operations (statuses, reviews)"
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "OAuth token for Claude agent"
        required: true

jobs:
  enforcer:
    name: Enforcer Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-enforcer-${{ inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ inputs.sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      AGENT_NAME: enforcer

    steps:
      # §3.6 SHA-based loop-skip: re-post success if this exact SHA was already reviewed.
      # Replaces v1's broken Enforcer-By trailer check (see PR #1037 / issue #1039).
      # Author identity is irrelevant — only "have we judged this diff?" matters.
      - name: SHA-skip check
        id: sha-skip
        run: |
          LATEST_STATUS=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq "[.[] | select(.context == \"${AGENT_NAME}-status\")] | sort_by(.created_at) | last // empty" 2>/dev/null || echo "")
          PRIOR_TARGET_SHA=$(echo "$LATEST_STATUS" \
            | jq -r '.target_url // empty' 2>/dev/null \
            | sed -n 's/.*target_sha=\([a-f0-9]*\).*/\1/p')

          if [ -n "$PRIOR_TARGET_SHA" ] && [ "$PRIOR_TARGET_SHA" = "$HEAD_SHA" ]; then
            echo "SHA $HEAD_SHA already reviewed — re-posting idempotent success"
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=success \
              -f context="${AGENT_NAME}-status" \
              -f description="Skipped: SHA already reviewed" \
              -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post pending status
        if: steps.sha-skip.outputs.skip != 'true'
        run: |
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="${AGENT_NAME}-status" \
            -f description="Enforcer review in progress" \
            -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"

      - uses: actions/checkout@v4
        if: steps.sha-skip.outputs.skip != 'true'
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AOPS_BOT_GH_TOKEN }}

      # Fetch canonical enforcer prompt from academicOps.
      # Uses sparse checkout to pull only the two prompt files.
      # External consumers calling @enforcer-v1 get the workflow at the tag;
      # the prompt is fetched from the same tag for consistency.
      # Fetch and assemble the enforcer prompt:
      #   rbg.md (personality + detection rules) + enforcer.agent.md (PR framing)
      # Pinned to main for academicOps's own runs; external consumers calling
      # @enforcer-v1 implicitly freeze both files at the tag's commit.
      - name: Fetch enforcer prompt
        id: prompt
        if: steps.sha-skip.outputs.skip != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${{ secrets.AOPS_BOT_GH_TOKEN }}@github.com/nicsuzor/academicOps.git" \
            .aops
          cd .aops && git sparse-checkout set \
            aops-core/agents/rbg.md \
            .github/agents/enforcer.agent.md && cd ..
          PROMPT=$(cat .aops/aops-core/agents/rbg.md .aops/.github/agents/enforcer.agent.md)
          {
            echo "prompt<<AGENT_EOF"
            echo "$PROMPT"
            echo "AGENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Enforcer Review
        id: review
        if: steps.sha-skip.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AGENT_NAME: enforcer
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: '--model sonnet --allowed-tools "Bash,Read,Edit,Write"'
          show_full_output: true

      - name: Upload Claude session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/.claude/projects/
            ~/.claude/sessions/
          if-no-files-found: ignore
          retention-days: 30

      # Fallback: if the agent crashed before posting its own terminal status,
      # the commit status is still pending — flip it to failure so branch
      # protection surfaces a clear signal rather than hanging at pending.
      - name: Post failure status if agent did not complete
        if: always() && steps.sha-skip.outputs.skip != 'true' && steps.review.outcome != 'success'
        run: |
          CURRENT_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == "enforcer-status")] | sort_by(.created_at) | last.state' \
            2>/dev/null || echo "")
          if [ "$CURRENT_STATE" = "pending" ] || [ -z "$CURRENT_STATE" ]; then
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=failure \
              -f context="${AGENT_NAME}-status" \
              -f description="Enforcer agent run failed — see artifacts" \
              -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"
          fi
