# Lint: ruff check + ruff format with autofix on PRs.
# Runs independently — does not gate Type Check or Pytest.
#
# See specs/pr-pipeline.md for the full process documentation.

name: Lint

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

jobs:
  lint:
    timeout-minutes: 10
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Use AOPS_BOT_GH_TOKEN so autofix pushes trigger a new
          # synchronize event, restarting the pipeline on the clean commit.
          # GITHUB_TOKEN pushes are deliberately ignored by GitHub Actions, so
          # NO `|| secrets.GITHUB_TOKEN` fallback (halt-on-failure: no silent fallbacks) —
          # falling back would silently break the autofix retrigger loop.
          token: ${{ secrets.AOPS_BOT_GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen
        timeout-minutes: 5

      # Initial check: identify problems but don't fail the job yet
      - name: Ruff lint (initial)
        id: lint-initial
        continue-on-error: true
        timeout-minutes: 2
        run: uv run ruff check --output-format=github

      - name: Ruff format check (initial)
        id: format-initial
        continue-on-error: true
        timeout-minutes: 2
        run: uv run ruff format --check

      # Auto-heal Gemini-form MCP tool names that may have leaked into source
      # via CI-side commits (which skip pre-commit). See scripts/normalize_mcp_names.py
      # and issue #1128. Exit 1 means rewrites happened; downstream autofix-push
      # step picks up the changes.
      - name: Normalize MCP names (initial)
        id: normalize-initial
        continue-on-error: true
        timeout-minutes: 1
        run: find aops-core .github/agents -name '*.md' -print0 | xargs -0 uv run python scripts/normalize_mcp_names.py

      - name: Validate ruleset alignment (initial)
        id: validate-initial
        continue-on-error: true
        timeout-minutes: 1
        run: ./scripts/validate-ruleset-alignment.sh

      # Autofix and push if any check found problems (PRs and workflow_dispatch)
      - name: Autofix lint and formatting
        if: github.event_name != 'push' && (steps.lint-initial.outcome == 'failure' || steps.format-initial.outcome == 'failure' || steps.validate-initial.outcome == 'failure')
        timeout-minutes: 3
        run: |
          uv run ruff check --fix || true
          uv run ruff format

      - name: Commit and push fixes
        if: github.event_name != 'push' && (steps.lint-initial.outcome == 'failure' || steps.format-initial.outcome == 'failure' || steps.normalize-initial.outcome == 'failure' || steps.validate-initial.outcome == 'failure')
        timeout-minutes: 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
          else
            git commit -m "style: autofix lint, formatting, and MCP name normalization"
            git push
          fi

      # Final gate: re-check after fixes (or confirm clean on first pass)
      - name: Ruff lint (final)
        if: steps.lint-initial.outcome == 'failure'
        timeout-minutes: 2
        run: uv run ruff check --output-format=github

      - name: Ruff format check (final)
        if: steps.format-initial.outcome == 'failure'
        timeout-minutes: 2
        run: uv run ruff format --check

      - name: Normalize MCP names (final)
        if: steps.normalize-initial.outcome == 'failure'
        timeout-minutes: 1
        run: find aops-core .github/agents -name '*.md' -print0 | xargs -0 uv run python scripts/normalize_mcp_names.py

      - name: Validate ruleset alignment (final)
        if: steps.validate-initial.outcome == 'failure'
        timeout-minutes: 1
        run: ./scripts/validate-ruleset-alignment.sh
