name: Issue Sweep Cycle

on:
  schedule:
    - cron: '30 2 * * *' # Daily at 02:30 UTC
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Max issues to process per cycle'
        required: false
        default: '20'
        type: string

jobs:
  issue-sweep:
    name: Issue Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout brain repo
        uses: actions/checkout@v4

      - name: Checkout academicOps
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AOPS_REPO }}
          path: _aops
          token: ${{ secrets.AOPS_DIST_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install academicOps dependencies
        working-directory: _aops
        run: uv sync --frozen

      - name: Configure OpenTelemetry env
        # Forwards the OTel env contract (specs/ARCHITECTURE.md, Observability)
        # into the Claude Code session below via claude-code-action's
        # settings.env mechanism. Forwards only: a contract var absent from
        # this repo's Settings > Variables is omitted, never defaulted.
        env:
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ vars.CLAUDE_CODE_ENABLE_TELEMETRY }}
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: ${{ vars.CLAUDE_CODE_ENHANCED_TELEMETRY_BETA }}
          OTEL_METRICS_EXPORTER: ${{ vars.OTEL_METRICS_EXPORTER }}
          OTEL_LOGS_EXPORTER: ${{ vars.OTEL_LOGS_EXPORTER }}
          OTEL_TRACES_EXPORTER: ${{ vars.OTEL_TRACES_EXPORTER }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
          OTEL_LOG_USER_PROMPTS: ${{ vars.OTEL_LOG_USER_PROMPTS }}
          OTEL_LOG_RAW_API_BODIES: ${{ vars.OTEL_LOG_RAW_API_BODIES }}
          OTEL_LOG_TOOL_DETAILS: ${{ vars.OTEL_LOG_TOOL_DETAILS }}
          OTEL_LOG_ASSISTANT_RESPONSES: ${{ vars.OTEL_LOG_ASSISTANT_RESPONSES }}
          OTEL_METRIC_EXPORT_INTERVAL: ${{ vars.OTEL_METRIC_EXPORT_INTERVAL }}
          OTEL_LOGS_EXPORT_INTERVAL: ${{ vars.OTEL_LOGS_EXPORT_INTERVAL }}
          OTEL_TRACES_EXPORT_INTERVAL: ${{ vars.OTEL_TRACES_EXPORT_INTERVAL }}
        run: |
          jq -n \
            --arg CLAUDE_CODE_ENABLE_TELEMETRY "$CLAUDE_CODE_ENABLE_TELEMETRY" \
            --arg CLAUDE_CODE_ENHANCED_TELEMETRY_BETA "$CLAUDE_CODE_ENHANCED_TELEMETRY_BETA" \
            --arg OTEL_METRICS_EXPORTER "$OTEL_METRICS_EXPORTER" \
            --arg OTEL_LOGS_EXPORTER "$OTEL_LOGS_EXPORTER" \
            --arg OTEL_TRACES_EXPORTER "$OTEL_TRACES_EXPORTER" \
            --arg OTEL_EXPORTER_OTLP_ENDPOINT "$OTEL_EXPORTER_OTLP_ENDPOINT" \
            --arg OTEL_EXPORTER_OTLP_PROTOCOL "$OTEL_EXPORTER_OTLP_PROTOCOL" \
            --arg OTEL_RESOURCE_ATTRIBUTES "$OTEL_RESOURCE_ATTRIBUTES" \
            --arg OTEL_LOG_USER_PROMPTS "$OTEL_LOG_USER_PROMPTS" \
            --arg OTEL_LOG_RAW_API_BODIES "$OTEL_LOG_RAW_API_BODIES" \
            --arg OTEL_LOG_TOOL_DETAILS "$OTEL_LOG_TOOL_DETAILS" \
            --arg OTEL_LOG_ASSISTANT_RESPONSES "$OTEL_LOG_ASSISTANT_RESPONSES" \
            --arg OTEL_METRIC_EXPORT_INTERVAL "$OTEL_METRIC_EXPORT_INTERVAL" \
            --arg OTEL_LOGS_EXPORT_INTERVAL "$OTEL_LOGS_EXPORT_INTERVAL" \
            --arg OTEL_TRACES_EXPORT_INTERVAL "$OTEL_TRACES_EXPORT_INTERVAL" \
            '{env: ($ARGS.named | with_entries(select(.value != "")))}' \
            > "${RUNNER_TEMP}/otel-settings.json"

      - name: Run issue-sweep agent
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ runner.temp }}/otel-settings.json
          prompt: |
            You are the Issue Sweep loop driver running in automation mode.
            Read the unified triage skill for full instructions:
              ${{ github.workspace }}/_aops/.agents/skills/triage/SKILL.md

            Execute in **sweep mode**.

            ## Environment
            - Brain repo (PKB data): ${{ github.workspace }}
            - academicOps (code/issues): ${{ github.workspace }}/_aops
            - Batch limit: ${{ inputs.batch_limit || 20 }} issues per cycle.

            ## CI-Specific Rules & Hard Constraints
            - **No PKB MCP server** — you are working directly with markdown files in the brain repo.
              Use Grep/Glob to search, Write/Edit to create/modify files. Do NOT reference mcp__services__pkb__* tools.
            - **Datestamped Instances**: Since `mcp_pkb_claim_task` is unavailable, manually emulate it.
              Create a new markdown file named `epic-a0523a25-YYYYMMDD-HHMM-ci.md` in the appropriate tasks/ directory,
              copy the frontmatter and body from `epic-a0523a25.md`, update its ID, and append your cycle log there.
            - **Autonomous Dispositions ONLY for Low-Risk**: You may fully execute `close-as-stale`,
              `consolidate-duplicate`, `evidence-bump`, and `single-task` (for single-tasks, create the task file manually).
            - **User Gate / Surfacing**: For framework-change dispositions (`fix-epic` / add-or-escalate),
              you CANNOT ask the user interactively. Instead, surface the proposed cycle plan by appending it
              to the current day's Daily Note (e.g. `daily-YYYYMMDD-*.md`). Do NOT execute `fix-epic` operations.
            - **`recusal`**: Do not invent new rules. Use the cost-ladder review for escalation candidates.
            - **State & Commits**: Commit changes directly to the brain repo's main branch.
            - **Time budget**: 25 minutes. Exit cleanly when time is up.

            Write a summary of what you did to $GITHUB_STEP_SUMMARY. Include:
            - Number of issues processed
            - Disposition counts
            - Any human-gated dispositions surfaced to the daily note.

      - name: Upload Claude session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/.claude/projects/
            ~/.claude/sessions/
          if-no-files-found: ignore
          retention-days: 30

      - name: Propagate issue sweep outcome
        if: always()
        run: |
          if [ "${{ steps.claude.outcome }}" != "success" ]; then
            echo "::error::Issue sweep agent failed or timed out."
            exit 1
          else
            echo "::notice::Issue sweep completed successfully."
          fi
