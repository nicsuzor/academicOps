name: release-please

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: "Override next version (e.g. 1.2.4)"
        required: true
        type: string

  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release_as}}

      - name: Checkout PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@v4

      - name: Update uv.lock
        if: ${{ steps.release.outputs.pr }}
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already up to date"
          else
            git commit -m "chore: update uv.lock for release"
            git push
          fi

      # Note: Since switching from AOPS_DIST_PAT to GITHUB_TOKEN, creating a tag/release
      # via this workflow will no longer automatically trigger build-extension.yml
      # due to GitHub Actions' recursive workflow prevention. It must be triggered manually
      # or via a different token if automation is restored.
