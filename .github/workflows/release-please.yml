name: release-please

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: "Override next version (e.g. 1.2.4)"
        required: true
        type: string

  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.AOPS_DIST_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release_as}}

      # build-extension.yml triggers automatically via push:tags and release:published
      # events when AOPS_DIST_PAT creates the tag/release above.
