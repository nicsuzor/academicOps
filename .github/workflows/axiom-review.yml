# Axiom Review: standalone compliance check on every PR push.
#
# Runs independently from the CI pipeline (pr-pipeline.yml).
# Includes a 120s settle delay to absorb rapid pushes — cancelling
# the cheap sleep is much cheaper than cancelling the agent mid-run.
#
# See specs/pr-pipeline.md for the full process documentation.

name: Axiom Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: axiom-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─── Settle Delay ─────────────────────────────────────────────────
  # Absorbs rapid pushes (including lint autofix commits) by cancelling
  # the cheap sleep rather than the expensive agent run.
  settle:
    name: Settle
    runs-on: ubuntu-latest
    steps:
      - name: Wait for branch to settle
        run: sleep 120

  # ─── Axiom Review ─────────────────────────────────────────────────
  # Auditor checks compliance against axioms, heuristics, and project
  # rules. Posts CHANGES_REQUESTED if violations found. Read-only —
  # never pushes code.
  axiom-review:
    name: Axiom Review
    needs: [settle]
    uses: ./.github/workflows/agent-auditor.yml
    with:
      pr_number: "${{ github.event.pull_request.number }}"
      ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit
