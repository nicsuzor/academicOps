# Trigger: Enforcer (academicOps) — MANUAL entrypoint only.
#
# Fires the v2 enforcer reusable workflow on demand: the `/enforce` PR comment
# and manual workflow_dispatch. This is the academicOps-side shim — external
# consumers define an equivalent file pointing to @enforcer-v1 (see
# specs/workflows/pr-pipeline.md §7).
#
# DELIBERATELY NO `pull_request` trigger (aops-db83bad5). The automatic per-PR
# enforcer path is owned SOLELY by pr-pipeline.yml (job `enforcer`, also on
# `pull_request`). When this shim ALSO subscribed to `pull_request`, both callers
# invoked agent-enforcer.yml on the same SHA; they share the per-PR concurrency
# group `agent-enforcer-${pr}` (cancel-in-progress: true), so the second-to-queue
# cancelled the first mid-agent — burning a full agent invocation and leaving a
# guaranteed `cancelled` run polluting the checks surface on every PR open
# (forensic: PR #1700, runs 27250704371/86/96). The authoritative named status
# `enforcer-status` is posted by agent-enforcer.yml to the head SHA regardless of
# caller, so dropping this `pull_request` trigger does NOT remove any required
# check (ruleset pr-review-and-merge.yml) — pr-pipeline still posts it.
#
# The reusable workflow (agent-enforcer.yml) accepts explicit pr_number,
# ref, and sha inputs — no event-context magic inside the callee.

name: "Trigger: Enforcer"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (PR head branch)'
        required: false
        type: string
      sha:
        description: 'PR head SHA'
        required: false
        type: string

# RCA aops-31798611 — fix for 100% startup_failure of this workflow.
# This caller previously declared NO permissions, so its GITHUB_TOKEN fell back
# to the repository default. The reusable callee (agent-enforcer.yml) declares a
# job that requests contents/pull-requests/statuses/issues: write. A reusable
# workflow's job can never be granted more than the caller holds, so when the
# caller's default token is more restricted than that request, GitHub rejects the
# workflow at graph-build time (startup_failure) for 100% of invocations — before
# any job runs and independent of input values (which is why the manual
# workflow_dispatch failed identically). The caller must grant at least the union
# of permissions any nested job requests.
permissions:
  contents: write
  pull-requests: write
  statuses: write
  issues: write
  id-token: write

jobs:
  resolve:
    name: Resolve PR context
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/enforce') && contains(fromJson('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.comment.author_association))
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve PR details
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e

          PR_NUMBER=""
          REF=""
          SHA=""

          # No `pull_request` branch: the automatic per-PR path is owned by
          # pr-pipeline.yml (aops-db83bad5). This shim handles only the manual
          # entrypoints — workflow_dispatch and the `/enforce` PR comment.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            REF="$INPUT_REF"
            SHA="$INPUT_SHA"

          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            PR_NUMBER="$ISSUE_NUMBER"
          fi

          if [[ -z "$REF" || -z "$SHA" ]]; then
            echo "Fetching PR details for PR $PR_NUMBER..."
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
            REF=$(echo "$PR_JSON" | jq -r .head.ref)
            SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  enforce:
    needs: resolve
    uses: ./.github/workflows/agent-enforcer.yml
    with:
      pr_number: "${{ needs.resolve.outputs.pr_number }}"
      ref: ${{ needs.resolve.outputs.ref }}
      sha: ${{ needs.resolve.outputs.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
