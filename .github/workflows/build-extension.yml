name: Build and Deploy

on:
  # Tag-driven. The tag SHAPE selects the channel (classified in "Resolve build
  # context" below):
  #   vX.Y.Z                     → stable: build, publish dist to the `dist`
  #                                branch, release.
  #   vX.Y.Z-rc.N / -dev.N / ... → prerelease: build + cut a `--prerelease`
  #                                GitHub Release with installable assets; the
  #                                `dist` branch (the stable install channel) is
  #                                left UNTOUCHED.
  # A tag push runs THIS file from the tagged commit, which is the source trunk
  # (dev, the default branch). release-please creates the stable vX.Y.Z tag with
  # AOPS_DIST_PAT;
  # prerelease tags are pushed by hand (or a future release-please prerelease
  # config). We deliberately do NOT trigger on `release: published` — a release
  # event runs the DEFAULT branch's copy of this file (default-branch semantics)
  # and would double-fire against the tag-triggered run.
  push:
    tags: ['v*']

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build extensions and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve build context
        id: ctx
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v*-* ]]; then
            # Pre-release tag (v1.2.3-rc.1, -dev.N, -beta.N, -alpha.N). Checked
            # FIRST because the v*-* glob is a subset of the plain v* glob below;
            # in semver a '-' only ever introduces a pre-release identifier.
            REF="${{ github.ref_name }}"
            RTYPE="testing"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Stable release tag (v1.2.3).
            REF="${{ github.ref_name }}"
            RTYPE="stable"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            REF="${{ github.event.release.tag_name }}"
            RTYPE="stable"
          else
            REF="${{ github.sha }}"
            RTYPE="stable"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_type=$RTYPE" >> "$GITHUB_OUTPUT"
          echo "::notice title=Build context::ref=$REF release_type=$RTYPE"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.ref }}
          fetch-depth: 0

      - name: Checkout dist branch for publish target
        # Stable only — prereleases never touch the dist branch (the stable
        # install channel); see the "Publish distribution to dist" step.
        if: steps.ctx.outputs.release_type != 'testing'
        uses: actions/checkout@v4
        with:
          ref: dist
          path: dist-repo
          token: ${{ secrets.AOPS_DIST_PAT }}

      - name: Checkout nicsuzor/aops (Cowork default-branch mirror)
        # Cowork installs with `claude plugin marketplace add nicsuzor/aops` and
        # cannot pin a non-default branch, so it can't read academicOps' `@dist`.
        # nicsuzor/aops carries the SAME distribution on its DEFAULT branch
        # (main) — a default-branch twin of the dist branch. Stable only, exactly
        # like the dist publish. Requires AOPS_DIST_PAT to have write access to
        # nicsuzor/aops (the PAT already scopes the aops dist repo).
        if: steps.ctx.outputs.release_type != 'testing'
        uses: actions/checkout@v4
        with:
          repository: nicsuzor/aops
          ref: main
          path: aops-repo
          token: ${{ secrets.AOPS_DIST_PAT }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compute version
        id: version
        run: |
          chmod +x scripts/version.py
          if [ "${{ steps.ctx.outputs.release_type }}" = "testing" ]; then
            # Pre-release: the tag IS the version (v0.3.36-rc.1 → 0.3.36-rc.1).
            # build.py --set-version normalises it via sanitize_version(), and the
            # patch-bump in get_project_version() already guarantees a dev/rc build
            # sorts ABOVE the last stable tag and BELOW the next stable — the semver
            # invariant the Claude marketplace and Gemini extension installers need.
            VERSION="${{ steps.ctx.outputs.ref }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(uv run python scripts/version.py --get)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build dist artifacts
        # PKB ships as a remote MCP server (run-mcp.sh resolves PKB_MCP_URL), so
        # no per-platform binary is bundled — one platform-independent build.
        env:
          ACA_DATA: ${{ github.workspace }}
        run: |
          VERSION_FLAG=""
          if [ "${{ steps.ctx.outputs.release_type }}" = "testing" ]; then
            VERSION_FLAG="--set-version ${{ steps.version.outputs.version }}"
          fi
          uv run python scripts/build.py $VERSION_FLAG

      - name: Publish distribution to dist
        # Stable only. A prerelease must NOT overwrite the dist branch's
        # marketplace.json — that would auto-ship the -rc/-dev build to every
        # `marketplace add nicsuzor/academicOps@dist` user. Prereleases live
        # solely as `--prerelease` GitHub Releases (next step); testers install
        # them by tag.
        if: steps.ctx.outputs.release_type != 'testing'
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}"

          # `dist` is the published distribution branch (non-default orphan). Built
          # plugin dirs live UNDER dist/ on it (e.g. dist:dist/aops-claude),
          # matching both the marketplace sources (./dist/aops-*, generated at the
          # SOURCE repo root by build.py) and the local-dev layout — one convention
          # everywhere. `claude plugin marketplace add nicsuzor/academicOps@dist`
          # reads the root marketplace on the dist branch and resolves ./dist/aops-*
          # within that ref.
          cd "${SRC}/dist-repo"

          # Mirror every built plugin directory under dist/, each kept clean with
          # --delete. The `*/` glob skips dot-entries, so only the aops-* payload
          # dirs are copied. Release archives (*.tar.gz / *.zip) are FILES under
          # ${SRC}/dist/ → not matched by the dir glob; they ship as GitHub
          # Release assets in the next step (never committed to the dist branch).
          mkdir -p dist
          for d in "${SRC}"/dist/*/; do
            name="$(basename "$d")"
            rsync -a --delete "$d" "dist/${name}/"
          done

          # Single Claude marketplace at the dist-branch root (sources ./dist/aops-*).
          # Gemini ships as a self-contained GitHub Release tarball, so no root
          # gemini-extension.json is published here.
          mkdir -p .claude-plugin
          cp "${SRC}/.claude-plugin/marketplace.json" .claude-plugin/marketplace.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # The built payload is gitignored (dist/ by .gitignore;
          # .claude-plugin/marketplace.json by name), so `git add -A` skips it —
          # force-add it. A missing marketplace is a broken build → `git add -f`
          # exits non-zero and `set -e` fails the publish loudly rather than
          # shipping a payload with no marketplace.
          git add -f dist
          git add -f .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "dist already in sync — nothing to publish"
          else
            git commit -m "chore: publish v${{ steps.version.outputs.version }} distribution [skip ci]"
            # Fast-forward (dist-repo is checked out at dist HEAD) — no force push,
            # so a non-fast-forward branch rule on dist can stay enforced.
            git push origin dist
          fi

      - name: Publish distribution to nicsuzor/aops (Cowork mirror)
        # Mirror the exact dist-branch tree (.claude-plugin/marketplace.json +
        # dist/aops-*) onto nicsuzor/aops' default branch so Cowork — which can't
        # pin academicOps@dist — installs the identical distribution from
        # `nicsuzor/aops`. Same layout, same relative paths; only the remote
        # differs. Stable only (testing builds never ship to a stable channel).
        if: steps.ctx.outputs.release_type != 'testing'
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}"
          cd "${SRC}/aops-repo"

          # Migrate the legacy root-level payload (aops-claude/ at the repo root,
          # marketplace sourcing ./aops-*) to the dist-branch convention: payload
          # under dist/, marketplace sourcing ./dist/aops-*. Drop the stale
          # top-level dirs + root gemini-extension.json so the mirror is a clean
          # twin of the dist branch, not a hybrid of both layouts. No-op once
          # migrated. .github/ is left untouched.
          rm -rf aops-claude aops-cowork aops-gemini aops-tools-claude \
                 aops-tools-gemini aops-antigravity aops-tools-antigravity \
                 gemini-extension.json

          # Same publish convention as the dist branch: each built plugin dir
          # mirrored under dist/ with --delete; the */ glob skips dot-entries and
          # the *.tar.gz release archives (those are FILES, shipped only as GitHub
          # Release assets on academicOps).
          mkdir -p dist
          for d in "${SRC}"/dist/*/; do
            name="$(basename "$d")"
            rsync -a --delete "$d" "dist/${name}/"
          done

          # Root Claude marketplace (sources ./dist/aops-*), identical to the dist
          # branch root. This adds the aops-cowork plugin entry the legacy aops
          # marketplace lacked.
          mkdir -p .claude-plugin
          cp "${SRC}/.claude-plugin/marketplace.json" .claude-plugin/marketplace.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # dist/ and marketplace.json are gitignored in the SOURCE repo; force-add
          # so the mirror carries them. A missing marketplace is a broken build →
          # `git add -f` exits non-zero under set -e and fails loudly.
          git add -f dist
          git add -f .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "nicsuzor/aops already in sync — nothing to publish"
          else
            git commit -m "chore: publish v${{ steps.version.outputs.version }} distribution [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload archives to GitHub Release v${{ steps.version.outputs.version }}
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ steps.ctx.outputs.release_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          [ "$RELEASE_TYPE" = "testing" ] && PRERELEASE_FLAG="--prerelease"

          ARCHIVES=""
          for f in dist/*.tar.gz; do
            [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"
          done

          if [ -z "$ARCHIVES" ]; then
            echo "::error::No archives in dist/"
            exit 1
          fi

          gh release upload "v$VERSION" $ARCHIVES --clobber || \
          gh release create "v$VERSION" --title "v$VERSION" --notes "AcademicOps v$VERSION" $PRERELEASE_FLAG $ARCHIVES
