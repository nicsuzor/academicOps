name: Build and Deploy

on:
  # Tag-driven. The tag SHAPE selects the channel (classified in "Resolve build
  # context" below):
  #   vX.Y.Z                     → stable: build, publish to the `dist` branch,
  #                                cut a normal GitHub Release, push Docker.
  #   vX.Y.Z-rc.N / -dev.N / ... → prerelease ("testing"): build and publish to
  #                                the `dist` branch TOO — we DO ship dev builds
  #                                to dist. The published plugin version is a
  #                                semver prerelease (-dev/-beta/-rc), and the
  #                                GitHub Release is cut `--prerelease`. Because
  #                                the version is a semver prerelease, semver-aware
  #                                consumers don't pick it as latest-stable (the
  #                                stable-tag filter is build/version.py
  #                                `_STABLE_TAG_RE`), so a client CHOOSES whether to
  #                                install a dev build — but see the marketplace
  #                                single-version caveat on the publish step below.
  #                                Docker is NOT pushed (`:latest` tracks stable).
  # A tag push runs THIS file from the tagged commit, which is the source trunk
  # (dev, the default branch). release-please creates the stable vX.Y.Z tag with
  # AOPS_DIST_PAT; prerelease tags are pushed by hand (see `make prerelease`).
  # We deliberately do NOT trigger on `release: published` — a release
  # event runs the DEFAULT branch's copy of this file (default-branch semantics)
  # and would double-fire against the tag-triggered run.
  push:
    tags: ["v*"]

concurrency:
  # A stable tag's build-and-deploy job pauses on the `production` environment
  # reviewer (the ONE human approval, §3.13) — while it's paused it is still
  # "in progress" from concurrency's point of view. cancel-in-progress: true
  # here silently cancelled that pending approval the instant the NEXT tag
  # landed (release-please's fast path can cut one every few minutes), so a
  # burst of releases each superseded the last before Nic ever saw a prompt —
  # looked indistinguishable from "shipped with no approval" even though the
  # cancelled runs never actually published. Queue instead: never drop a
  # pending or completed deploy; each tag gets its own turn at the gate.
  group: build-deploy
  cancel-in-progress: false

jobs:
  # ── Test gate: nothing publishes that has not passed the suite ─────────────
  # This workflow used to be a single `build-and-deploy` job with no reference
  # to any test workflow at all, so a tag push went straight to the `dist`
  # branch, the GitHub Release and GHCR with zero evidence the tagged commit
  # even imported. The tag is the only human action in the release path, and a
  # "run the tests first" precondition that lives only in someone's head is not
  # a gate — this is (aops_v091_ci_never_ran).
  #
  # Reuses pytest.yml via workflow_call, so the publish path runs the SAME steps
  # as a PR and a push to an integration branch — one definition, three entry
  # points. Applies to BOTH channels: a prerelease tag ships to `dist` exactly
  # like a stable one, so it is gated exactly like one.
  test:
    name: Pytest
    uses: ./.github/workflows/pytest.yml
    permissions:
      contents: read

  build-and-deploy:
    name: Build extensions and publish release assets
    runs-on: ubuntu-latest
    # Hard gate — every publish step below (dist branch, GHCR, Release assets)
    # is downstream of this. A failing suite fails the tag, and nothing ships.
    needs: test
    # Human approval for the whole release now happens when the maintainer MERGES the
    # release-please PR — a deliberate, notified action on the PR page that cuts the
    # stable `vX.Y.Z` tag. By the time this job runs the release is therefore already
    # approved, so there is NO separate `production` environment gate here. The old
    # gate lived in the Actions tab (Run → "Review deployments"), was easy to miss,
    # and froze the `dist` branch when stable releases piled up unapproved and their
    # tag-triggered deploys were cancelled (v0.3.49→v0.3.69 all cancelled unpublished).
    permissions:
      contents: write
      packages: write # push ghcr.io/nicsuzor/aops-crew on stable tags (A3)
    steps:
      - name: Resolve build context
        id: ctx
        run: |
          # ${{ github.ref }} is a runtime value, but actionlint substitutes a
          # static placeholder before shellcheck, which then misreads these glob
          # tests as SC2193 "can never be equal". The runtime comparison is correct.
          # shellcheck disable=SC2193
          if [[ "${{ github.ref }}" == refs/tags/v*-* ]]; then
            # Pre-release tag (v1.2.3-rc.1, -dev.N, -beta.N, -alpha.N). Checked
            # FIRST because the v*-* glob is a subset of the plain v* glob below;
            # in semver a '-' only ever introduces a pre-release identifier.
            REF="${{ github.ref_name }}"
            RTYPE="testing"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Stable release tag (v1.2.3).
            REF="${{ github.ref_name }}"
            RTYPE="stable"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            REF="${{ github.event.release.tag_name }}"
            RTYPE="stable"
          else
            REF="${{ github.sha }}"
            RTYPE="stable"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_type=$RTYPE" >> "$GITHUB_OUTPUT"
          echo "::notice title=Build context::ref=$REF release_type=$RTYPE"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.ref }}
          fetch-depth: 0

      - name: Checkout dist branch for publish target
        # Runs for BOTH stable and prerelease builds — dev/testing builds publish
        # to `dist` too (see the "Publish distribution to dist" step), so the dist
        # branch is always checked out as the publish target.
        uses: actions/checkout@v4
        with:
          ref: dist
          path: dist-repo
          token: ${{ secrets.AOPS_DIST_PAT }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compute version
        id: version
        run: |
          REF="${{ steps.ctx.outputs.ref }}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Tag-driven build — the tag IS the version, for BOTH stable (vX.Y.Z) and
            # prerelease (vX.Y.Z-rc.N / -dev.N) tags. Use it verbatim. Do NOT run
            # `version.py --get` here: it derives from `git describe --dirty`, and by
            # this point the build has dirtied the working tree, so it would emit
            # `X.Y.Z-dev.0+gSHA.dirty` even on a clean stable tag (G1 — see
            # specs/workflows/releasing.md §4). release-please owns the
            # stable tag = manifest; the next step asserts that coherence. For a
            # prerelease, build.py --set-version normalises via sanitize_version() (the
            # semver-sort invariant the Claude/agy installers need).
            VERSION="${REF#v}"
          else
            # Non-tag build (manual workflow_dispatch on a SHA): no tag to read, so
            # fall back to the computed dev version.
            VERSION="$(uv run python -m build.version --get)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$VERSION"

      - name: Assert version coherence (stable tag only)
        # G2 — fail closed if the tag, the committed pyproject version, and the
        # release-please manifest disagree. Guards against a hand-pushed or
        # release_as-overridden tag publishing a version that does not match the
        # committed source. Stable tags only: prereleases are hand-cut and not tracked
        # by the manifest; manual SHA builds have no tag.
        if: steps.ctx.outputs.release_type == 'stable' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_V="${{ steps.version.outputs.version }}"
          PYPROJECT_V="$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          MANIFEST_V="$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('.release-please-manifest.json').read_text())['.'])")"
          echo "tag=$TAG_V pyproject=$PYPROJECT_V manifest=$MANIFEST_V"
          if [ "$TAG_V" != "$PYPROJECT_V" ] || [ "$TAG_V" != "$MANIFEST_V" ]; then
            echo "::error title=Version mismatch::tag=$TAG_V pyproject=$PYPROJECT_V manifest=$MANIFEST_V — stable release aborted (G2)"
            exit 1
          fi
          echo "Version coherence OK: $TAG_V"

      - name: Build dist artifacts
        env:
          ACA_DATA: ${{ github.workspace }}
        run: |
          # Always stamp the version computed above (clean tag for stable, normalised
          # prerelease for testing). Without this on the STABLE path, build.py falls
          # through to its git-describe resolver, which on the build-dirtied tree emits
          # a bogus NEXT-dev version (G1) — e.g. v0.3.70 was published as
          # 0.3.71-dev.0+gSHA.dirty, a PRERELEASE string for what is a stable release,
          # so semver-aware installers mis-rank it. The guard used to cover only the
          # testing path; stable needs it too (mem_c006704b).
          VERSION_FLAG="--set-version ${{ steps.version.outputs.version }}"
          # $VERSION_FLAG must word-split into separate args
          # ("--set-version X.Y.Z"), so SC2086 quoting would break it.
          # shellcheck disable=SC2086
          uv run python -m build.build $VERSION_FLAG

      - name: Publish distribution to dist
        # Runs for BOTH stable and prerelease builds. We DO ship dev builds to the
        # `dist` branch so testers/clients can install them. The published plugin
        # version is a semver prerelease (-dev/-beta/-rc); stable resolution
        # excludes prereleases (tests/test_semver_regression.py), so a client
        # CHOOSES whether to install a dev build rather than being force-upgraded.
        # NOTE: the dist-branch root marketplace.json carries a single version per
        # plugin and is refreshed on every publish, so the most recent build (dev
        # or stable) is what a fresh `marketplace add …@dist` + `plugin install`
        # resolves. Docker (below) stays stable-only — `:latest` must track stable.
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}"

          # `dist` is the published distribution branch (non-default orphan). Built
          # plugin dirs live AT THE ROOT of it (e.g. dist:aops-claude), matching
          # both the marketplace sources (./aops-*, generated at the SOURCE repo
          # root by build.py) and the local-dev layout — one convention
          # everywhere. `claude plugin marketplace add nicsuzor/academicOps@dist`
          # reads the root marketplace on the dist branch and resolves ./aops-*
          # within that ref.
          cd "${SRC}/dist-repo"

          # One-time migration off the old layout: earlier publishes nested
          # every plugin dir under a `dist/` subdirectory of this branch
          # (dist:dist/aops-claude). That subdir is superseded by the
          # root-level layout below — remove it so a stale copy doesn't sit
          # alongside the new root-level dirs.
          rm -rf dist

          # Mirror every built plugin directory to the branch root, each kept
          # clean with --delete. The `*/` glob skips dot-entries, so only the
          # aops-* payload dirs are copied. Release archives (*.tar.gz / *.zip)
          # are FILES under ${SRC}/dist/ → not matched by the dir glob; they
          # ship as GitHub Release assets in the next step (never committed to
          # the dist branch).
          plugin_dirs=""
          for d in "${SRC}"/dist/*/; do
            name="$(basename "$d")"
            rsync -a --delete "$d" "${name}/"
            plugin_dirs="$plugin_dirs $name"
          done

          # Single Claude marketplace at the dist-branch root (sources ./aops-*).
          mkdir -p .claude-plugin
          cp "${SRC}/dist/marketplace-production.json" ".claude-plugin/marketplace.json"

          # Publish the PR-pipeline reusable workflows so external consumers can
          # pin `uses: nicsuzor/academicOps/.github/workflows/pr-pipeline.yml@dist`
          # — a ref that auto-advances on every release with no manual step,
          # replacing the pipeline-v1 static tag that silently drifted (aops_1a4b8e23).
          # The dependency set is DERIVED from pr-pipeline.yml's own relative
          # `uses: ./.github/workflows/*.yml` lines, not hand-maintained here, so a
          # new sub-job can't silently fall out of sync with what ships to dist —
          # exactly the kind of second half-trusted path this fix removes.
          mkdir -p .github/workflows
          cp "${SRC}/.github/workflows/pr-pipeline.yml" .github/workflows/pr-pipeline.yml
          if grep -qE 'uses:\s*\./\.github/workflows/' "${SRC}/.github/workflows/pr-pipeline.yml"; then
            grep -oP 'uses:\s*\./\.github/workflows/\K[\w.-]+\.ya?ml' \
              "${SRC}/.github/workflows/pr-pipeline.yml" | sort -u | while read -r wf; do
              cp "${SRC}/.github/workflows/${wf}" ".github/workflows/${wf}"
            done
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # shellcheck disable=SC2086
          git add -f $plugin_dirs
          git add -f .github/workflows
          git add -f .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "dist already in sync — nothing to publish"
          else
            git commit -m "chore: publish v${{ steps.version.outputs.version }} distribution [skip ci]"
            # Fast-forward (dist-repo is checked out at dist HEAD) — no force push,
            # so a non-fast-forward branch rule on dist can stay enforced.
            git push origin dist
          fi

      # ── Docker: publish the polecat worker/crew image (stable only, A3) ──────
      # Built AFTER the dist publish so the image's `git clone --branch dist` (see
      # Dockerfile) pulls the version just shipped. Prereleases never publish the
      # image — `:latest` must track the stable channel, exactly like the dist branch.
      - name: Set up Docker Buildx
        if: steps.ctx.outputs.release_type != 'testing'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.ctx.outputs.release_type != 'testing'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AOPS_DIST_PAT }}

      - name: Build and push aops-crew image
        if: steps.ctx.outputs.release_type != 'testing'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/nicsuzor/aops-crew:v${{ steps.version.outputs.version }}
            ghcr.io/nicsuzor/aops-crew:latest
          build-args: |
            AOPS_REPO_URL=https://github.com/nicsuzor/academicOps.git
            AOPS_DIST_REF=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload archives to GitHub Release v${{ steps.version.outputs.version }}
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ steps.ctx.outputs.release_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          [ "$RELEASE_TYPE" = "testing" ] && PRERELEASE_FLAG="--prerelease"

          ARCHIVES=""
          for f in dist/*.tar.gz; do
            [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"
          done

          if [ -z "$ARCHIVES" ]; then
            echo "::error::No archives in dist/"
            exit 1
          fi

          # $ARCHIVES (space-separated file list) and $PRERELEASE_FLAG must
          # word-split into multiple args, so SC2086 quoting would break them.
          # shellcheck disable=SC2086
          gh release upload "v$VERSION" $ARCHIVES --clobber || \
          gh release create "v$VERSION" --title "v$VERSION" --notes "AcademicOps v$VERSION" $PRERELEASE_FLAG $ARCHIVES
