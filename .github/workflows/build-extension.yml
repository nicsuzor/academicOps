name: Build and Deploy

# Slim dispatcher: fires a repository_dispatch at nicsuzor/aops, which owns
# the actual build and release. The aops workflow checks out this repo (public),
# downloads pkb binaries from nicsuzor/mem (public), builds, and commits/releases
# on itself using its own GITHUB_TOKEN.
#
# Secret required: AOPS_DIST_PAT
#   Minimum scope (fine-grained PAT on nicsuzor/aops only):
#     - Contents: Read and write   (needed to dispatch; Metadata: Read implied)
#   Or a GitHub App installed on nicsuzor/aops with Contents: Write and an
#   actions/create-github-app-token step to mint the token in-workflow.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create a pre-release version (testing build)'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref and release type
        id: ctx
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release_type=stable" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "release_type=stable" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "release_type=testing" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "release_type=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire repository_dispatch at nicsuzor/aops
        env:
          GH_TOKEN: ${{ secrets.AOPS_DIST_PAT }}
        run: |
          gh api repos/nicsuzor/aops/dispatches \
            -f event_type=build-aops-extension \
            -f client_payload[ref]='${{ steps.ctx.outputs.ref }}' \
            -f client_payload[release_type]='${{ steps.ctx.outputs.release_type }}' \
            -f client_payload[source_sha]='${{ github.sha }}' \
            -f client_payload[source_run_id]='${{ github.run_id }}'
          echo "Dispatched build-aops-extension for ref=${{ steps.ctx.outputs.ref }} type=${{ steps.ctx.outputs.release_type }}"
