name: Build and Deploy

on:
  push:
    tags: ['v*']  # Only trigger automatically on tag pushes (stable releases)
  release:
    types: [published]  # Trigger when release-plz creates a GitHub release
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create a pre-release version (testing build)'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  # Step 1: Download PKB binaries from nicsuzor/mem releases
  download-pkb-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_label: x86_64-linux
            output_name: pkb-linux-x86_64
          - artifact_label: aarch64-darwin
            output_name: pkb-macos-aarch64

    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.AOPS_DIST_PAT }}
        run: |
          # Find the latest release that actually has binary assets
          # (some releases may be created without artifacts)
          TAG=$(gh api repos/nicsuzor/mem/releases --jq '
            [.[] | select(.assets | length > 0)] | .[0].tag_name
          ')
          if [ -z "$TAG" ]; then
            echo "::error::No mem release found with binary assets"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using latest release with assets: $TAG"

      - name: Download release archive
        env:
          GH_TOKEN: ${{ secrets.AOPS_DIST_PAT }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ARCHIVE="mem-${TAG}-${{ matrix.artifact_label }}.tar.gz"
          echo "Downloading $ARCHIVE from nicsuzor/mem release $TAG"

          gh release download "$TAG" \
            --repo nicsuzor/mem \
            --pattern "$ARCHIVE"

          # Extract binaries (aops CLI merged into pkb as of mem v0.3.0)
          mkdir -p output
          tar xzf "$ARCHIVE" -C output
          chmod +x output/pkb
          echo "Extracted binaries:"
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            output/pkb
          if-no-files-found: error

  # Step 2: Build extension packages with platform-specific binaries
  build-and-deploy:
    needs: download-pkb-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating releases on dist repo
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection
          token: ${{ secrets.AOPS_DIST_PAT }}  # PAT required to push past branch protection

      - name: Determine release type
        id: release_type
        run: |
          # Tag pushes (v*) produce stable releases
          # workflow_dispatch with prerelease=true produces testing pre-releases
          # workflow_dispatch without prerelease produces stable releases from HEAD
          # shellcheck disable=SC2193  # github.ref is substituted at runtime, not a literal empty string
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=stable" >> "$GITHUB_OUTPUT"
            echo "Release type: stable (tag push)"
          elif [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "type=testing" >> "$GITHUB_OUTPUT"
            echo "Release type: testing (pre-release requested via workflow_dispatch)"
          else
            echo "type=stable" >> "$GITHUB_OUTPUT"
            echo "Release type: stable (workflow_dispatch without prerelease)"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Get project version
        id: version
        run: |
          # Use scripts/version.py which is more robust than raw build.py calls
          chmod +x scripts/version.py
          BASE_VERSION=$(uv run python scripts/version.py --get)
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.release_type.outputs.type }}" = "testing" ]; then
            # Ensure pre-release versions are strictly increasing and semver-compliant.
            # If base version is already a dev version (e.g. 0.3.13-dev.49),
            # append the run number to ensure uniqueness without losing the commit count.
            if [[ "$BASE_VERSION" == *-dev.* ]]; then
              # Already a dev version from git describe, append run number for CI uniqueness
              VERSION="${BASE_VERSION}.${{ github.run_number }}"
            else
              # Stable base, start a new dev sequence
              CLEAN_VERSION=$(echo "$BASE_VERSION" | sed -E 's/([-+\.]dev|[-+]).*//')
              VERSION="${CLEAN_VERSION}-dev.${{ github.run_number }}"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Testing version: $VERSION (base: $BASE_VERSION)"
          else
            echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "Stable version: $BASE_VERSION"
          fi

      - name: Download PKB binaries
        uses: actions/download-artifact@v4
        with:
          path: pkb-binaries/

      - name: Check if version changed
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.AOPS_DIST_PAT }}
        run: |
          # Testing builds always deploy (version includes run_number so is always unique)
          if [ "${{ steps.release_type.outputs.type }}" = "testing" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Testing build: always deploy"
          else
            # Check current version in the dist repo
            DIST_VERSION=$(gh api repos/nicsuzor/aops/contents/aops-claude/.claude-plugin/plugin.json \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" 2>/dev/null) || true
            if [ -n "$DIST_VERSION" ] && [ "$DIST_VERSION" = "${{ steps.version.outputs.version }}" ]; then
              echo "version_changed=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged ($DIST_VERSION), skipping build"
            else
              echo "version_changed=true" >> "$GITHUB_OUTPUT"
              echo "Version changed: ${DIST_VERSION:-<none>} -> ${{ steps.version.outputs.version }}"
            fi
          fi

      - name: Build platform-specific distributions
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          VERSION_FLAG=""
          if [ "${{ steps.release_type.outputs.type }}" = "testing" ]; then
            VERSION_FLAG="--set-version ${{ steps.version.outputs.version }}"
          fi

          # Build for each platform that has a binary
          for platform_dir in pkb-binaries/pkb-*; do
            ARTIFACT_NAME=$(basename "$platform_dir")
            # Extract platform info: pkb-{os}-{arch}
            PLATFORM_LABEL="${ARTIFACT_NAME#pkb-}"

            echo "Building with PKB binary: $ARTIFACT_NAME ($PLATFORM_LABEL)"

            # shellcheck disable=SC2086  # VERSION_FLAG intentionally word-splits into separate args
            uv run python scripts/build.py \
              --pkb-binary "$platform_dir/pkb" \
              --target-platform "$PLATFORM_LABEL" \
              $VERSION_FLAG
          done

          # Also build a generic (no-binary) version for fallback
          echo "Building generic (no PKB binary) distribution"
          # shellcheck disable=SC2086  # VERSION_FLAG intentionally word-splits into separate args
          uv run python scripts/build.py $VERSION_FLAG
        env:
          ACA_DATA: ${{ github.workspace }}

      - name: Push dist to nicsuzor/aops
        if: steps.check_version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
          GH_TOKEN: ${{ secrets.AOPS_DIST_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the dist repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/nicsuzor/aops.git" /tmp/aops-dist

          # Sync plugin directories (mirror, removing stale files)
          rsync -a --delete dist/aops-claude/ /tmp/aops-dist/aops-claude/
          rsync -a --delete dist/aops-cowork/ /tmp/aops-dist/aops-cowork/

          # Copy Gemini extension (gemini-extension.json must be at repo root for gemini CLI)
          rsync -a --delete dist/aops-gemini/ /tmp/aops-dist/aops-gemini/
          cp dist/aops-gemini/gemini-extension.json /tmp/aops-dist/gemini-extension.json

          # Copy generated marketplace.json (for Claude Code)
          mkdir -p /tmp/aops-dist/.claude-plugin
          cp dist/.claude-plugin/marketplace.json /tmp/aops-dist/.claude-plugin/marketplace.json

          # Commit and push
          cd /tmp/aops-dist
          COMMIT_PREFIX="Release"
          if [ "$RELEASE_TYPE" = "testing" ]; then
            COMMIT_PREFIX="Testing release"
          fi
          git add -A
          git commit -m "chore: $COMMIT_PREFIX v$VERSION" || echo "No changes to commit"
          git push origin main

      - name: Create GitHub Release on dist repo
        if: steps.check_version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
          GH_TOKEN: ${{ secrets.AOPS_DIST_PAT }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$RELEASE_TYPE" = "testing" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Collect all release archives (Gemini + Claude platform-specific)
          ARCHIVES=""
          for f in ${{ github.workspace }}/dist/*.tar.gz; do
            [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"
          done

          if [ -n "$ARCHIVES" ]; then
            # shellcheck disable=SC2086  # ARCHIVES and PRERELEASE_FLAG intentionally word-split
            gh release upload "v$VERSION" $ARCHIVES --clobber --repo nicsuzor/aops \
              || gh release create "v$VERSION" \
                --repo nicsuzor/aops \
                --title "v$VERSION" \
                --notes "AcademicOps v$VERSION" \
                $PRERELEASE_FLAG \
                $ARCHIVES
          fi
