name: Build and Deploy

on:
  # Tag-only: release-please creates the vX.Y.Z tag with AOPS_DIST_PAT, which
  # triggers this run from the TAGGED commit's workflow (i.e. dev's version).
  # We deliberately do NOT also trigger on `release: published` — that event
  # would run main's copy of this file (default-branch semantics), which the
  # release pipeline never updates, and would double-fire against the tag run.
  push:
    tags: ['v*']

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  download-pkb-binaries:
    name: Fetch pkb binary (${{ matrix.artifact_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_label: x86_64-linux
            output_name: pkb-linux-x86_64
          - artifact_label: aarch64-darwin
            output_name: pkb-macos-aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest mem release with assets
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/nicsuzor/mem/releases --jq '
            [.[] | select(.assets | length > 0)] | .[0].tag_name // ""
          ')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No nicsuzor/mem release found with binary assets"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download ${{ matrix.artifact_label }} archive from mem release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ARCHIVE="mem-${TAG}-${{ matrix.artifact_label }}.tar.gz"
          gh release download "$TAG" --repo nicsuzor/mem --pattern "$ARCHIVE"
          mkdir -p output
          tar xzf "$ARCHIVE" -C output
          chmod +x output/pkb

      - name: Upload pkb binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: output/pkb
          if-no-files-found: error

  build-and-deploy:
    name: Build extensions and publish release assets
    needs: download-pkb-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve build context
        id: ctx
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            REF="${{ github.ref_name }}"
            RTYPE="stable"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            REF="${{ github.event.release.tag_name }}"
            RTYPE="stable"
          else
            REF="${{ github.sha }}"
            RTYPE="stable"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_type=$RTYPE" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.ref }}
          fetch-depth: 0

      - name: Checkout main branch for publish target
        uses: actions/checkout@v4
        with:
          ref: main
          path: dist-repo

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compute version
        id: version
        run: |
          chmod +x scripts/version.py
          BASE_VERSION=$(uv run python scripts/version.py --get)
          if [ "${{ steps.ctx.outputs.release_type }}" = "testing" ]; then
            if [[ "$BASE_VERSION" == *-dev.* ]]; then
              VERSION="${BASE_VERSION}.${{ github.run_number }}"
            else
              CLEAN_VERSION=$(echo "$BASE_VERSION" | sed -E 's/([-+\.]dev|[-+]).*//')
              VERSION="${CLEAN_VERSION}-dev.${{ github.run_number }}"
            fi
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download pkb binaries
        uses: actions/download-artifact@v4
        with:
          path: pkb-binaries/

      - name: Build per-platform dist artifacts
        env:
          ACA_DATA: ${{ github.workspace }}
        run: |
          VERSION_FLAG=""
          if [ "${{ steps.ctx.outputs.release_type }}" = "testing" ]; then
            VERSION_FLAG="--set-version ${{ steps.version.outputs.version }}"
          fi

          for platform_dir in pkb-binaries/pkb-*; do
            ARTIFACT_NAME=$(basename "$platform_dir")
            PLATFORM_LABEL="${ARTIFACT_NAME#pkb-}"
            uv run python scripts/build.py \
              --pkb-binary "$platform_dir/pkb" \
              --target-platform "$PLATFORM_LABEL" \
              $VERSION_FLAG
          done

          # Generic fallback
          uv run python scripts/build.py $VERSION_FLAG

      - name: Publish distribution to main
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}"

          # main is the published "dist repo". build.py emits
          # dist/.claude-plugin/marketplace.json with ROOT-RELATIVE sources
          # (./aops-claude, ./aops-tools-claude, ./aops-cowork), so the built
          # plugin dirs must land as SIBLINGS of that marketplace at the main
          # root — NOT nested under main/dist/ (the old bug that left the
          # marketplace pointing at directories that never existed on main, so
          # `claude` could not resolve the plugins).
          cd "${SRC}/dist-repo"

          # Publish every built plugin directory at the root, each kept clean
          # with --delete. The `*/` glob skips dot-entries (dist/.claude-plugin
          # and any generated dist/.github), so main's own source tree and CI
          # workflows are never touched. Release archives (*.tar.gz / *.zip) are
          # files at the dist root → not matched here; they ship as GitHub
          # Release assets in the next step.
          for d in "${SRC}"/dist/*/; do
            name="$(basename "$d")"
            rsync -a --delete "$d" "./${name}/"
          done

          # Claude marketplace (root-relative ./aops-* sources) + Gemini manifest.
          mkdir -p .claude-plugin
          cp "${SRC}/dist/.claude-plugin/marketplace.json" .claude-plugin/marketplace.json
          cp "${SRC}/dist/aops-gemini/gemini-extension.json" gemini-extension.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # -f to bypass any .gitignore rule that would hide plugin payload files.
          git add -f aops-* .claude-plugin/marketplace.json gemini-extension.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "main already in sync — nothing to publish"
          else
            git commit -m "chore: publish v${{ steps.version.outputs.version }} distribution [skip ci]"
            # Fast-forward (dist-repo is checked out at main HEAD) — no force push,
            # so a non-fast-forward branch rule on main can stay enforced.
            git push origin main
          fi


      - name: Upload archives to GitHub Release v${{ steps.version.outputs.version }}
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ steps.ctx.outputs.release_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          [ "$RELEASE_TYPE" = "testing" ] && PRERELEASE_FLAG="--prerelease"

          ARCHIVES=""
          for f in dist/*.tar.gz; do
            [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"
          done

          if [ -z "$ARCHIVES" ]; then
            echo "::error::No archives in dist/"
            exit 1
          fi

          gh release upload "v$VERSION" $ARCHIVES --clobber || \
          gh release create "v$VERSION" --title "v$VERSION" --notes "AcademicOps v$VERSION" $PRERELEASE_FLAG $ARCHIVES
