# Conflict Admission Sweep — drives the mechanic onto conflicting, approved PRs.
#
# WHY THIS EXISTS (specs/workflows/pr-pipeline.md §3.11). GitHub never fires
# `pull_request` OR `pull_request_review` on a PR that is CONFLICTING with its
# base — it cannot build the `refs/pull/N/merge` ref those events' runs check
# out, so no run is created (silently, no logs). Consequently neither the triage
# pipeline (`pr-pipeline.yml`) nor the admission workflow (`admit-on-review.yml`)
# can EVER reach a conflicting PR — a maintainer's "Approve" click produces no
# workflow run at all. The conflict-resolving mechanic therefore never gets
# dispatched, and the PR deadlocks at "checks awaiting conflict resolution".
#
# This sweep runs on events IMMUNE to the merge-ref constraint — `push` to the
# base branch (every merge, i.e. exactly when open PRs go stale/conflicting) and
# a periodic `schedule` — finds open PRs that are CONFLICTING and already approved
# by a write-class maintainer, ADMITS them (sets `admit-status`, arms auto-merge —
# the deferred equivalent of `admit-on-review.yml`, which could not fire), and
# dispatches the mechanic to resolve the conflict. Once the mechanic merges the
# base and pushes, the PR becomes MERGEABLE and the normal `pull_request` pipeline
# resumes (§3.5 re-verify → armed auto-merge fires when green).
#
# Bounding: `find-conflicting-admitted-prs.sh` excludes any PR whose current head
# SHA already carries a terminal `mechanic-status` (the mechanic ran and either
# resolved → new SHA, or halted → escalated), so the schedule never re-dispatches
# on a SHA already processed. The mechanic's own §3.6 ceiling bounds passes within
# an admission.

name: Conflict Admission Sweep

on:
  push:
    branches: [dev]
  schedule:
    # Every 30 minutes — a backstop for PRs that were already conflicting when
    # approved (no base push imminent to trigger the sweep otherwise).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
  issues: write
  actions: read

concurrency:
  # One sweep at a time; never cancel an in-flight admit/dispatch.
  group: conflict-admission-sweep
  cancel-in-progress: false

jobs:
  # ─── Discover conflicting, approved PRs that need the mechanic ──────────────
  discover:
    name: Discover conflicting + approved PRs
    # Same-repo only — a sweep on a fork has no bot write token to admit/dispatch.
    if: github.repository == 'nicsuzor/academicOps'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN || github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Find candidates
        id: find
        run: bash scripts/ci/find-conflicting-admitted-prs.sh
        env:
          BASE_BRANCH: dev

  # ─── Admit each candidate — set admit-status + arm auto-merge ───────────────
  # The maintainer's standing approval is the admission decision (it just could
  # not fire `admit-on-review.yml` while the PR was conflicting). Mirrors that
  # workflow's `admit` job by calling the SAME shared script
  # (scripts/ci/admit-pr.sh, pr-pipeline.md §5.1) — required `admit-status=success`
  # + armed auto-merge can't drift between the two admission paths. The mechanic
  # (next job) then makes the PR actually mergeable.
  admit:
    name: Admit conflicting PR
    needs: [discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      # Bot PAT required to write the required `admit-status` and arm auto-merge
      # (the default token cannot satisfy a ruleset-trusted required status).
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # §5.1 SHA-staleness fix: `discover`'s matrix.pr.sha is a snapshot from a
      # separate, earlier job — the PR could have advanced in the gap between
      # `discover` and `admit`. admit-status is a REQUIRED check, so (unlike
      # `mechanic` below) it must land on the TRUE current HEAD, not a stale
      # one — mirroring admit-on-review.yml's own live re-read for the same
      # reason (a PR may have advanced since the triggering event fired).
      - name: Resolve live HEAD SHA
        id: resolve
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh pr view "${{ matrix.pr.number }}" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          echo "Resolved live HEAD for PR #${{ matrix.pr.number }}: $HEAD_SHA (discover snapshot was ${{ matrix.pr.sha }})"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Grant admission
        run: bash scripts/ci/admit-pr.sh
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REASON: "Admitted by standing maintainer approval (conflict-admission sweep, §3.11)"

  # ─── Dispatch the mechanic to resolve each conflict ────────────────────────
  # Deliberately still uses matrix.pr.sha (the discover-time snapshot), NOT
  # `admit`'s freshly-resolved SHA (§5.1). Both `admit` and `mechanic` are
  # `strategy: matrix` jobs; GHA does not support correlating one matrix job's
  # per-item outputs into another matrix job's corresponding item, so threading
  # `admit`'s resolved SHA here would require merging the two jobs — a bigger
  # structural change for a low-stakes consumer. Unlike admit-status (a
  # REQUIRED check), the `sha` input here only affects the mechanic's own
  # INFORMATIONAL mechanic-status posting and its SHA-based loop-skip
  # bookkeeping; its actual conflict-resolution work happens on the live `ref`
  # (branch), not a pinned commit, so a few-seconds-stale sha input is harmless.
  # Do not "fix" this into a matrix-correlation rework without re-reading §5.1.
  mechanic:
    name: Mechanic (conflict resolution)
    needs: [discover, admit]
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/agent-mechanic.yml
    with:
      pr_number: ${{ matrix.pr.number }}
      ref: ${{ matrix.pr.ref }}
      sha: ${{ matrix.pr.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
