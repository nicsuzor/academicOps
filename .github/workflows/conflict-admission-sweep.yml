# Conflict Admission Sweep — drives the mechanic onto conflicting, approved PRs.
#
# WHY THIS EXISTS (specs/workflows/pr-pipeline.md §3.11). GitHub never fires
# `pull_request` OR `pull_request_review` on a PR that is CONFLICTING with its
# base — it cannot build the `refs/pull/N/merge` ref those events' runs check
# out, so no run is created (silently, no logs). Consequently neither the triage
# pipeline (`pr-pipeline.yml`) nor the admission workflow (`admit-on-review.yml`)
# can EVER reach a conflicting PR — a maintainer's "Approve" click produces no
# workflow run at all. The conflict-resolving mechanic therefore never gets
# dispatched, and the PR deadlocks at "checks awaiting conflict resolution".
#
# This sweep runs on events IMMUNE to the merge-ref constraint — `push` to the
# base branch (every merge, i.e. exactly when open PRs go stale/conflicting) and
# a periodic `schedule` — finds open PRs that are CONFLICTING and already approved
# by a write-class maintainer, ADMITS them (sets `admit-status`, arms auto-merge —
# the deferred equivalent of `admit-on-review.yml`, which could not fire), and
# dispatches the mechanic to resolve the conflict. Once the mechanic merges the
# base and pushes, the PR becomes MERGEABLE and the normal `pull_request` pipeline
# resumes (§3.5 re-verify → armed auto-merge fires when green).
#
# PUSH EVENT — WHY IT RE-DISPATCHES (aops-c5c57bfd, Defect 1). The mechanic is a
# reusable `workflow_call` workflow (`agent-mechanic.yml`) and inherits THIS
# caller's event context. `anthropics/claude-code-action@v1` aborts on an
# inherited `push` context with "Unsupported event type: push" (`push` is in
# neither its ENTITY nor AUTOMATION event lists) — the exact ~2s abort that
# stalled PR 2128 (run 28826349623). `schedule` and `workflow_dispatch` ARE
# supported. So on `push` we do NOT run the sweep body directly; we re-invoke it
# via `workflow_dispatch` (the `redispatch-on-push` job) and the real
# discover→admit→mechanic work runs under that supported event. Immediacy is
# preserved (the re-dispatch fires within seconds of the base push).
#
# Bounding: `find-conflicting-admitted-prs.sh` excludes any PR whose current head
# SHA already carries a terminal `mechanic-status` (the mechanic ran and either
# resolved → new SHA, or halted → escalated), so the schedule never re-dispatches
# on a SHA already processed. The mechanic's own §3.6 ceiling bounds passes within
# an admission.

name: Conflict Admission Sweep

on:
  push:
    branches: [dev]
  schedule:
    # Every 30 minutes — a backstop for PRs that were already conflicting when
    # approved (no base push imminent to trigger the sweep otherwise).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
  issues: write
  actions: read

concurrency:
  # One sweep at a time; never cancel an in-flight admit/dispatch.
  group: conflict-admission-sweep
  cancel-in-progress: false

jobs:
  # ─── On `push`: re-dispatch under a claude-code-action-supported event ──────
  # See the header note. A base-branch push cannot dispatch the mechanic directly
  # (claude-code-action@v1 rejects the inherited `push` context), so it re-invokes
  # this same workflow via `workflow_dispatch`, under which the mechanic runs. The
  # push run does nothing else; the re-dispatched run does the actual work.
  redispatch-on-push:
    name: Re-dispatch under supported event
    if: github.event_name == 'push' && github.repository == 'nicsuzor/academicOps'
    runs-on: ubuntu-latest
    env:
      # PAT (not the ephemeral job token) — dispatching a workflow needs
      # actions:write, and only the bot PAT reliably carries it here.
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Re-trigger via workflow_dispatch
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?AOPS_BOT_GH_TOKEN unset — fail closed}"
          echo "Base push to dev — re-dispatching conflict-admission-sweep under workflow_dispatch (§ Defect 1)."
          gh workflow run conflict-admission-sweep.yml --repo "$REPO" --ref dev

  # ─── Discover conflicting, approved PRs that need the mechanic ──────────────
  discover:
    name: Discover conflicting + approved PRs
    # Same-repo only — a sweep on a fork has no bot write token to admit/dispatch.
    # Skip on `push`: that path re-dispatches (redispatch-on-push) so the mechanic
    # runs under a supported event, not the inherited `push` (aops-c5c57bfd).
    if: github.event_name != 'push' && github.repository == 'nicsuzor/academicOps'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN || github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # In-place mechanic reset (aops-c5c57bfd, Defect 3). A maintainer adds the
      # `mechanic-retry` label to a PR whose head SHA carries a TERMINAL
      # `mechanic-status` (§3.6 exhaustion) to re-run the mechanic without a new
      # commit. Only a write collaborator can add a label, so the label IS the
      # authorization. For a CONFLICTING PR we clear the terminal status (post
      # `pending`) and remove the label BEFORE `find-conflicting-admitted-prs.sh`
      # runs, so its existing terminal-status guard (success|failure) naturally
      # re-includes the SHA and the mechanic re-runs under the standing approval.
      # This is the label's genuine niche: a CONFLICTING PR has no
      # `pull_request`/`_review` channel, so the sweep is its only reset path.
      # A MERGEABLE PR is left labelled with a notice — the sweep does not dispatch
      # non-conflicting PRs (find-conflicting filters to CONFLICTING), so clearing
      # its status would be a silent no-op; the working reset there is a new commit
      # (which its normal `pull_request` pipeline picks up). Runs on
      # schedule/workflow_dispatch because those fire even while the PR is CONFLICTING.
      - name: Clear mechanic-status for mechanic-retry-labelled PRs
        env:
          BASE_BRANCH: dev
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?AOPS_BOT_GH_TOKEN unset — fail closed}"
          # Ensure the label exists so a maintainer can find + apply it (idempotent;
          # a no-op once created). Without this the reset would be undiscoverable.
          gh label create mechanic-retry --repo "$REPO" --color FBCA04 \
            --description "Clear the per-SHA mechanic-status and re-run the mechanic (aops-c5c57bfd)" \
            2>/dev/null || true
          labelled=$(gh pr list --repo "$REPO" --base "$BASE_BRANCH" --state open \
            --label mechanic-retry --json number,headRefOid,mergeable \
            --jq '.[] | "\(.number) \(.headRefOid) \(.mergeable)"' || true)
          if [ -z "$labelled" ]; then
            echo "No mechanic-retry-labelled PRs."
          else
            while read -r num sha mergeable; do
              [ -z "$num" ] && continue
              if [ "$mergeable" = "CONFLICTING" ]; then
                echo "Resetting mechanic guard for CONFLICTING PR #$num on $sha (mechanic-retry label)."
                gh api "repos/$REPO/statuses/$sha" \
                  -f state=pending \
                  -f context="mechanic-status" \
                  -f description="Reset by mechanic-retry label — re-dispatching mechanic" >/dev/null
                gh pr edit "$num" --repo "$REPO" --remove-label mechanic-retry || true
              else
                echo "::notice::PR #$num is $mergeable (not CONFLICTING) — the sweep does not re-dispatch it; push a commit to re-run the mechanic. Leaving mechanic-retry label in place."
              fi
            done <<< "$labelled"
          fi
      - name: Find candidates
        id: find
        run: bash scripts/ci/find-conflicting-admitted-prs.sh
        env:
          BASE_BRANCH: dev

  # ─── Admit each candidate — set admit-status + arm auto-merge ───────────────
  # The maintainer's standing approval is the admission decision (it just could
  # not fire `admit-on-review.yml` while the PR was conflicting). Mirrors that
  # workflow's `admit` job by calling the SAME shared script
  # (scripts/ci/admit-pr.sh, pr-pipeline.md §5.1) — required `admit-status=success`
  # + armed auto-merge can't drift between the two admission paths. The mechanic
  # (next job) then makes the PR actually mergeable.
  admit:
    name: Admit conflicting PR
    needs: [discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      # Bot PAT required to write the required `admit-status` and arm auto-merge
      # (the default token cannot satisfy a ruleset-trusted required status).
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # §5.1 SHA-staleness fix: `discover`'s matrix.pr.sha is a snapshot from a
      # separate, earlier job — the PR could have advanced in the gap between
      # `discover` and `admit`. admit-status is a REQUIRED check, so (unlike
      # `mechanic` below) it must land on the TRUE current HEAD, not a stale
      # one — mirroring admit-on-review.yml's own live re-read for the same
      # reason (a PR may have advanced since the triggering event fired).
      - name: Resolve live HEAD SHA
        id: resolve
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh pr view "${{ matrix.pr.number }}" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          echo "Resolved live HEAD for PR #${{ matrix.pr.number }}: $HEAD_SHA (discover snapshot was ${{ matrix.pr.sha }})"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Grant admission
        run: bash scripts/ci/admit-pr.sh
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REASON: "Admitted by standing maintainer approval (conflict-admission sweep, §3.11)"

  # ─── Dispatch the mechanic to resolve each conflict ────────────────────────
  # Deliberately still uses matrix.pr.sha (the discover-time snapshot), NOT
  # `admit`'s freshly-resolved SHA (§5.1). Both `admit` and `mechanic` are
  # `strategy: matrix` jobs; GHA does not support correlating one matrix job's
  # per-item outputs into another matrix job's corresponding item, so threading
  # `admit`'s resolved SHA here would require merging the two jobs — a bigger
  # structural change for a low-stakes consumer. Unlike admit-status (a
  # REQUIRED check), the `sha` input here only affects the mechanic's own
  # INFORMATIONAL mechanic-status posting and its SHA-based loop-skip
  # bookkeeping; its actual conflict-resolution work happens on the live `ref`
  # (branch), not a pinned commit, so a few-seconds-stale sha input is harmless.
  # Do not "fix" this into a matrix-correlation rework without re-reading §5.1.
  mechanic:
    name: Mechanic (conflict resolution)
    needs: [discover, admit]
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/agent-mechanic.yml
    with:
      pr_number: ${{ matrix.pr.number }}
      ref: ${{ matrix.pr.ref }}
      sha: ${{ matrix.pr.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
