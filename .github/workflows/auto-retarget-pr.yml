name: Retarget stray PRs to dev

# `main` is the published distribution branch — only the release pipeline writes
# to it, and nothing should open a PR against it (release-please already targets
# `dev` on its own). This is the safety net: any human/agent PR accidentally
# opened against `main` — e.g. via the GitHub web UI, whose base defaults to the
# repository default branch — is flipped to `dev` automatically. That is what
# lets the default branch stay `main` (so `claude` resolves plugins from it)
# without ever fighting GitHub over PR base.
#
# IMPORTANT: pull_request_target reads this workflow from the *default* branch,
# so this file must exist on `main` to fire. It only calls the GitHub API and
# never checks out or executes PR contents, so it is safe to run with a write
# token on fork PRs.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  retarget:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'release-please')
    runs-on: ubuntu-latest
    steps:
      - name: Flip base main -> dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$REPO" --base dev
          gh pr comment "$PR" --repo "$REPO" --body \
            "🤖 Retargeted this PR from \`main\` to \`dev\`. \`main\` is the published distribution branch — only the release pipeline writes to it, so all PRs go to \`dev\`. Nothing for you to do."
