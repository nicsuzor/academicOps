# Agent: QA (Marsha)
# Personality: The QA Reviewer — runtime verification, "it's broken until proven otherwise".
# Status check: qa-status (posted to PR head SHA via statuses API)
# Prompt: aops/agents/marsha.md + .github/agents/qa.agent.md
#
# This is a reusable workflow. academicOps installs its own trigger in:
#   .github/workflows/trigger-qa.yml
# External consumers pin to a release tag:
#   uses: nicsuzor/academicOps/.github/workflows/agent-qa.yml@qa-v1
#
# contract (specs/workflows/pr-pipeline.md — revised two-stage spec, PR #1617):
#   §4.1 workflow_call only — no pull_request, workflow_run, workflow_dispatch, push.
#         Declares the `committed` output (drives the §3.4 ordered short-circuit).
#         QA never commits (it verifies, it does not fix) so `committed` is always false.
#   §4.2 one named status: qa-status, posted to inputs.sha. Required gate (added to the
#         ruleset in P4, "once it reliably posts" — not in this phase).
#   §4.6 / §10 per-pass SHA-based loop-skip (have we judged THIS exact SHA?).
#
# Modelled structurally on the shipped agent-enforcer.yml (P1). The differences:
#   - sources marsha.md (not rbg.md) and qa.agent.md (not enforcer.agent.md);
#   - the review marker is "QA Verification" (not "Enforcer Review");
#   - allowed-tools omits Edit/Write — marsha verifies, it must not modify code.

name: "Agent: QA (Marsha)"

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to verify"
        type: string
        required: true
      ref:
        description: "Git ref to checkout (PR head branch)"
        type: string
        required: true
      sha:
        description: "PR head SHA — explicit, not derived (§4.1)"
        type: string
        required: true
    secrets:
      AOPS_BOT_GH_TOKEN:
        description: "PAT for GitHub API operations (statuses, reviews)"
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "OAuth token for Claude agent"
        required: true
    outputs:
      committed:
        description: "true if this agent pushed a commit in this pass (§3.4 short-circuit). QA never commits → always false."
        value: ${{ jobs.qa.outputs.committed }}

jobs:
  qa:
    name: QA Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-qa-${{ inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    outputs:
      # QA verifies; it never modifies code (§4.2, qa.agent.md "Never modify code").
      # The output exists so the Stage-1/2 orchestrator (§3.4) can read it uniformly
      # across every agent job; for QA it is a constant false.
      committed: "false"
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ inputs.sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      AGENT_NAME: qa

    steps:
      # §4.6 / §10 SHA-based loop-skip: re-post the verdict if this exact SHA was
      # already GENUINELY verified. Keyed on "have we judged THIS diff?", never on
      # commit author (the v1 anti-pattern that caused P2 / PR #1037). Mirrors the
      # shipped enforcer's loop-skip (regression-hardened: aops-330a87e3).
      #
      # A diff counts as already-verified ONLY when a genuine completed review exists
      # for this exact SHA:
      #   (a) an actual QA PR review (CHANGES_REQUESTED or APPROVED) whose body carries
      #       the "QA Verification" marker (qa.agent.md §Identity), or
      #   (b) the LATEST qa-status entry is a genuine terminal success (NOT a
      #       "Skipped: …" echo, failure, or pending — those must not poison the SHA).
      - name: SHA-skip check
        id: sha-skip
        run: |
          # (a) Genuine QA PR reviews posted against this exact SHA.
          CHANGES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\") | select((.body // \"\") | test(\"QA Verification\")) | select(.state == \"CHANGES_REQUESTED\")] | length" 2>/dev/null || echo "0")
          APPROVED=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\") | select((.body // \"\") | test(\"QA Verification\")) | select(.state == \"APPROVED\")] | length" 2>/dev/null || echo "0")

          # (b) Read the LATEST qa-status entry, NOT a count of "any non-Skipped
          #     success ever in history". Statuses are append-only; counting any
          #     historical success means a transient/erroneous success permanently
          #     greens a SHA — a later maintainer revert (or genuine failure) does
          #     not erase the historical entry, so a re-run resurrects the stale
          #     success. Reading the latest state preserves the maintainer's
          #     authority to revoke via a later post (aops-221211fa).
          GENUINE_SUCCESS=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" \
            --jq "[.[] | select(.context == \"${AGENT_NAME}-status\")] | sort_by(.created_at) | last | if . == null then 0 elif (.state == \"success\" and ((.description // \"\") | startswith(\"Skipped:\") | not)) then 1 else 0 end" 2>/dev/null || echo "0")

          if [ "${CHANGES:-0}" -gt 0 ]; then
            echo "SHA $HEAD_SHA already verified (CHANGES_REQUESTED) — re-posting failure"
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=failure \
              -f context="${AGENT_NAME}-status" \
              -f description="Verification failed — see review (already reviewed)" \
              -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${APPROVED:-0}" -gt 0 ] || [ "${GENUINE_SUCCESS:-0}" -gt 0 ]; then
            echo "SHA $HEAD_SHA already verified (approved) — re-posting idempotent success"
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=success \
              -f context="${AGENT_NAME}-status" \
              -f description="Skipped: SHA already reviewed" \
              -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post pending status
        if: steps.sha-skip.outputs.skip != 'true'
        run: |
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="${AGENT_NAME}-status" \
            -f description="QA verification in progress" \
            -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"

      - uses: actions/checkout@v4
        if: steps.sha-skip.outputs.skip != 'true'
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AOPS_BOT_GH_TOKEN }}

      # Fetch and assemble the QA prompt:
      #   marsha.md (personality + verification methodology)
      #   + shared-error-handling.md (common agent error contract)
      #   + qa.agent.md (PR-context framing + review format).
      # Self-runs (REPO = nicsuzor/academicOps): always clone from the repo's
      # default branch (the bare `git clone` below takes no -b flag, so it
      # checks out the GitHub default branch) so that prompt files introduced
      # to the default branch are always present, regardless of which branch
      # inputs.ref points at (the PR head branch may diverge from the default
      # branch and predate a file added in a recent merge — see aops-59a6cba6).
      # External consumers calling @qa-v1: pin to inputs.ref (release tag)
      # so their prompt files are consistent with the workflow version they pinned.
      - name: Fetch QA prompt
        id: prompt
        if: steps.sha-skip.outputs.skip != 'true'
        run: |
          if [ "$REPO" != "nicsuzor/academicOps" ] && [ -n "${{ inputs.ref }}" ]; then
            git clone -b "${{ inputs.ref }}" --depth 1 --filter=blob:none --sparse \
              "https://x-access-token:${{ secrets.AOPS_BOT_GH_TOKEN }}@github.com/nicsuzor/academicOps.git" \
              .aops
          else
            git clone --depth 1 --filter=blob:none --sparse \
              "https://x-access-token:${{ secrets.AOPS_BOT_GH_TOKEN }}@github.com/nicsuzor/academicOps.git" \
              .aops
          fi
          # --no-cone: treat the arguments as file path patterns, not cone-mode
          # directories (cone mode never materialises the files; see aops-2be8f5c7).
          cd .aops && git sparse-checkout set --no-cone \
            /aops/agents/marsha.md \
            /.github/agents/shared-error-handling.md \
            /.github/agents/qa.agent.md && cd ..
          if [ ! -f .aops/aops/agents/marsha.md ] || [ ! -f .aops/.github/agents/qa.agent.md ] || [ ! -f .aops/.github/agents/shared-error-handling.md ]; then
            echo "::error::QA prompt files were not materialised by sparse-checkout" >&2
            ls -la .aops/aops/agents/ .aops/.github/agents/ 2>&1 || true
            exit 1
          fi
          PROMPT=$(cat .aops/aops/agents/marsha.md .aops/.github/agents/shared-error-handling.md .aops/.github/agents/qa.agent.md)
          # Append an explicit user-turn directive (aops-2a3b4c71). Without it
          # the prompt is just concatenated agent-def markdown and the model
          # intermittently treats it as a pasted artifact ("what would you like
          # me to do?") instead of starting the review — qa-status then never
          # resolves and hard-blocks the PR.
          PROMPT="${PROMPT}"$'\n\n## Your task — start now\n\n'"Review PR #${PR_NUMBER} in ${REPO} at HEAD ${HEAD_SHA} per the methodology above, and post your verdict via \`gh pr review\` (APPROVE for passing runtime checks, REQUEST_CHANGES otherwise, with the \"QA Verification\" marker in the body) so that qa-status resolves. Do not ask for clarification — the task is fully specified by the environment variables already in scope (REPO, PR_NUMBER, HEAD_SHA, AGENT_NAME)."
          {
            echo "prompt<<AGENT_EOF"
            echo "$PROMPT"
            echo "AGENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run QA Verification
        id: review
        if: steps.sha-skip.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AGENT_NAME: qa
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # marsha verifies; it must NOT modify code (qa.agent.md "Never modify code").
          # Edit/Write are deliberately withheld to enforce that structurally; Bash is
          # how it runs tests and posts its review via gh.
          # Allow the agent to run when the pull_request event was triggered by a
          # bot actor — the NORMAL case in this pipeline (bots push fix commits;
          # the resulting `synchronize` carries a bot actor). Without this,
          # claude-code-action aborts with "Workflow initiated by non-human
          # actor: claude (type: Bot)" and exits 1 → qa-status flakes red with
          # no verdict. This was the deterministic root cause of PR #2179: QA's
          # primary step had no allowed_bots (unlike agent-mechanic.yml) AND no
          # retry to recover, so a bot-triggered run dead-ended. (The enforcer's
          # primary also omits this and leans on its retry to recover; QA now
          # sets it on the primary — the mechanic's pattern — so it succeeds on
          # the first attempt instead of burning a failed run + retry.)
          allowed_bots: "claude[bot],github-actions[bot]"
          claude_args: '--model sonnet --allowed-tools "Bash,Read"'
          show_full_output: true

      # One-shot retry for a genuinely transient claude-code-action failure (app-token
      # exchange 401, rate_limit_event at run start, runner hiccups). The action
      # exits non-success WITHOUT posting a verdict, which flakes qa-status to a
      # hard-required red on an otherwise-mergeable PR (`continue-on-error` masks
      # the step's failure so the job continues to the terminal-status step, which
      # posts "Agent run failed without a verdict review"). Defence-in-depth
      # behind `allowed_bots` on the primary above: the bot-actor rejection that
      # dead-ended PR #2179 is now handled deterministically on the first attempt,
      # so this retry is left to cover only truly transient infra failures.
      # Mirrors the shipped enforcer retry (agent-enforcer.yml). QA never commits,
      # so there is no check-commit step and no mid-run SHA advance to reconcile.
      #
      # Retry only when (a) the first attempt's step exited non-success AND (b) no
      # QA verdict review exists yet for this SHA — re-running after a posted
      # verdict would create a duplicate review.
      #
      # `if: always()` is REQUIRED on every retry step. `continue-on-error: true`
      # masks a step `failure` so the job continues, but it does NOT mask a step
      # `cancelled` (claude-code-action's `rate_limit_event` surfaces as
      # `cancelled`) — without `always()` GitHub skips subsequent steps on
      # cancellation, the retry never fires, and qa-status flakes red anyway.
      - name: Check first-attempt verdict
        id: first-attempt
        if: always() && steps.sha-skip.outputs.skip != 'true' && steps.review.outcome != 'success'
        run: |
          POSTED=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\") | select((.body // \"\") | test(\"QA Verification\")) | select(.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\")] | length" 2>/dev/null || echo "0")
          if [ "${POSTED:-0}" -gt 0 ]; then
            echo "Verdict already posted by first attempt — not retrying"
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "First attempt did not succeed (${{ steps.review.outcome }}) and posted no verdict — will retry once"
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi

      # Reap the cancelled first attempt BEFORE the retry launches. A
      # `rate_limit_event` surfaces as a step `cancelled`, but the underlying
      # claude process can survive on the runner as a "zombie", race the retry,
      # and double-post reviews. Killing the zombie's process group here keeps
      # only ONE agent live per job. Best-effort: never aborts the job.
      - name: Reap cancelled first-attempt agent
        if: always() && steps.first-attempt.outputs.retry == 'true'
        run: |
          SCRIPT=""
          for p in ".aops/scripts/ci/reap-agent-processes.sh" "scripts/ci/reap-agent-processes.sh"; do
            if [ -f "$p" ]; then SCRIPT="$p"; break; fi
          done
          if [ -z "$SCRIPT" ]; then
            echo "::warning::reap-agent-processes.sh not found in .aops or checkout; skipping zombie reap"
            exit 0
          fi
          bash "$SCRIPT" claude

      - name: Run QA Verification (retry)
        id: review-retry
        if: always() && steps.first-attempt.outputs.retry == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AGENT_NAME: qa
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          allowed_bots: "claude[bot],github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: '--model sonnet --allowed-tools "Bash,Read"'
          show_full_output: true

      - name: Upload Claude session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/.claude/projects/
            ~/.claude/sessions/
          if-no-files-found: ignore
          retention-days: 30

      # Compute the terminal qa-status decision (state/description) from the
      # agent's PR review STATE (structured GitHub data, no prose parsing).
      # Extracted to a script (like the enforcer's) so the review-lookup — which
      # MUST be scoped to marsha's "QA Verification" marker, or an enforcer
      # approval on the same SHA leaks through as a false qa-status=success
      # (aops_e958bd56) — is unit-tested (tests/test_qa_terminal_status.py)
      # instead of living only as inline bash. Guard against a PR branch that
      # forked before qa-terminal-status.sh existed and was never rebased: `ref`
      # is the PR's OWN checkout, so the script genuinely may not be there. Fail
      # closed with an actionable description rather than posting an empty state.
      - name: Compute terminal decision
        id: decision
        if: always() && steps.sha-skip.outputs.skip != 'true'
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RETRY_OUTCOME: ${{ steps.review-retry.outcome }}
        run: |
          if [[ -f scripts/ci/qa-terminal-status.sh ]]; then
            bash scripts/ci/qa-terminal-status.sh
          else
            echo "::error::scripts/ci/qa-terminal-status.sh not found on this branch — rebase/merge dev to pick it up."
            {
              echo "state=failure"
              echo "description=QA infra: qa-terminal-status.sh missing on this branch — rebase onto dev"
              echo "failed=true"
            } >> "$GITHUB_OUTPUT"
          fi

      # Post terminal status from steps.decision (never re-derives the verdict
      # here — see scripts/ci/qa-terminal-status.sh).
      - name: Post terminal status
        if: always() && steps.sha-skip.outputs.skip != 'true'
        run: |
          CURRENT_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == "qa-status")] | sort_by(.created_at) | last.state // ""' \
            2>/dev/null || echo "")

          # Only post if not already posted by the agent, or if we need to replace pending.
          if [ "$CURRENT_STATE" = "pending" ] || [ -z "$CURRENT_STATE" ]; then
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="${{ steps.decision.outputs.state }}" \
              -f context="${AGENT_NAME}-status" \
              -f description="${{ steps.decision.outputs.description }}" \
              -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"
          fi

      # Hard-fail the JOB whenever qa-status is not a genuine pass, so the check
      # run's own colour matches the merge gate it posts. Without this the job
      # exited 0 (green ✓) even after posting qa-status=failure — a green check
      # sitting on a red gate, which reads as "QA passed" at a glance and left
      # wedged PRs looking healthy (PR #2179: the QA agent completed without
      # posting a verdict, qa-status went red, yet the "QA Verification" job
      # showed success). Mirrors agent-enforcer.yml "Final check and hard-fail":
      #   - skip path: the SHA was already judged; the latest qa-status is
      #     decisive (success → green, anything else → red).
      #   - non-skip path: steps.decision.outputs.failed is the script's own
      #     fail-closed verdict (true for a real CHANGES_REQUESTED *and* for an
      #     agent that ran but delivered no verdict — both must redden the check).
      - name: Final check and hard-fail
        if: always()
        run: |
          FAILED=false
          if [ "${{ steps.sha-skip.outputs.skip }}" = "true" ]; then
            STATUS_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
              --jq '[.[] | select(.context == "qa-status")] | sort_by(.created_at) | last.state' 2>/dev/null || echo "")
            if [ "$STATUS_STATE" = "success" ]; then
              echo "::notice::QA succeeded: Head SHA already reviewed and approved (skipped run)."
            else
              echo "::error::QA failed: Head SHA already reviewed — verification did not pass."
              FAILED=true
            fi
          elif [ "${{ steps.decision.outputs.failed }}" = "true" ]; then
            echo "::error::QA failed: ${{ steps.decision.outputs.description }}"
            FAILED=true
          else
            echo "::notice::QA: ${{ steps.decision.outputs.description }}"
          fi

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
