# Stage 2: Admission Gate (pr-pipeline §3.2 + §5)
#
# The single HUMAN gate of the v2 pipeline. On Stage-1 convergence the triage
# orchestrator (pr-pipeline.yml `dispatch-admission` job) dispatches THIS workflow
# as a SEPARATE run. Its only job targets the `pr-fix-loop` GitHub Environment and
# therefore PARKS the whole run awaiting the required reviewer's approval.
#
#   IMPORTANT (spec §3.2 callout, §12 Q1): an Environment-gated job pauses the
#   *entire run* awaiting approval. That is why admission is a separately dispatched
#   run that parks here — never a job inside the Stage-1 run (which would leave
#   Stage 1 hanging). Validate this dispatch-then-park flow on a scratch PR before
#   relying on it (see the P4 activation task).
#
# On approval (the maintainer reads the triage statuses + agent reviews + pauli's
# advisory alignment verdict, then clicks "Approve deployment") this job:
#   (a) sets the required `admit-status` commit status to success on HEAD, and
#   (b) arms `gh pr merge --auto --squash --delete-branch`.
# The merge then fires the moment all required checks are green and the PR is
# mergeable — immediately for an already-green PR, or after the Stage-2 fix loop
# (P5) converges green.
#
# Graduation is deliberately cheap: no bot approval, no LLM, no checkout. This is
# what removes v1's no-op merge-prep run on every green PR (pathology P5).
#
# REQUIRES (maintainer / out-of-worktree): the `pr-fix-loop` Environment must exist
# with the maintainer as a required reviewer, created in repo Settings → Environments.
# Until it exists, `environment: pr-fix-loop` resolves to an environment with no
# protection rules and the job runs WITHOUT pausing — so the gate is not enforced.
#
# See specs/workflows/pr-pipeline.md §3.2, §5, §11 (Phase 4).

name: "Stage 2: Admission Gate"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to admit'
        type: string
        required: true

# Only the maintainer-approved deployment may set the required admit-status and arm
# auto-merge. The bot PAT is needed for `gh pr merge --auto` (the default GITHUB_TOKEN
# cannot enable auto-merge across all configurations); statuses:write posts admit-status.
permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: read

# Per-PR: a second dispatch for the same PR queues rather than racing a parked run.
concurrency:
  group: stage2-admission-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit
    runs-on: ubuntu-latest
    # PARKS the run here until a required reviewer of `pr-fix-loop` approves (§3.2).
    environment: pr-fix-loop
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Admit — set admit-status and arm auto-merge
        run: |
          set -euo pipefail
          # No github.token fallback (halt-on-failure: no silent fallbacks). The bot
          # PAT is required to arm auto-merge; fail loud if it is absent.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AOPS_BOT_GH_TOKEN is not set; cannot admit PR." >&2
            exit 1
          fi

          # Re-fetch HEAD: the PR may have advanced while the run was parked at the gate.
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          echo "Admitting PR #$PR_NUMBER at HEAD $HEAD_SHA"

          # (a) Set the required admit-status to success on HEAD.
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="success" \
            -f context="admit-status" \
            -f description="Admitted by maintainer — good idea, make it mergeable" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # (b) Arm auto-merge. Fires when all required checks are green + PR mergeable.
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash --delete-branch \
            || echo "WARNING: Could not enable auto-merge (may already be enabled, or PR already merged)"

          echo "PR #$PR_NUMBER admitted: admit-status=success, auto-merge armed."
