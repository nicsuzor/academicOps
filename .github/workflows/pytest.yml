name: Pytest

on:
  push:
    # Integration branch AND the release lines, matched by PATTERN rather than
    # enumerated — the same rule, and for the same reason, as pr-pipeline.yml's
    # base allow-list (see that file's header for the two silent losses that
    # forced it). The gap this closes: pr-pipeline.yml already covered PRs
    # *into* `v[0-9]*` bases, but nothing covered pushes to a release branch's
    # own tip, so `v0.9.1` reached release-readiness having never had a single
    # CI run against it (aops_v091_ci_never_ran). A release line is now checked
    # from the day it is cut, not the day someone notices.
    branches:
      - dev
      - 'v[0-9]*'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    timeout-minutes: 45
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build dist
        run: uv run python -m build.build

      - name: Setup Test Environment
        run: |
          mkdir -p ~/.claude
          # Link the skills directory to ~/.claude/skills as expected by framework
          ln -s $GITHUB_WORKSPACE/plugins/aops/skills ~/.claude/skills
          ls -l ~/.claude/skills

      - name: Run pytest
        env:
          AOPS: ${{ github.workspace }}
        run: uv run pytest
