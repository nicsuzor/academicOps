name: PR Review Pipeline

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
  issues: write
  actions: read

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─── PHASE 1: Foundational CI ──────────────────────────────────────
  # These run in parallel. If Lint autofixes and pushes, this workflow
  # run is cancelled and restarts.
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    secrets: inherit
  pytest:
    name: Pytest
    uses: ./.github/workflows/pytest.yml
    secrets: inherit
  typecheck:
    name: Type Check
    uses: ./.github/workflows/typecheck.yml
    secrets: inherit

  # ─── PHASE 1.5: Settle Delay ────────────────────────────────────────
  # Wait 120s after CI before starting the agent. Absorbs rapid pushes
  # by cancelling the cheap sleep rather than the expensive agent run.
  settle:
    name: Settle
    needs: [lint, pytest, typecheck]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Wait for branch to settle
        run: sleep 120

  # ─── PHASE 2: Axiom Review (read-only) ─────────────────────────────
  # Auditor checks compliance against axioms, heuristics, and project
  # rules. Posts CHANGES_REQUESTED if violations found, but never
  # pushes code. Runs before the fix agent so the assessor can act on
  # auditor findings.
  axiom-review:
    name: Axiom Review
    needs: [settle]
    if: always() && !cancelled()
    uses: ./.github/workflows/agent-auditor.yml
    with:
      pr_number: "${{ github.event.pull_request.number }}"
      ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  # ─── PHASE 3: Agent Fix (failure-only) ─────────────────────────────
  # Runs ONLY when a Phase 1 CI check failed. Reads CI failure logs,
  # review comments (including auditor findings), and pushes fixes.
  # If it pushes, the pipeline restarts from Phase 1.
  # When all checks are green, this is skipped — merge-prep handles
  # the graduation path (approve, set status, trigger summary-and-merge).
  agent-fix:
    name: Agent Fix
    needs: [axiom-review, lint, pytest, typecheck]
    if: >-
      !cancelled() &&
      (needs.lint.result == 'failure' ||
       needs.pytest.result == 'failure' ||
       needs.typecheck.result == 'failure')
    uses: ./.github/workflows/agent-autofix.yml
    with:
      pr_number: "${{ github.event.pull_request.number }}"
      ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit
