# PR Review Pipeline — Stage-1 triage orchestrator (and Stage-2 fix-loop driver).
#
# Stage 1 (every push): committing agents run in cost order under the §3.4 ordered
# short-circuit — `lint → enforcer → qa`. Read-only checks (typecheck, pytest)
# post statuses but never end a pass. On convergence (a pass where the chain ran
# all the way through and no agent committed), `dispatch-admission` dispatches
# `stage2-admission.yml` to park at the `pr-fix-loop` Environment.
#
# Stage 2 (post-admission, when `admit-status` is `success`): the same orchestrator
# appends the **mechanic** to the cost order — real development to clear the red
# the autofixers couldn't, plus conflict resolution. Enforcer + qa re-verify each
# mechanic SHA (§3.5); the §3.6 bounded loop is enforced inside `agent-mechanic.yml`.
#
# `merge-prep-status` is retired (Phase 5) — replaced by `admit-status` at P4 and
# no longer carried forward here. `mechanic-status` is informational only and is
# never required by the ruleset; it lives entirely on the mechanic workflow side.
#
# See specs/workflows/pr-pipeline.md for the full process documentation.

name: PR Review Pipeline

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_call:
    secrets:
      AOPS_BOT_GH_TOKEN:
        description: 'PAT for GitHub API operations'
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'OAuth token for Claude agent'
        required: false

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
  issues: write
  actions: read

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─── Step 0: Gate (Approval for release-please PRs) ──────────────
  gate:
    name: Release Gate Approval
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref && startsWith(github.event.pull_request.head.ref, 'release-please')) && 'production' || '' }}
    steps:
      - name: Acknowledge approval
        run: echo "Environment gate approved or bypassed"

  # ─── Step 0.4: Guard — no built artifacts on dev ───────────────────
  # dev is source-only. Built plugin dirs, dist/, and the GENERATED manifest
  # gemini-extension.json (produced by build.py from templates/, gitignored)
  # live exclusively on the published `main` branch (see build-extension.yml).
  # Exception (aops-c9bbb8d3): .claude-plugin/marketplace.json is deliberately
  # permitted on `dev` to work around a Claude cowork bug where cowork resolves
  # the marketplace manifest from the source/dev tree, so it must be tracked there.
  # Fail fast if any PR targeting dev tracks forbidden distribution artifacts, so
  # they can never land on dev and conflict with the source tree. The generated
  # manifest gemini-extension.json is included because it is gitignored — once
  # untracked, only a deliberate `git add -f` could re-commit it, which is
  # exactly what this guard must catch.
  guard-no-dist:
    name: Guard — no dist on dev
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no distribution artifacts are tracked
        run: |
          set -euo pipefail
          OFFENDERS="$(git ls-files -- dist aops-claude aops-tools-claude aops-cowork aops-gemini aops-tools-gemini aops-antigravity aops-tools-antigravity gemini-extension.json || true)"
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Built distribution artifacts (dirs or generated manifests) must never be committed to dev — they belong only on the published main branch."
            echo "$OFFENDERS"
            exit 1
          fi
          echo "✓ dev is clean — no dist/, built plugin dirs, or generated manifests tracked."

  # ─── Step 0.5: Initialize ──────────────────────────────────────────
  # admit-status carry-forward (pr-pipeline §5). admit-status is the only required
  # human gate; the vestigial merge-prep-status carry-forward was retired at Phase 5
  # (the merge-prep agent was repurposed into the post-admission mechanic; its
  # informational mechanic-status is owned by agent-mechanic.yml, not initialize).
  initialize:
    needs: [gate]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    name: Initialize
    runs-on: ubuntu-latest
    steps:
      # admit-status carry-forward (pr-pipeline §5). admit-status is the required
      # human gate; it is set to success only by the Stage-2 Admission Gate
      # (stage2-admission.yml) when the maintainer approves the `pr-fix-loop`
      # Environment. This step manages the NON-admit transitions so the gate stays
      # honest across the Stage-2 fix loop:
      #   - opened/reopened/ready_for_review → pending (a fresh PR is not admitted).
      #   - synchronize: an AGENT-authored fix commit carries a prior admission
      #     forward (the decision stands); a new HUMAN push resets to pending (a
      #     substantive human change must be re-judged at the gate).
      # The reset trigger is "a new human push" (§5); an additional reset trigger lives
      # in the Stage-2 mechanic's exhaustion handler (§3.6) — `agent-mechanic.yml` resets
      # admit-status to pending on loop-ceiling breach to surface the PR back to the gate.
      - name: Set admit status (carry-forward)
        run: |
          NEW_SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          ACTION="${{ github.event.action }}"

          set_admit_pending() {
            gh api "repos/${REPO}/statuses/${NEW_SHA}" \
              -f state="pending" \
              -f context="admit-status" \
              -f description="Awaiting admission at the pr-fix-loop Environment gate"
          }

          # Fresh PR (or re-opened) is never pre-admitted.
          if [ "$ACTION" != "synchronize" ]; then
            echo "Action is '${ACTION}' — admit-status pending"
            set_admit_pending
            exit 0
          fi

          # synchronize: only carry an admission forward across agent-authored commits.
          OLD_SHA="${{ github.event.before }}"
          PREV_ADMIT=$(gh api "repos/${REPO}/commits/${OLD_SHA}/statuses" \
            --jq '[.[] | select(.context == "admit-status")] | sort_by(.updated_at) | last | .state // empty')

          if [ "$PREV_ADMIT" != "success" ]; then
            echo "Previous admit-status was '${PREV_ADMIT:-none}' — admit-status pending"
            set_admit_pending
            exit 0
          fi

          # Previous HEAD was admitted. Carry forward ONLY if the new HEAD commit was
          # authored by a pipeline agent (bot). A human push resets to pending.
          # Agent commits are authored by the bot identities the agents commit as
          # (lint/release: github-actions[bot]; Claude agents: claude[bot]) — both have
          # GitHub account type "Bot". We treat a commit as agent-authored if either the
          # author or committer account type is "Bot" or its login carries a "[bot]" suffix.
          COMMIT_JSON=$(gh api "repos/${REPO}/commits/${NEW_SHA}")
          AUTHOR_LOGIN=$(echo "$COMMIT_JSON" | jq -r '.author.login // ""')
          AUTHOR_TYPE=$(echo "$COMMIT_JSON" | jq -r '.author.type // ""')
          COMMITTER_TYPE=$(echo "$COMMIT_JSON" | jq -r '.committer.type // ""')
          echo "New HEAD author='${AUTHOR_LOGIN}' author_type='${AUTHOR_TYPE}' committer_type='${COMMITTER_TYPE}'"

          IS_AGENT=false
          if [ "$AUTHOR_TYPE" = "Bot" ] || [ "$COMMITTER_TYPE" = "Bot" ]; then
            IS_AGENT=true
          fi
          case "$AUTHOR_LOGIN" in *"[bot]"*) IS_AGENT=true ;; esac

          if [ "$IS_AGENT" = "true" ]; then
            echo "Agent-authored fix commit — carrying admission forward to ${NEW_SHA}"
            gh api "repos/${REPO}/statuses/${NEW_SHA}" \
              -f state="success" \
              -f context="admit-status" \
              -f description="Admission carried forward across agent fix commit"
          else
            echo "Human push detected — resetting admission to pending (must be re-judged)"
            set_admit_pending
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ─── Stage 1 Triage Orchestrator (§3.4) ──────────────────────────

  # ─── Alignment queue (§6) — ADVISORY, never a merge gate ──────────
  # Light "Option A" queue surface: post `alignment-status: pending` on HEAD and
  # file (or refresh) a single open issue per PR carrying the head SHA / ref /
  # repo so a host-side cron can dispatch polecat → pauli (the PKB MCP is only
  # reachable host-side; GHA cannot run pauli — P3). The host dispatcher
  # reconciles each issue against the commit status, only dispatching if
  # `alignment-status` is still `pending`, and closes stale issues on completion.
  #
  # DESIGN INVARIANT (specs/workflows/pr-pipeline.md §6): `alignment-status` is
  # ADVISORY. It is INTENTIONALLY NOT in the branch-protection ruleset — the
  # maintainer reads pauli's verdict at the human Environment gate; alignment
  # never blocks merge. Do not promote it to a required check without a
  # deliberate spec change.
  #
  # Same-repo PRs only (fork-origin runs cannot mint a write token for the bot,
  # same gating as `initialize`). Independent of lint/enforcer/qa — runs in
  # parallel so a slow alignment surface never delays the merge-gate agents.
  alignment-queue:
    needs: [gate]
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Alignment Queue
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Post alignment-status pending (skip if already terminal on this HEAD)
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/statuses" \
            --jq '[.[] | select(.context == "alignment-status")] | sort_by(.updated_at) | last | .state // empty')
          case "$CURRENT" in
            success|failure|error)
              echo "alignment-status already terminal (${CURRENT}) on ${HEAD_SHA} — pauli has reviewed this SHA. Skipping queue refresh."
              echo "ALIGNMENT_SKIP=1" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="pending" \
            -f context="alignment-status" \
            -f description="Queued for pauli alignment review (advisory; see pr-pipeline.md §6)"

      - name: Ensure alignment:queued label exists
        if: env.ALIGNMENT_SKIP != '1'
        run: |
          set -euo pipefail
          gh label create "alignment:queued" \
            --repo "${REPO}" \
            --color FFA500 \
            --description "PR awaiting pauli alignment review (host cron drains; advisory only — pr-pipeline.md §6)" \
            --force

      - name: File or refresh alignment:queued issue
        if: env.ALIGNMENT_SKIP != '1'
        run: |
          set -euo pipefail
          TITLE="alignment:queued PR #${PR_NUMBER}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          BODY=$(cat <<EOF
          <!-- aops:alignment-queue -->

          - **PR**: #${PR_NUMBER}
          - **Repository**: \`${REPO}\`
          - **Head ref**: \`${HEAD_REF}\`
          - **Head SHA**: \`${HEAD_SHA}\`
          - **Queued**: ${NOW}

          The host-side alignment cron drains this queue (outside this repo's worktree —
          PKB MCP is Tailnet-internal, GHA cannot reach it). It dispatches \`polecat run …
          pauli\` against this PR, then pauli posts a PR review verdict and a terminal
          \`alignment-status\` on the head SHA. The dispatcher closes this issue on
          completion or when the PR is no longer open.

          **Advisory only.** \`alignment-status\` is NOT in the branch-protection ruleset
          (\`specs/workflows/pr-pipeline.md\` §6). The maintainer reads pauli's verdict at
          the human Environment gate (§3.2); alignment never blocks merge.
          EOF
          )

          # Find the existing issue (open or closed) by exact title. One issue per PR;
          # body updates per push.
          EXISTING=$(gh api "repos/${REPO}/issues?state=all&labels=alignment:queued&per_page=100" \
            --jq "[.[] | select(.title == \"${TITLE}\" and (.pull_request | not))] | sort_by(.updated_at) | last")
          NUM=$(echo "$EXISTING" | jq -r '.number // empty')
          STATE=$(echo "$EXISTING" | jq -r '.state // empty')

          if [ -z "$NUM" ]; then
            echo "No existing alignment:queued issue for PR #${PR_NUMBER} — creating."
            gh issue create --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "alignment:queued"
            exit 0
          fi

          echo "Found existing alignment:queued issue #${NUM} (state=${STATE}); refreshing body to HEAD ${HEAD_SHA}."
          gh issue edit "${NUM}" --repo "${REPO}" --body "${BODY}"
          if [ "$STATE" = "closed" ]; then
            echo "Reopening — a new push since pauli last completed warrants a new alignment review."
            gh issue reopen "${NUM}" --repo "${REPO}"
          fi

  # ─── Step 1: Lint ─────────────────────────────────────────────────
  # If lint autofixes and pushes (using AOPS_BOT_GH_TOKEN), the push
  # triggers a new synchronize event. This run is cancelled and the
  # pipeline restarts on the clean commit.
  lint:
    needs: [gate]
    name: Lint
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  # ─── Step 2: Enforcer ────────────────────────────────────────────
  enforcer:
    needs: [lint]
    if: needs.lint.outputs.committed != 'true'
    name: Enforcer Review
    uses: ./.github/workflows/agent-enforcer.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.ref }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ─── Step 3: QA (Marsha) ─────────────────────────────────────────
  qa:
    needs: [enforcer, lint]
    if: always() && needs.lint.result == 'success' && needs.enforcer.result == 'success' && needs.lint.outputs.committed != 'true' && needs.enforcer.outputs.committed != 'true'
    name: QA Verification
    uses: ./.github/workflows/agent-qa.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.ref }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ─── Step 4: Mechanic (Stage-2 only — admitted runs) ─────────────
  # The post-admission DEV agent. Runs ONLY when:
  #   - Stage 1 converged this pass (lint/enforcer/qa all succeeded with no commit), AND
  #   - admit-status is `success` on HEAD (the human gate passed at pr-fix-loop).
  # Otherwise it is a no-op (`check-admit` outputs admitted=false).
  #
  # mechanic-status is informational, never required by the ruleset (§4.2);
  # enforcer/qa re-verify the mechanic's pushed SHA on the next pass (§3.5);
  # the §3.6 bounded loop is enforced inside agent-mechanic.yml.

  check-admit:
    name: Check admit-status
    needs: [lint, enforcer, qa]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.lint.result == 'success' && needs.enforcer.result == 'success' && needs.qa.result == 'success' &&
      needs.lint.outputs.committed != 'true' && needs.enforcer.outputs.committed != 'true' && needs.qa.outputs.committed != 'true'
    runs-on: ubuntu-latest
    outputs:
      admitted: ${{ steps.check.outputs.admitted }}
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Read admit-status on HEAD
        id: check
        run: |
          ADMIT=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == "admit-status")] | sort_by(.updated_at) | last | .state // empty' \
            2>/dev/null || echo "")
          if [ "$ADMIT" = "success" ]; then
            echo "admitted=true" >> "$GITHUB_OUTPUT"
            echo "PR is admitted (admit-status=success) — Stage-2 mechanic will run."
          else
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "PR is not admitted (admit-status='${ADMIT:-absent}') — mechanic skipped (Stage-1 only)."
          fi

  mechanic:
    name: Mechanic (Stage 2)
    needs: [check-admit]
    if: needs.check-admit.outputs.admitted == 'true'
    uses: ./.github/workflows/agent-mechanic.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.ref }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ─── Read-only checks (typecheck, pytest) ────────────────────────
  # These contribute statuses but never end a pass. They only run if
  # upstream agents didn't commit, because a commit restarts the orchestrator.

  typecheck:
    name: Type Check
    needs: [lint]
    if: needs.lint.outputs.committed != 'true'
    uses: ./.github/workflows/typecheck.yml
    secrets: inherit

  pytest:
    name: Pytest
    needs: [typecheck]
    uses: ./.github/workflows/pytest.yml
    secrets: inherit

  # ─── Convergence → dispatch the Stage-2 Admission Gate (§3.2) ──────
  # CONVERGENCE = a pass where the chain ran all the way through and NO agent
  # committed (§3.4). At that point every agent has posted an authoritative status
  # on the current HEAD. We then dispatch the Admission Gate as a SEPARATE run that
  # parks at the `pr-fix-loop` Environment (it cannot be a job here — an
  # Environment-gated job would pause THIS run, leaving Stage 1 hanging; §3.2 callout).
  #
  # Idempotence: we only dispatch when admit-status is not already success. Once the
  # maintainer admits, carry-forward (initialize) keeps admit-status green across
  # agent fix commits, so subsequent convergences do NOT re-park at the gate (§12 Q1).
  dispatch-admission:
    name: Dispatch Admission Gate
    needs: [lint, enforcer, qa]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.lint.result == 'success' && needs.enforcer.result == 'success' && needs.qa.result == 'success' &&
      needs.lint.outputs.committed != 'true' && needs.enforcer.outputs.committed != 'true' && needs.qa.outputs.committed != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Dispatch admission run if not already admitted
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AOPS_BOT_GH_TOKEN is not set; cannot dispatch the Admission Gate." >&2
            exit 1
          fi

          ADMIT=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/statuses" \
            --jq '[.[] | select(.context == "admit-status")] | sort_by(.updated_at) | last | .state // empty')
          if [ "$ADMIT" = "success" ]; then
            echo "PR #$PR_NUMBER already admitted (admit-status=success) — not re-parking at the gate."
            exit 0
          fi

          echo "Stage 1 converged on $HEAD_SHA — dispatching the Admission Gate to park at pr-fix-loop."
          gh workflow run stage2-admission.yml \
            --repo "$REPO" \
            --ref "${{ github.base_ref }}" \
            -f pr_number="$PR_NUMBER" \
            || echo "WARNING: Could not dispatch stage2-admission.yml (already parked, or workflow absent on base)."
