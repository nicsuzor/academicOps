name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to operate on (optional)'
        required: false
        type: string
      prompt:
        description: 'Instructions for Claude (optional — defaults to reviewing the PR)'
        required: false
        type: string

jobs:
  claude:
    timeout-minutes: 45
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # For workflow_dispatch: build an explicit prompt so Claude knows the PR and task.
      # For comment-triggered events: this step is skipped; the action reads from the event.
      - name: Build dispatch prompt
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$DISPATCH_PR" ] && [ -n "$DISPATCH_PROMPT" ]; then
            FULL="Working on PR #${DISPATCH_PR} in ${REPO}: ${DISPATCH_PROMPT}"
          elif [ -n "$DISPATCH_PR" ]; then
            FULL="Review PR #${DISPATCH_PR} in ${REPO} and address any pending issues."
          else
            FULL="${DISPATCH_PROMPT}"
          fi
          {
            echo "prompt<<DISPATCH_EOF"
            echo "$FULL"
            echo "DISPATCH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # For workflow_dispatch: use the prompt built above.
          # For comment triggers: empty string → action reads instructions from the comment.
          prompt: ${{ steps.dispatch.outputs.prompt }}

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
          claude_args: '--model sonnet'
          show_full_output: true

      - name: Upload Claude session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/.claude/projects/
            ~/.claude/sessions/
          if-no-files-found: ignore
          retention-days: 30

      - name: Propagate agent exit status
        if: always()
        run: |
          if [ "${{ steps.claude.outcome }}" != "success" ]; then
            echo "::error::Claude agent run failed. Session artifacts uploaded for post-mortem analysis."
            exit 1
          else
            echo "::notice::Claude agent run completed successfully."
          fi
