# Type Check: basedpyright. Read-only, no autofix.
# Runs independently — does not depend on Lint.
#
# See specs/pr-pipeline.md for the full process documentation.

name: Type Check

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [dev]

jobs:
  type-check:
    timeout-minutes: 50
    name: Type Check
    runs-on: ubuntu-latest
    concurrency:
      group: typecheck-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen
        timeout-minutes: 5

      - name: Run basedpyright
        timeout-minutes: 5
        env:
          # Cap Node.js heap at 3 GB so basedpyright fails with a clear OOM error
          # instead of silently killing the runner (which defeats step/job timeouts).
          NODE_OPTIONS: "--max-old-space-size=3072"
        run: uv run basedpyright
