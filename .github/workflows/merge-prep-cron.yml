# Cron dispatcher for merge-prep: runs every 30 minutes on main.
# Finds open PRs that qualify for merge-prep and dispatches the agent.
#
# Qualification criteria (label-free):
#   - Last commit >= 15 min ago (bazaar window for bot reviews to complete)
#   - No in-progress merge-prep run (checked via gh run list)
#   - Not permanently halted (checked via merge-prep-status commit status)
#
# NOTE: The previous `workflow_run` trigger (fire on PR Review Pipeline
# completion) was removed 2026-05-21 — it cascaded. Every merge-prep push
# triggered the PR Pipeline → workflow_run → dispatcher → another merge-prep,
# requalifying PRs against new SHAs faster than the bazaar window could cap.
# Cron (30 min) + workflow_dispatch are sufficient; responsiveness loss is
# bounded at 30 min.
#
# See specs/pr-pipeline.md for the full process documentation.

name: Merge Prep Dispatcher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Override: process specific PR immediately (skip qualification)'
        type: string
        required: false
  workflow_call:
    inputs:
      pr_number:
        description: 'Override: process specific PR immediately (skip qualification)'
        type: string
        required: false
      workflow_ref:
        description: 'Filename or ID of the agent workflow to dispatch'
        type: string
        default: 'agent-merge-prep.yml'
      bot_identity:
        description: 'Identity of the bot for state checks'
        type: string
        default: 'github-actions[bot]'
      trigger_workflow_name:
        description: 'Name of the workflow that triggered this dispatch'
        type: string
        required: false
      trigger_sha:
        description: 'SHA of the commit that triggered this dispatch'
        type: string
        required: false
      trigger_repo:
        description: 'Full name of the repository (owner/repo)'
        type: string
        required: false
    # No `secrets:` block. `GITHUB_TOKEN` is reserved — declaring it here
    # makes GitHub silently reject the workflow at registration: the
    # configured `name:` (Merge Prep Dispatcher) gets replaced by the file
    # path, schedule never fires, workflow_run never fires, every push
    # creates a 0-duration phantom failure run with `event=push`. Cross-repo
    # callers should use `secrets: inherit` (see examples/cross-repo-shim/).
    # Same-repo events get GITHUB_TOKEN auto-injected.

concurrency:
  group: merge-prep-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    # Per-run wallclock cap, GitHub-enforced. The dispatcher itself completes
    # in seconds — its wallclock NEVER includes the dispatched agent's runtime
    # (`gh workflow run` returns immediately). Long-looking dispatcher times
    # would indicate queue accumulation under the `cancel-in-progress: false`
    # concurrency group, not real work.
    timeout-minutes: 45
    name: Find and dispatch qualifying PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BAZAAR_WINDOW_SECONDS: 900  # 15 min — bazaar window for external reviews (Gemini, Copilot) to arrive
      # Defaults are plain literals; do NOT reference `inputs.x` at job-level
      # env. For workflow_run / schedule / push triggers the `inputs` context
      # does not exist, and referencing it here makes the entire workflow
      # file fail validation (zero jobs spawned, opaque "workflow file
      # issue" error — broke the dispatcher 2026-04-27 → 2026-04-28). Runtime
      # overrides for workflow_call / workflow_dispatch happen in the Init
      # step below where the `inputs` context is available.
      WORKFLOW_REF: 'agent-merge-prep.yml'
      BOT_IDENTITY: 'github-actions[bot]'
    steps:
      # ── Init: apply workflow_call / workflow_dispatch overrides ──
      # Only writes overrides when triggered by an event that has an `inputs`
      # context. Other triggers fall through to the literal defaults above.
      - name: Apply input overrides (workflow_call / workflow_dispatch only)
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ inputs.workflow_ref }}" ]; then
            echo "WORKFLOW_REF=${{ inputs.workflow_ref }}" >> "$GITHUB_ENV"
            echo "Override: WORKFLOW_REF=${{ inputs.workflow_ref }}"
          fi
          if [ -n "${{ inputs.bot_identity }}" ]; then
            echo "BOT_IDENTITY=${{ inputs.bot_identity }}" >> "$GITHUB_ENV"
            echo "Override: BOT_IDENTITY=${{ inputs.bot_identity }}"
          fi

      # ── Manual override: process a specific PR immediately ──
      - name: Manual override
        if: (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.pr_number != ''
        run: |
          PR_NUM="${{ inputs.pr_number }}"
          echo "Manual override: processing PR #$PR_NUM immediately"

          DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')

          # Dispatch merge-prep
          gh workflow run "$WORKFLOW_REF" \
            --repo "${{ github.repository }}" \
            --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUM" \
            -f force=true \
            -f bot_identity="$BOT_IDENTITY"

          echo "Dispatched merge-prep for PR #$PR_NUM"

      # ── Scheduled / workflow_run: find qualifying PRs ──
      - name: Check for open PRs
        if: inputs.pr_number == ''
        id: pr-count
        run: |
          REPO="${{ github.repository }}"
          PR_COUNT=$(gh pr list --repo "$REPO" --state open --json number --jq 'length')
          echo "Open PRs: $PR_COUNT"
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No open PRs — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for in-progress merge-prep runs
        if: inputs.pr_number == '' && steps.pr-count.outputs.skip != 'true'
        id: active-check
        run: |
          REPO="${{ github.repository }}"

          # Check if any merge-prep runs are currently active.
          # We also count runs created in the last 60s to bridge API consistency lag.
          MINUTE_AGO_ISO=$(date -u -d "60 seconds ago" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v-60s +"%Y-%m-%dT%H:%M:%SZ")
          ACTIVE=$(gh run list --workflow="$WORKFLOW_REF" --repo "$REPO" \
            --json status,createdAt --jq "[.[] | select((.status == \"in_progress\" or .status == \"queued\") or .createdAt > \"$MINUTE_AGO_ISO\")] | length")
          echo "Active merge-prep runs: $ACTIVE"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
            echo "Merge-prep already in progress — skipping this cron tick"
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find qualifying PRs
        if: inputs.pr_number == '' && steps.pr-count.outputs.skip != 'true' && steps.active-check.outputs.skip_all != 'true'
        id: qualify
        run: |
          REPO="${{ github.repository }}"
          NOW=$(date +%s)

          # Get all open, non-draft PRs
          PRS=$(gh pr list --repo "$REPO" --state open \
            --json number,headRefName,headRefOid,isDraft \
            --jq '[.[] | select(.isDraft | not)]')

          if [ "$(echo "$PRS" | jq 'length')" -eq 0 ]; then
            echo "No open PRs found"
            exit 0
          fi

          echo "$PRS" | jq -c '.[]' | while read -r PR; do
            PR_NUM=$(echo "$PR" | jq -r '.number')
            HEAD_SHA=$(echo "$PR" | jq -r '.headRefOid')
            HEAD_REF=$(echo "$PR" | jq -r '.headRefName')

            echo "--- Checking PR #$PR_NUM ---"

            # Skip release-please PRs (managed manually)
            if echo "$HEAD_REF" | grep -q '^release-please'; then
              echo "  SKIP: release-please PR (merge manually)"
              continue
            fi

            # Check time gate: last commit must be >= 1 hour ago
            LAST_COMMIT_DATE=$(gh pr view "$PR_NUM" --repo "$REPO" \
              --json commits --jq '.commits[-1].committedDate')
            LAST_COMMIT_TS=$(date -d "$LAST_COMMIT_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_COMMIT_DATE" +%s 2>/dev/null)
            AGE=$((NOW - LAST_COMMIT_TS))

            if [ "$AGE" -lt "$BAZAAR_WINDOW_SECONDS" ]; then
              echo "  SKIP: last commit ${AGE}s ago (need ${BAZAAR_WINDOW_SECONDS}s)"
              continue
            fi

            # Check if a run is currently in progress on this SHA (stake planted by agent)
            MP_RUNNING=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
              --jq '[.[] | select(.context == "merge-prep-running")] | sort_by(.created_at) | last | .state' \
              2>/dev/null || echo "")
            if [ "$MP_RUNNING" = "pending" ]; then
              echo "  SKIP: merge-prep already running on this SHA (stake detected)"
              continue
            fi

            # Check merge-prep-status commit status — skip if success or failure

            MP_STATUS=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
              --jq '[.[] | select(.context == "merge-prep-status")] | sort_by(.created_at) | last | .state' \
              2>/dev/null || echo "")

            REQUALIFIED=false
            if [ "$MP_STATUS" = "success" ]; then
              # Re-qualify conditions for a PR that already passed merge-prep:
              #   (a) Late CHANGES_REQUESTED review arrived (race: Axiom Review
              #       triggered by merge-prep's own commits can finish after
              #       merge-prep declares success).
              #   (b) Base branch advanced and the PR is now CONFLICTING. Cron
              #       is the ONLY trigger that catches this — workflow_run is
              #       `branches-ignore: main`, so a merge into main never re-evaluates
              #       other open PRs. Without this check, conflicts introduced by
              #       concurrent merges silently strand the PR forever.

              MP_CREATED=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
                --jq '[.[] | select(.context == "merge-prep-status" and .state == "success")] | sort_by(.created_at) | last | .created_at' \
                2>/dev/null || echo "")

              LATE_CR=0
              if [ -n "$MP_CREATED" ]; then
                JQ_FILTER="[.[] | select(.state == \"CHANGES_REQUESTED\" and .submitted_at > \"$MP_CREATED\")] | length"
                LATE_CR=$(gh api "repos/$REPO/pulls/$PR_NUM/reviews" \
                  --jq "$JQ_FILTER" \
                  2>/dev/null || echo "0")
              fi

              if [ "$LATE_CR" -gt 0 ]; then
                echo "  RE-QUALIFY: $LATE_CR CHANGES_REQUESTED review(s) arrived after merge-prep succeeded"
                REQUALIFIED=true
              fi

              # Check mergeability: only `CONFLICTING` re-qualifies. `UNKNOWN` means
              # GitHub hasn't computed it yet (lazy) — skip this tick, next cron
              # will retry once it settles. Treating UNKNOWN as a trigger would
              # cause spurious agent runs on every dispatch.
              MERGEABLE=$(gh pr view "$PR_NUM" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo "UNKNOWN")
              if [ "$MERGEABLE" = "CONFLICTING" ]; then
                echo "  RE-QUALIFY: PR became CONFLICTING after merge-prep succeeded (base advanced)"
                REQUALIFIED=true
              fi

              if [ "$REQUALIFIED" = "false" ]; then
                echo "  SKIP: merge-prep-status is success (mergeable=$MERGEABLE, no late reviews)"
                continue
              fi
            fi

            if [ "$MP_STATUS" = "failure" ]; then
              echo "  SKIP: merge-prep-status is failure (halted — needs manual retry)"
              continue
            fi

            if [ "$REQUALIFIED" = "false" ]; then
              # Check if last commit was from merge-prep (race condition guard:
              # workflow_run can fire before the agent workflow sets merge-prep-status)
              HEAD_MSG=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message' 2>/dev/null || echo "")
              if echo "$HEAD_MSG" | grep -q 'Merge-Prep-By:'; then
                echo "  SKIP: last commit was from merge-prep (trailer detected)"
                continue
              fi
            fi

            echo "  QUALIFIED: PR #$PR_NUM ready for merge-prep (requalified=$REQUALIFIED)"
            if [ "$REQUALIFIED" = "true" ]; then
              echo "$PR_NUM:force" >> /tmp/qualifying_prs.txt
            else
              echo "$PR_NUM" >> /tmp/qualifying_prs.txt
            fi
          done

      - name: Dispatch merge-prep for oldest qualifying PR
        if: inputs.pr_number == '' && steps.pr-count.outputs.skip != 'true' && steps.active-check.outputs.skip_all != 'true'
        run: |
          REPO="${{ github.repository }}"

          if [ ! -f /tmp/qualifying_prs.txt ]; then
            echo "No qualifying PRs to process"
            exit 0
          fi

          # Dispatch ONE PR per tick. GitHub's concurrency model only keeps
          # 1 running + 1 pending per group — dispatching N runs discards N-2.
          # The cron (30 min) and workflow_run triggers ensure the next PR gets
          # picked up after the current one finishes.
          #
          # Pick the OLDEST qualifying PR (lowest PR number). The qualification
          # loop above iterates `gh pr list` output, which is sorted newest-first
          # by default, so `head -n 1` would pick the NEWEST PR — the opposite
          # of what this step's name claims. With N qualifying PRs and a 30-min
          # cron, that ordering starves the oldest PR for N × 30 min while newer
          # PRs jump the queue (incident: PRs #1101/#1102/#1107 sat for 6-7h
          # behind ~12 newer PRs on 2026-05-17, see issue #1129).
          # File format: "PR_NUM" or "PR_NUM:force" (re-qualified PRs need force
          # to bypass the agent's loop detection on Merge-Prep-By trailers).
          ENTRY=$(sort -t: -k1 -n /tmp/qualifying_prs.txt | head -n 1)
          PR_NUM="${ENTRY%%:*}"
          FORCE_FLAG=""
          if [ "$ENTRY" != "$PR_NUM" ]; then
            FORCE_FLAG="-f force=true"
          fi

          TOTAL=$(wc -l < /tmp/qualifying_prs.txt | tr -d ' ')
          echo "Dispatching merge-prep for PR #$PR_NUM (1 of $TOTAL qualifying, force=${FORCE_FLAG:+true})"

          DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')

          gh workflow run "$WORKFLOW_REF" \
            --repo "$REPO" \
            --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUM" \
            -f bot_identity="$BOT_IDENTITY" \
            $FORCE_FLAG

          echo "  Dispatched successfully. Remaining $((TOTAL - 1)) PRs will be picked up on subsequent ticks."
