# Force Review — manual escape hatch (specs/workflows/pr-pipeline.md §3.12)
#
# When a PR is wedged — the pipeline failed to start, a reviewer status is stuck
# absent/stale, or some gating state is inconsistent — a maintainer can force the
# named merge-gate reviewers to run directly on the PR's current HEAD, out of
# band from the normal `pull_request` triage flow. It calls the SAME reusable
# reviewer workflows the pipeline uses (`agent-enforcer.yml`, `agent-qa.yml`), so
# the verdicts they post (`enforcer-status`, `qa-status`) are identical to a
# normal run — then re-posts the dependent `review-attestation` status itself, so
# a PR wedged only on a stale attestation fully unwedges without a maintainer
# hand-re-running the pipeline's attestation job (see the `review-attestation`
# job below).
#
# Run from: Actions → "Force Review" → Run workflow → enter the PR number.
# This bypasses the admission gate ON PURPOSE: it exists precisely for when
# admission/triage state is broken. It does NOT merge anything — it only re-runs
# the reviewers; merge still requires all required checks green + admission.

name: Force Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to force the reviewers onto"
        type: string
        required: true
      reviewers:
        description: "Which reviewers to force-run"
        type: choice
        required: true
        default: "enforcer + qa"
        options:
          - "enforcer + qa"
          - "enforcer only"
          - "qa only"

permissions:
  contents: write        # enforcer is an autofixer; may commit a mechanical fix
  pull-requests: write
  statuses: write        # post enforcer-status / qa-status on the head SHA
  id-token: write
  issues: write
  actions: read

jobs:
  # Resolve the PR's live head ref + SHA from the number so the reusable
  # reviewers receive explicit, non-derived inputs (the §3.1/§4.1 contract).
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          data="$(gh api "repos/${REPO}/pulls/${PR}")"
          ref="$(jq -r '.head.ref' <<<"$data")"
          sha="$(jq -r '.head.sha' <<<"$data")"
          if [ -z "$ref" ] || [ "$ref" = "null" ] || [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::Could not resolve head ref/sha for PR #${PR}"
            exit 1
          fi
          echo "Forcing reviewers onto PR #${PR} @ ${sha} (branch ${ref})"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  enforcer:
    needs: [resolve]
    if: ${{ contains(inputs.reviewers, 'enforcer') }}
    name: Force Enforcer Review
    uses: ./.github/workflows/agent-enforcer.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      ref: ${{ needs.resolve.outputs.ref }}
      sha: ${{ needs.resolve.outputs.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  qa:
    needs: [resolve]
    if: ${{ contains(inputs.reviewers, 'qa') }}
    name: Force QA Verification
    uses: ./.github/workflows/agent-qa.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      ref: ${{ needs.resolve.outputs.ref }}
      sha: ${{ needs.resolve.outputs.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Re-post `review-attestation` after the forced reviewers run — the same
  # fail-closed liveness check the pipeline runs (pr-pipeline.yml `review-attestation`
  # job, scripts/ci/review-attestation.sh). Without this, Force Review refreshed the
  # named-reviewer statuses (enforcer-status / qa-status) but left the DEPENDENT
  # `review-attestation` status stale — so a wedged PR whose only red was
  # `review-attestation` stayed red even after the reviewers went green, and a
  # maintainer had to re-run the pipeline's attestation job by hand (observed
  # unwedging PR #2179, 2026-07-08). review-attestation.sh independently re-reads
  # enforcer-status + qa-status live on the SHA and fails closed, so this posts the
  # honest state regardless of which reviewers were selected: forcing "qa only"
  # still attests only if enforcer-status is already a genuine live pass on the SHA.
  #
  # `always()` so it runs whichever reviewers were selected (the other job is
  # `skipped`, a terminal state that satisfies `needs`). It attests
  # `needs.resolve.outputs.sha` — the exact SHA the reviewers were dispatched onto.
  # If the enforcer autofixer pushed a commit mid-run, that push fires a normal
  # `pull_request` event whose own pipeline attests the new head; this job attests
  # the reviewed SHA, matching the pipeline's own "attest the SHA the reviewers ran
  # on" contract.
  review-attestation:
    needs: [resolve, enforcer, qa]
    if: always() && needs.resolve.result == 'success' && !startsWith(needs.resolve.outputs.ref, 'release-please')
    name: Review Attestation
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.resolve.outputs.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute attestation decision
        id: attest
        run: ./scripts/ci/review-attestation.sh
      - name: Post review-attestation status
        env:
          STATE: ${{ steps.attest.outputs.state }}
          DESC: ${{ steps.attest.outputs.description }}
        run: |
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="review-attestation" \
            -f description="$DESC" \
            -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID?target_sha=$HEAD_SHA"
      - name: Fail closed when not attested
        env:
          STATE: ${{ steps.attest.outputs.state }}
          DESC: ${{ steps.attest.outputs.description }}
        run: |
          if [ "$STATE" != "success" ]; then
            echo "::error::$DESC"
            exit 1
          fi
          echo "::notice::$DESC"
