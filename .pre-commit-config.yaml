# Pre-commit hooks for academicOps framework governance
# See https://pre-commit.com for more info

# `make install-dev` runs `pre-commit install` unconditionally, so declaring
# post-checkout/post-merge here is what makes a plain `git pull`/`git merge`
# on this repo refresh the installed plugin cache automatically (see the
# refresh-plugin-install hook below) -- no separate opt-in step on the host.
default_install_hook_types: [pre-commit, post-checkout, post-merge]
default_stages: [pre-commit]

repos:
  # Commit-time secret backstop (Layer 2, aops_8c697102). Complements the
  # write-time scrub in lib/py/transcripts/domain/secret_redaction.py (Layer 1)
  # with an independently-maintained scanner rather than a forked pattern set.
  # Allowlist for synthetic test fixtures lives in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      # Linter + auto-fix (isort, unused imports, etc.)
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
        exclude: \.(md|json|toml)$
      # Code formatter
      - id: ruff-format
        types_or: [python, pyi]
        exclude: \.(md|json|toml)$

  # Em-dashes are a character substitution, not markdown structure, so this
  # runs over the whole file — frontmatter included, which no markdown linter
  # can reach. Exclusions mirror the `ignores` in .markdownlint-cli2.jsonc.
  - repo: local
    hooks:
      - id: no-em-dashes
        name: no em-dashes
        entry: uv run python scripts/no_em_dashes.py
        language: system
        types: [markdown]
        exclude: ^(\.agents/|tests/transcripts/fixtures/)

  # House structure rule (H39) plus the semantic checks dprint cannot make.
  # Auto-fixes, like ruff --fix. Must run BEFORE dprint: its edits change cell
  # widths, and dprint owns table padding.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # Markdown/JSON/TOML formatting. dprint is the only formatter and has the
  # last word on layout.
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt
        entry: dprint fmt --allow-no-files
        language: system
        types_or: [markdown, json, toml]
        pass_filenames: true

  # Block new orphan markdown files (Rule R5.6)
  - repo: local
    hooks:
      - id: check-no-new-orphan-md
        name: Check no new orphan markdown (R5.6)
        entry: uv run python scripts/check_no_new_orphan_md.py
        language: system
        pass_filenames: false
        always_run: true

  # Both Claude Code and agy install plugins by COPYING built content into a
  # version-keyed cache (specs/build-and-install.md, "Local install"); an edit
  # to plugins/, lib/, or build/ is invisible to an already-installed session
  # until dist/ is rebuilt and reinstalled. A `git pull`/`git merge` that lands
  # such a change is exactly the moment that goes stale, so the refresh runs
  # here instead of waiting on a developer to remember `make install-dev`.
  - repo: local
    hooks:
      - id: refresh-plugin-install
        name: refresh installed plugin cache (post-checkout/post-merge)
        entry: make install-dev
        language: system
        stages: [post-checkout, post-merge]
        pass_filenames: false
        always_run: true
