# Pre-commit hooks for academicOps framework governance
# See https://pre-commit.com for more info

repos:
  # Markdown/JSON/TOML formatting (dprint auto-fix, like ruff --fix)
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt
        entry: dprint fmt --allow-no-files
        language: system
        types_or: [markdown, json, toml]
        pass_filenames: true

  # Markdown linting (catches issues dprint doesn't fix)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.12.1
    hooks:
      - id: markdownlint-cli2
        exclude: '^archived/'

  # GitHub Actions workflow linting
  # ⚠️ DURABILITY NOTE: This MUST stay a binary-backed hook (no 'language: golang')
  # because the polecat sandbox lacks libc6-dev/pthread.h required for Go builds.
  # To upgrade: bump VERSION in scripts/run-actionlint.sh.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: scripts/run-actionlint.sh
        language: script
        types: [yaml]
        files: ^\.github/workflows/.*\.(?:yml|yaml)$

  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.excalidraw$|^dist/'
      - id: end-of-file-fixer
        exclude: '\.excalidraw$|^dist/'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Python linting (auto-fix enabled)
  # Ruff check --fix auto-fixes what it can; ruff-format checks formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^archived/'
      - id: ruff-format
        args: [--check]
        exclude: '^archived/'

  # Framework integrity checks (index wikilinks, skill entries, workflow length)
  # Consolidates check-workflow-length + new index integrity validation
  - repo: local
    hooks:
      - id: check-framework-integrity
        name: framework integrity check
        entry: uv run python scripts/check_framework_integrity.py
        language: system
        pass_filenames: false
        files: '(WORKFLOWS|SKILLS)\.md$|workflows/.*\.md$|skills/.*/SKILL\.md$|commands/.*\.md$'

      # Auto-heal Gemini-form MCP tool names (mcp_pkb_get_task) back to
      # canonical Claude form (mcp__pkb__get_task). Inverse of the transform
      # in scripts/build.py:698. Gemini polecat workers see single-underscore
      # names in their own tool catalog and sometimes write them into
      # SKILL.md / agent prompts during edits (issue #1128). This hook
      # rewrites in place; on rewrite the commit aborts so the user re-stages
      # and re-commits, same UX as ruff --fix / trailing-whitespace.
      - id: normalize-mcp-names
        name: normalize MCP tool names (Gemini -> Claude)
        entry: uv run python scripts/normalize_mcp_names.py
        language: system
        pass_filenames: true
        files: '^(aops-core|\.github/agents)/.*\.md$'

      # #1128 — block Gemini-form tool names (mcp_server_tool, read_file, etc.)
      # from escaping into source via Gemini polecat edits. Build transforms
      # canonical Claude names to Gemini form at distribution time; workers
      # must never write Gemini-form names back into aops-core/**/*.md.
      - id: check-gemini-tool-names
        name: no Gemini-form tool names in source (#1128)
        entry: uv run python scripts/check_gemini_tool_names.py
        language: system
        pass_filenames: false
        files: '^aops-core/.*\.md$'

      # R5.6 — block new orphan markdown files (worker findings, capability
      # docs, summaries, comparisons, explainers belong in task body / parent
      # epic / PKB / a file named in an approved plan, not loose .md files).
      - id: check-no-new-orphan-md
        name: check no new orphan markdown
        entry: uv run python scripts/check_no_new_orphan_md.py
        language: system
        pass_filenames: false
        files: '\.md$'

      # halt-on-failure / P#8 — block silent fallback patterns: empty .get/or fallbacks in
      # hook code, env-var literal defaults in Python, ${VAR:-literal} in
      # shell, and KEY:=literal in agent-env-map.conf. Issue #930 demonstrated
      # how a single literal default in agent-env-map.conf leaked the
      # container HOME path into every host Claude session.
      #
      # Scope is limited to the runtime-critical hot path (hook code, the
      # env-map, the cron). Install/setup scripts are excluded — defaults
      # there are part of the bootstrap UX, not silent runtime fallbacks.
      - id: check-no-fallbacks
        name: no silent fallbacks (halt-on-failure)
        entry: uv run python scripts/check_no_fallbacks.py
        language: system
        pass_filenames: true
        files: '^(aops-core/hooks/.*\.py|aops-core/agent-env-map\.conf|scripts/repo-sync-cron\.sh)$'

  # Type checking and full framework health checks run in CI only
  # (see .github/workflows/framework-health.yml)
  #
  # Moved to CI:
  # - basedpyright: full type analysis too slow for every commit
  # - check-skill-line-count: whole-repo scan, not file-scoped
  # - check-orphan-files: whole-repo scan, not file-scoped
  # - check-framework-integrity --full: slow full codebase wikilink scan
  # - audit_framework_health: comprehensive audit
