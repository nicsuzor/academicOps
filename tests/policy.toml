# Policy configuration for academicOps tests.
# This file centralizes architectural invariants, enforcement levels, and message
# requirements so they can be modified without altering the test code itself.

[rbg.stop_gate]
# Minimum required text fragments in the shipped rule-check.md
required_shipped_text = ["rule check", "evidence", "axioms"]
# Events that the RBG stop gate will block on. Currently empty because rbg hooks are disabled.
stop_events = []

[hooks.messages]
# Messages that ship with no .user.md because they have no second reader
no_user_counterpart = { "rbg: ruleset" = "agy-only injection; agy has no user channel", "rbg: classifier-prompt" = "evaluator request payload, never injected into a session", "pkb: quiet" = "the silence gate; a systemMessage here would itself be the mention of delegated work the gate exists to withhold" }
# Messages that ship user-blind and SHOULD NOT (defect list)
known_user_blind = { "rbg: rule-check" = "stop-side block with no line for the person; needs the pair, not [0]" }

[pkb]
# Is search_the_pkb enabled and returning a Result? Currently disabled.
search_the_pkb_enabled = false

[pkb.taxonomy]
# Closed 12-value status set from mem's VALID_STATUSES (references/TAXONOMY.md)
valid_statuses = [
  "inbox",
  "ready",
  "queued",
  "in_progress",
  "merge_ready",
  "review",
  "done",
  "blocked",
  "paused",
  "someday",
  "cancelled",
  "partial",
]

[rbg.evaluate]
# The PreToolUse rule evaluator (cope) is currently disabled
enabled = false

[ida]
strip_the_reply_enabled = false

[orchestrate]
rule_against_hearsay_enabled = false
# honest_output is registered on SubagentStart for the claude client,
# so the shipped-hooks equality check binds on this event.
honest_output_enabled = true

[hooks.blocking]
# No handler is permitted to return a blocking disposition on agy.
allow_blocking_agy = false
