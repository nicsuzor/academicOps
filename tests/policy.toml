# Policy configuration for academicOps tests.
# This file centralizes architectural invariants, enforcement levels, and message
# requirements so they can be modified without altering the test code itself.

[rbg.stop_gate]
# Events that the RBG stop gate will block on. Currently empty because rbg hooks are disabled.
stop_events = []

[hooks.messages]
# Messages that ship with no .user.md because they have no second reader
no_user_counterpart = { "rbg: ruleset" = "agy-only injection; agy has no user channel", "rbg: classifier-prompt" = "evaluator request payload, never injected into a session" }
# Messages that ship user-blind and SHOULD NOT (defect list)
known_user_blind = { "rbg: rule-check" = "stop-side block with no line for the person; needs the pair, not [0]" }

[hooks.degraded_capability]
# Keys in tool response that indicate degraded capability failure
degraded_keys = ["voiceError", "transcript_error"]

[pkb]
# Is search_the_pkb enabled and returning a Result?
search_the_pkb_enabled = true

[aops.taxonomy]
# Closed 12-value status set from the PKB taxonomy
valid_statuses = [
  "inbox",
  "ready",
  "queued",
  "in_progress",
  "review",
  "done",
  "paused",
  "someday",
  "cancelled",
  "partial",
  "failed",
]

[rbg.evaluate]
# The PreToolUse rule evaluator (cope) is currently disabled
enabled = false

[ida]
strip_the_reply_enabled = true
search_the_pkb_enabled = true

[orchestrate]
rule_against_hearsay_enabled = false
# honest_output is registered on SubagentStart for the claude client,
# so the shipped-hooks equality check binds on this event.
honest_output_enabled = true

[hotfix]
hotfix_labels = ["hotfix", "type:hotfix"]
hotfix_prefixes = ["hotfix:"]

[premise_check]
# The closed vocabulary (basis phrases, format items, defect tags) the verdict
# recorder reads at runtime, relative to the repository root.
vocabulary = "plugins/ida/skills/premise-check/references/vocabulary.toml"
# PKB task-read tool names as they appear in Claude Code transcripts; a read of
# a task carrying a `## Report` and no verdict through any of them arms the gate.
task_read_tools = [
  "mcp__pkb__get_task",
  "mcp__pkb__pkb__get_task",
  "mcp__services__pkb__get_task",
  "mcp__plugin_aops_services__pkb__get_task",
]
# Variables that let an armed gate pass a blocked action; each use is counted.
override_vars = [
  "PREMISE_CHECK_OVERRIDE",
  "PREMISE_CHECK_GATE_OVERRIDE",
  "AOP_FORCE",
  "AOP_OVERRIDE",
]
armed_indicator = "Premise-check gate armed by"
direction_checklist_indicator = "frozen acceptance checklist"

[rbg.axioms]
# Aliases mapping alternative names or historical variants to canonical axiom slugs
aliases = { nondelegablequalitativejudgment = "judgment-non-delegable", qualitativejudgment = "judgment-non-delegable" }
# Context words or non-axiom markdown words in backticks exempt from axiom checks
exempt_words = ["cwd"]
