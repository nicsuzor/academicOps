# PKB Quality Assessment: Periodic Knowledge Base Health Review
# Runs in the brain ($ACA_DATA) repo on a schedule.
# Launches a Claude agent that evaluates knowledge quality qualitatively.
#
# Install: copy this file to $ACA_DATA/.github/workflows/pkb-quality-review.yml
#
# CUSTOMIZE: Set these repository variables in your brain repo's Settings → Variables:
#   AOPS_REPO         — your academicOps fork/install (e.g., "yourname/academicOps")
#   OTEL_* (optional) — the OpenTelemetry contract in specs/ARCHITECTURE.md,
#                        Observability. Unset vars are omitted, not defaulted.

name: PKB Quality Review

on:
  schedule:
    - cron: '23 3 * * 1' # Weekly on Monday at 3:23 AM (off-peak)
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus area (e.g., "knowledge/cyberlaw", "recent synthesis")'
        required: false
        type: string
      sample_size:
        description: 'Number of notes to review'
        required: false
        default: '20'
        type: string

jobs:
  quality-review:
    name: PKB Quality Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout brain repo
        uses: actions/checkout@v4

      - name: Checkout academicOps
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AOPS_REPO }}
          path: _aops
          token: ${{ secrets.AOPS_DIST_PAT }}

      - name: Configure OpenTelemetry env
        # Forwards the OTel env contract (specs/ARCHITECTURE.md, Observability)
        # into the Claude Code session below via claude-code-action's
        # settings.env mechanism. Forwards only: a contract var absent from
        # this repo's Settings > Variables is omitted, never defaulted.
        env:
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ vars.CLAUDE_CODE_ENABLE_TELEMETRY }}
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: ${{ vars.CLAUDE_CODE_ENHANCED_TELEMETRY_BETA }}
          OTEL_METRICS_EXPORTER: ${{ vars.OTEL_METRICS_EXPORTER }}
          OTEL_LOGS_EXPORTER: ${{ vars.OTEL_LOGS_EXPORTER }}
          OTEL_TRACES_EXPORTER: ${{ vars.OTEL_TRACES_EXPORTER }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
          OTEL_LOG_USER_PROMPTS: ${{ vars.OTEL_LOG_USER_PROMPTS }}
          OTEL_LOG_RAW_API_BODIES: ${{ vars.OTEL_LOG_RAW_API_BODIES }}
          OTEL_LOG_TOOL_DETAILS: ${{ vars.OTEL_LOG_TOOL_DETAILS }}
          OTEL_LOG_ASSISTANT_RESPONSES: ${{ vars.OTEL_LOG_ASSISTANT_RESPONSES }}
          OTEL_METRIC_EXPORT_INTERVAL: ${{ vars.OTEL_METRIC_EXPORT_INTERVAL }}
          OTEL_LOGS_EXPORT_INTERVAL: ${{ vars.OTEL_LOGS_EXPORT_INTERVAL }}
          OTEL_TRACES_EXPORT_INTERVAL: ${{ vars.OTEL_TRACES_EXPORT_INTERVAL }}
        run: |
          jq -n \
            --arg CLAUDE_CODE_ENABLE_TELEMETRY "$CLAUDE_CODE_ENABLE_TELEMETRY" \
            --arg CLAUDE_CODE_ENHANCED_TELEMETRY_BETA "$CLAUDE_CODE_ENHANCED_TELEMETRY_BETA" \
            --arg OTEL_METRICS_EXPORTER "$OTEL_METRICS_EXPORTER" \
            --arg OTEL_LOGS_EXPORTER "$OTEL_LOGS_EXPORTER" \
            --arg OTEL_TRACES_EXPORTER "$OTEL_TRACES_EXPORTER" \
            --arg OTEL_EXPORTER_OTLP_ENDPOINT "$OTEL_EXPORTER_OTLP_ENDPOINT" \
            --arg OTEL_EXPORTER_OTLP_PROTOCOL "$OTEL_EXPORTER_OTLP_PROTOCOL" \
            --arg OTEL_RESOURCE_ATTRIBUTES "$OTEL_RESOURCE_ATTRIBUTES" \
            --arg OTEL_LOG_USER_PROMPTS "$OTEL_LOG_USER_PROMPTS" \
            --arg OTEL_LOG_RAW_API_BODIES "$OTEL_LOG_RAW_API_BODIES" \
            --arg OTEL_LOG_TOOL_DETAILS "$OTEL_LOG_TOOL_DETAILS" \
            --arg OTEL_LOG_ASSISTANT_RESPONSES "$OTEL_LOG_ASSISTANT_RESPONSES" \
            --arg OTEL_METRIC_EXPORT_INTERVAL "$OTEL_METRIC_EXPORT_INTERVAL" \
            --arg OTEL_LOGS_EXPORT_INTERVAL "$OTEL_LOGS_EXPORT_INTERVAL" \
            --arg OTEL_TRACES_EXPORT_INTERVAL "$OTEL_TRACES_EXPORT_INTERVAL" \
            '{env: ($ARGS.named | with_entries(select(.value != "")))}' \
            > "${RUNNER_TEMP}/otel-settings.json"

      - name: Run quality review agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ runner.temp }}/otel-settings.json
          prompt: |
            You are the PKB Quality Review agent. Your job is to assess the quality
            of knowledge notes in this personal knowledge base QUALITATIVELY — by
            actually reading and evaluating content, not just counting metrics.

            ## Instructions
            Read the unified memory skill for quality assessment guidance and knowledge standards:
              ${{ github.workspace }}/_aops/plugins/pkb/skills/remember/SKILL.md
              ${{ github.workspace }}/_aops/plugins/pkb/skills/remember/references/quality.md
              ${{ github.workspace }}/_aops/plugins/pkb/skills/remember/references/consolidation.md

            ## Process

            1. **Sample selection** (select ${{ inputs.sample_size || '20' }} notes):
               - Stratified sample: knowledge/, projects/, context/, goals/
               - Bias toward recently modified files
               - Include some random selections for drift detection

            2. **For each note, evaluate**:
               - Accuracy: Does content appear current and correct?
               - Provenance: Are claims attributed to sources?
               - Abstraction: Right level of generalization?
               - Links: Wikilinks present and meaningful?
               - Freshness: Is last_reviewed present? Content still relevant?
               - Format: Proper frontmatter, type, tags?

            3. **Aggregate findings**:
               - Count and categorize issues found
               - Identify patterns (e.g., "most knowledge/tech/ notes lack provenance")
               - Note positive patterns worth preserving
               - Suggest specific improvements (but don't make them)

            4. **Create GitHub issue** with the quality report:
               ```
               gh issue create --title "PKB Quality Review: $(date +%Y-%m-%d)" \
                 --label "pkb-health" \
                 --body "[report content]"
               ```

            ## Quality Dimensions (evaluate qualitatively, not mechanically)

            - **Accuracy**: Read the content. Does it make sense? Any obvious errors?
            - **Provenance**: For synthesized claims, can you trace them to sources?
            - **Usefulness**: Would this note help a future agent or the user?
            - **Connection**: Does it link to related concepts? Isolated notes lose value.
            - **Appropriate detail**: Not too specific (implementation minutiae), not too vague (platitudes)

            ## CI-Specific Rules
            - **No PKB MCP server** — you are working directly with markdown files.
              Use Grep/Glob to search, Read to inspect files. Do NOT reference
              mcp__services__pkb__* tools.
            - Time budget: 25 minutes. Exit cleanly when time is up.
            - **Sub-agent dispatch**: if you delegate the qualitative review to
              a `pkb:pauli` sub-agent, you MUST pass the explicit `tools`
              list per the "Sub-Agent Dispatch" guidelines in remember/references/consolidation.md. On CI the
              toolset is: `Bash, Glob, Grep, Read, Skill` (review is read-only,
              so omit Write/Edit and the PKB MCP tools). Without an explicit
              `tools` arg pauli sees only `Read` and `Skill` and cannot discover
              files to review.
            - **Halt surfacing**: parse sub-agent returns for `HALT:`, `HALTED`,
              `tool gap`, `tool not available`, or `cannot proceed: missing
              tool`. If any halt occurs, surface it at the TOP of the resulting
              GitHub issue (not buried in body), with the missing tool named.
              Closes silent-failure mode tracked in task-1460d6cf.

            ## Critical Rules

            - READ the content. Don't just check frontmatter fields mechanically.
            - Be honest about quality. Don't inflate the assessment.
            - Focus on actionable findings, not comprehensive cataloguing.
            - Note what's GOOD as well as what needs work.
            - DO NOT modify any files — this is assessment only.

            ## Environment
            - Brain repo: ${{ github.workspace }}
            - academicOps: ${{ github.workspace }}/_aops
            - Sample size: ${{ inputs.sample_size || '20' }}

            ${{ inputs.focus && format('## Focus\nThe operator asked you to focus on: {0}', inputs.focus) || '' }}
