# Sleep Cycle: Periodic Consolidation Agent
# Runs in the brain ($ACA_DATA) repo via manual dispatch (workflow_dispatch).
# Launches a Claude agent that works through consolidation phases using judgment.
#
# Install: copy this file to $ACA_DATA/.github/workflows/sleep-cycle.yml
#
# CUSTOMIZE: Set these repository variables in your brain repo's Settings → Variables:
#   AOPS_REPO          — your academicOps repository (e.g., "yourname/academicOps")
#   AOPS_SESSIONS_REPO — your sessions repository (e.g., "yourname/sessions")
#   OTEL_* (optional)  — the OpenTelemetry contract in specs/ARCHITECTURE.md,
#                         Observability. Unset vars are omitted, not defaulted.

name: Sleep Cycle

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus area (e.g., "staleness only", "backfill and triage")'
        required: false
        type: string
      batch_limit:
        description: 'Max items to process per phase'
        required: false
        default: '100'
        type: string

jobs:
  sleep-cycle:
    name: Sleep Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout brain repo
        uses: actions/checkout@v4

      - name: Checkout academicOps
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AOPS_REPO }}
          path: _aops
          token: ${{ secrets.AOPS_DIST_PAT }}

      - name: Checkout sessions repo (for transcript mining)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AOPS_SESSIONS_REPO }}
          path: _sessions
          token: ${{ secrets.AOPS_DIST_PAT }}
        continue-on-error: true # Transcript mining degrades gracefully if unavailable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install academicOps dependencies
        working-directory: _aops
        run: uv sync --frozen

      - name: Configure OpenTelemetry env
        # Forwards the OTel env contract (specs/ARCHITECTURE.md, Observability)
        # into the Claude Code session below via claude-code-action's
        # settings.env mechanism. Forwards only: a contract var absent from
        # this repo's Settings > Variables is omitted, never defaulted.
        env:
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ vars.CLAUDE_CODE_ENABLE_TELEMETRY }}
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: ${{ vars.CLAUDE_CODE_ENHANCED_TELEMETRY_BETA }}
          OTEL_METRICS_EXPORTER: ${{ vars.OTEL_METRICS_EXPORTER }}
          OTEL_LOGS_EXPORTER: ${{ vars.OTEL_LOGS_EXPORTER }}
          OTEL_TRACES_EXPORTER: ${{ vars.OTEL_TRACES_EXPORTER }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
          OTEL_LOG_USER_PROMPTS: ${{ vars.OTEL_LOG_USER_PROMPTS }}
          OTEL_LOG_RAW_API_BODIES: ${{ vars.OTEL_LOG_RAW_API_BODIES }}
          OTEL_LOG_TOOL_DETAILS: ${{ vars.OTEL_LOG_TOOL_DETAILS }}
          OTEL_LOG_ASSISTANT_RESPONSES: ${{ vars.OTEL_LOG_ASSISTANT_RESPONSES }}
          OTEL_METRIC_EXPORT_INTERVAL: ${{ vars.OTEL_METRIC_EXPORT_INTERVAL }}
          OTEL_LOGS_EXPORT_INTERVAL: ${{ vars.OTEL_LOGS_EXPORT_INTERVAL }}
          OTEL_TRACES_EXPORT_INTERVAL: ${{ vars.OTEL_TRACES_EXPORT_INTERVAL }}
        run: |
          jq -n \
            --arg CLAUDE_CODE_ENABLE_TELEMETRY "$CLAUDE_CODE_ENABLE_TELEMETRY" \
            --arg CLAUDE_CODE_ENHANCED_TELEMETRY_BETA "$CLAUDE_CODE_ENHANCED_TELEMETRY_BETA" \
            --arg OTEL_METRICS_EXPORTER "$OTEL_METRICS_EXPORTER" \
            --arg OTEL_LOGS_EXPORTER "$OTEL_LOGS_EXPORTER" \
            --arg OTEL_TRACES_EXPORTER "$OTEL_TRACES_EXPORTER" \
            --arg OTEL_EXPORTER_OTLP_ENDPOINT "$OTEL_EXPORTER_OTLP_ENDPOINT" \
            --arg OTEL_EXPORTER_OTLP_PROTOCOL "$OTEL_EXPORTER_OTLP_PROTOCOL" \
            --arg OTEL_RESOURCE_ATTRIBUTES "$OTEL_RESOURCE_ATTRIBUTES" \
            --arg OTEL_LOG_USER_PROMPTS "$OTEL_LOG_USER_PROMPTS" \
            --arg OTEL_LOG_RAW_API_BODIES "$OTEL_LOG_RAW_API_BODIES" \
            --arg OTEL_LOG_TOOL_DETAILS "$OTEL_LOG_TOOL_DETAILS" \
            --arg OTEL_LOG_ASSISTANT_RESPONSES "$OTEL_LOG_ASSISTANT_RESPONSES" \
            --arg OTEL_METRIC_EXPORT_INTERVAL "$OTEL_METRIC_EXPORT_INTERVAL" \
            --arg OTEL_LOGS_EXPORT_INTERVAL "$OTEL_LOGS_EXPORT_INTERVAL" \
            --arg OTEL_TRACES_EXPORT_INTERVAL "$OTEL_TRACES_EXPORT_INTERVAL" \
            '{env: ($ARGS.named | with_entries(select(.value != "")))}' \
            > "${RUNNER_TEMP}/otel-settings.json"

      - name: Run sleep cycle agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ runner.temp }}/otel-settings.json
          prompt: |
            You are the Sleep Cycle consolidation agent running in maintenance mode.
            Read the unified memory skill for full instructions:
              ${{ github.workspace }}/_aops/plugins/aops/skills/remember/SKILL.md
              ${{ github.workspace }}/_aops/plugins/aops/skills/remember/references/consolidation.md

            Work through ALL phases in order (0 through 11):
              Phase 0:  Graph Health (baseline)
              Phase 1:  Session Backfill
              Phase 2:  Transcript Mining
              Phase 3:  Episode Replay
              Phase 4:  Knowledge Consolidation
              Phase 5:  Index Refresh
              Phase 6:  Data Quality Reconciliation
              Phase 7:  Staleness Sweep
              Phase 8:  Refile Processing
              Phase 9:  Graph Maintenance
              Phase 10: Consolidation Self-Check
              Phase 11: Brain Sync

            Use your judgment about what needs attention. Skip phases where there's
            nothing to do — but always run Phase 0 (baseline) and Phase 11 (sync).

            ## Values Alignment

            Read the **Values** section in `remember/SKILL.md` (Maintenance Mode) —
            it explains both the principles and the cognitive science rationale.
            You are trusted to do complex knowledge work. Understand WHY, not just WHAT.

            ## Environment
            - Brain repo (data): ${{ github.workspace }}
            - academicOps (code): ${{ github.workspace }}/_aops
            - Sessions directory: ${{ github.workspace }}/_sessions (for transcript mining)
            - Batch limit: ${{ inputs.batch_limit || vars.SLEEP_BATCH_LIMIT || 100 }} items per phase

            ## CI-Specific Rules
            - Time budget: 25 minutes. Exit cleanly when time is up.
            - **No PKB MCP server** — you are working directly with markdown files.
               Use Grep/Glob to search, Write/Edit to create/modify files. Do NOT
               reference mcp__services__pkb__* tools. Changes sync to PKB consumers via git push.
            - **Sub-agent dispatch (Phases 2, 4, quality review)**: when you
               delegate to `pkb:pauli` sub-agents, you MUST pass the explicit
               `tools` list per the "Sub-Agent Dispatch" section in consolidation.md.
               Pauli's default profile lacks `Bash`, `Glob`, `Edit`, and the PKB
               MCP tools — without an explicit `tools` arg the sub-agent will only
               see `Read` and `Skill` and cannot do consolidation work. On CI
               (this workflow) the toolset is: `Bash, Glob, Grep, Read, Write,
               Edit, Skill` (omit mcp__services__pkb__* — not available
               here). `Edit` is restricted to transcript frontmatter under
               `_sessions/` only.
            - **Halt surfacing**: parse every sub-agent return for `HALT:`,
              `HALTED`, `tool gap`, `tool not available`, or `cannot proceed:
              missing tool`. Maintain a counter across all dispatched sub-agents
              and surface the total at the TOP of `$GITHUB_STEP_SUMMARY` (not
              buried inside per-phase output). If halts > 0, list the affected
              phase and missing tool for each. This closes the silent-failure
              mode tracked in task-1460d6cf.
            - Email/calendar MCP tools are NOT available on GitHub Actions.
              Degrade gracefully per the skill instructions (flag instead of verify).
            - Transcript mining (Phase 2): requires $AOPS_SESSIONS. Skip if not available.
            - **Output**: Mechanical work (dedup, index refresh, graph maintenance)
              commits directly to main. Knowledge work (new notes, synthesis, MOCs)
              commits to a branch `sleep/consolidation-$(date +%Y-%m-%d-%H%M)` and
              creates a PR. The PR is reviewed by /qa before merging.
            - Write a summary of what you did to $GITHUB_STEP_SUMMARY. Include:
              - **Sub-agent halt count (FIRST LINE if non-zero)** with phase + missing tool for each
              - Phase completion status
              - Knowledge notes created/updated (Phase 4)
              - Self-check findings (Phase 10)
              - Graph health delta (Phase 0 vs Phase 11)
              - PR URL if consolidation PR was created

            ## Repo Topology (CRITICAL)
            This is a DATA repo (tasks, notes, memories), NOT code.
            Code lives in _aops/. Never conclude a feature "doesn't exist" because
            you can't find it here. Search _aops/ first. If still not found, flag
            for human review — do NOT auto-cancel.

            ${{ inputs.focus && format('## Focus\nThe operator asked you to focus on: {0}', inputs.focus) || '' }}
