[project]
name = "reflexes-cope"
version = "0.1.0"
description = "Reflexes/CoPE safety harness and policy rules plugin package for academicOps"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reflexes", "hooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
