[[rule]]
toolName = ["write_file", "replace"]
argsPattern = { file_path = "/home/worker/.gemini/extensions/**" }
decision = "deny"
priority = 100
deny_message = "Modification of Gemini extensions is prohibited. Use the framework source instead."

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*/home/worker/.gemini/extensions/.*"
decision = "deny"
priority = 100
deny_message = "Modification of Gemini extensions is prohibited. Use the framework source instead."
