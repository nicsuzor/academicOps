[project]
name = "academicops"
version = "0.8.1"
description = "Academic Operations Framework"
requires-python = ">=3.11"
dependencies = [
  # Core runtime
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "fastmcp>=2.13.1",
  "filelock>=3.13.0",
  "click>=8.2.0",
  "rich>=13.0.0",
  "psutil>=5.9.0",
  # Skills dependencies
  "pdfminer-six>=20260107",
  "streamlit>=1.54.0",
  "claude-code-log>=1.5.0",
  # OTel span emission, declared for every plugin in
  # templates/plugin/pyproject.template.toml (see plugins/rbg/hooks/evaluator_otel_trace.py,
  # plugins/orchestrate/hooks/claude_code_tracer.py, plugins/orchestrate/hooks/agy_tracer.py) —
  # duplicated here, like every other plugin-scoped dependency, so the shared
  # dev venv basedpyright and pytest run under can resolve it too.
  "opentelemetry-sdk>=1.40.0",
  "opentelemetry-exporter-otlp-json-file>=0.65b0",
  "opentelemetry-exporter-otlp-proto-http>=1.40.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
]

[project.optional-dependencies]
# Statistical analysis (analyst skill)
analysis = [
  "scipy>=1.17.0",
]
# Notifications
notify = [
  "python-ntfy>=0.1.0",
]
# Anthropic API for skills that call Claude directly
anthropic = ["anthropic>=0.75.0"]

[tool.hatch.build.targets.wheel]
packages = ["lib", "tests", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  # Testing
  "pytest>=8.0.0",
  "pytest-env>=1.1.3",
  "pytest-xdist>=3.8.0",
  "pytest-cov>=7.0.0",
  "pytest-timeout>=2.4.0",
  "pytest-env>=1.5.0",
  # Linting & type checking
  "basedpyright>=1.29.0",
  "ruff>=0.14.10",
  # Build tooling
  "jsonschema>=4.26.0",
  # Git hooks
  "pre-commit>=4.5.1",
  "dprint-py>=0.51.1.0",
]

# ---- Settings ----
[tool.ruff]
# Set as desired, typically 88 (black standard) or 100 (wide).
line-length = 100

[tool.ruff.lint]
select = [
  # See: https://docs.astral.sh/ruff/rules/
  # Basic list from: https://docs.astral.sh/ruff/linter/#rule-selection
  "E", # https://docs.astral.sh/ruff/rules/#error-e
  "F", # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "I", # https://docs.astral.sh/ruff/rules/#isort-i
  # Other possibilities:
  # "D", # https://docs.astral.sh/ruff/rules/#pydocstyle-d
  # "Q", # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
  # "COM", # https://docs.astral.sh/ruff/rules/#flake8-commas-com
  # "SIM", # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
]
ignore = [
  # Disable some rules that are overly pedantic. Add/remove as desired:
  "E501", # https://docs.astral.sh/ruff/rules/line-too-long/
  "E402", # https://docs.astral.sh/ruff/rules/module-import-not-at-top-of-file/
  "E731", # https://docs.astral.sh/ruff/rules/lambda-assignment/
  # We use both ruff formatter and linter so some rules should always be disabled.
  # See: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191", # https://docs.astral.sh/ruff/rules/tab-indentation/
  "E111", # https://docs.astral.sh/ruff/rules/indentation-with-invalid-multiple/
  "E114", # https://docs.astral.sh/ruff/rules/indentation-with-invalid-multiple-comment/
  "E117", # https://docs.astral.sh/ruff/rules/over-indented/
  "D206", # https://docs.astral.sh/ruff/rules/docstring-tab-indentation/
  "D300", # https://docs.astral.sh/ruff/rules/triple-single-quotes/
  "Q000", # https://docs.astral.sh/ruff/rules/bad-quotes-inline-string/
  "Q001", # https://docs.astral.sh/ruff/rules/bad-quotes-multiline-string/
  "Q002", # https://docs.astral.sh/ruff/rules/bad-quotes-docstring/
  "Q003", # https://docs.astral.sh/ruff/rules/avoidable-escaped-quote/
  "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
  "COM819", # https://docs.astral.sh/ruff/rules/prohibited-trailing-comma/
  "ISC002", # https://docs.astral.sh/ruff/rules/multi-line-implicit-string-concatenation/
]

# ---- Reference check (scripts/check_refs.py, run by `make lint`) ----
# Every repository path a shipped document names must exist. `include` is the
# set of documents scanned; each `allow` entry names references that point
# somewhere other than this tree. An allow entry that matches nothing is an
# error, so the list cannot outlive what it excuses.
[tool.refcheck]
include = [
  "specs/*.md",
  "specs/agents/**/*.md",
  "specs/enforcement/**/*.md",
  "specs/meta/**/*.md",
  "specs/polecat/**/*.md",
  "specs/workflows/**/*.md",
  "plugins/**/*.md",
  "lib/**/*.md",
  ".agents/*.md",
  ".agents/skills/**/*.md",
  ".agents/rules/**/*.md",
  ".agents/commands/**/*.md",
  ".agents/agents/**/*.md",
  "templates/**/*.md",
  "templates/**/*.md.template",
  ".github/agents/*.md",
  "CONTRIBUTING.md",
  "README.md",
  "INSTALL.md",
  "CLAUDE.md",
  ".github/copilot-instructions.md",
]

[[tool.refcheck.allow]]
docs = "plugins/tools/skills/new-project/**"
refs = [
  ".agents/INDEX.md",
  ".claude/settings.json",
  ".claude/settings.local.json",
  "scripts/refresh.sh",
  "scripts/install-brain-workflows.sh",
  "docs/METHODOLOGY.md",
  "docs/ETHICS.md",
  "dbt_project/dbt_project.yml",
  "dbt_project/profiles.yml",
  "dbt_project/models/schema.yml",
  "manuscript/_quarto.yml",
]
reason = "Paths in the research project being scaffolded, not in this repository."

[[tool.refcheck.allow]]
docs = "plugins/tools/skills/analyst/**"
refs = [
  "data/README.md",
  "data/raw/README.md",
  "data/processed/README.md",
  "data/projects/automod.md",
  "data/projects/automod-demo.md",
  "methods/method_name.md",
  "methods/scoring.md",
  "methods/scoring_algorithm.md",
  "methods/diff_in_diff.md",
  "methods/bigquery_extraction.md",
  "analyses/calculate_scores.py",
  "analyses/calculate_quality_scores.py",
  "analyses/did_estimation.py",
  "analyses/run_regression.py",
  "codebooks/initial.md",
  "codebooks/final.md",
  "dbt/schema.yml",
  "dbt/models/marts/fct_quality_scores.sql",
  "streamlit/dashboard.py",
  "tests/test_scoring.py",
  "scripts/assumption_checks.py",
]
reason = "The research-project layout this skill prescribes — paths in the researcher's own repository."

[[tool.refcheck.allow]]
docs = "plugins/tools/skills/peer-review/references/probes.md"
refs = ["reviews/arc/templates/nic-review-style.md"]
reason = "A path in the user's knowledge base, not in this repository."

[[tool.refcheck.allow]]
docs = "specs/ARCHITECTURE.md"
refs = [
  "manifest/plugin.toml",
  "manifest/plugin.json",
  "manifest/hooks.json",
  "manifest/mcp.json",
  "hooks/hooks.json",
  ".claude-plugin/plugin.json",
  ".claude-plugin/marketplace.json",
]
reason = "Plugin-relative sources and their built outputs — a shape every plugin has, not one location."

[[tool.refcheck.allow]]
docs = "specs/build-and-install.md"
refs = ["hooks/hooks.json", ".claude-plugin/marketplace.json"]
reason = "Built output under dist/, described by its shape rather than one location."

[[tool.refcheck.allow]]
docs = "plugins/rbg/README.md"
refs = ["hooks/dispatch.py"]
reason = "Injected from lib/hooks at build time; present in the build tree, not in the plugin source."

[[tool.refcheck.allow]]
docs = "specs/polecat/tmux-interactive-driving.md"
refs = ["antigravity-cli/settings.json"]
reason = "Configuration inside the container image, not in this repository."

[[tool.refcheck.allow]]
docs = "templates/github-agent/README.md"
refs = [".github/agents/worker.agent.md"]
reason = "Where the template is installed in a consuming repository."

[[tool.refcheck.allow]]
docs = ".agents/skills/debug/**"
refs = [".claude/settings.json"]
reason = "Claude Code configuration file in workspace, not in this repository."

[tool.basedpyright]
# Exclude archived files from type checking - they are legacy code kept for reference
exclude = [
  "**/.*",
  "archived/",
  "tests/",
  "**/__pycache__",
  "build/testdata",
  "**/dist",
  "**/venv",
  "plugins.disabled",
  "plugins.disabled/**",
  "plugins/*/agents/", # Exclude non-code agent configs
  "plugins/*/commands/", # Exclude command specs
  "plugins/*/skills/", # Exclude skill definitions (markdown/YAML)
  "plugins/pkb/workflows/", # Exclude process-template markdown
]
ignore = ["**/site-packages"]
# Python path for internal imports
extraPaths = ["plugins/rbg/hooks", "plugins/orchestrate/hooks", "lib/py", "lib/hooks"]
# By default BasedPyright is very strict, so you almost certainly want to disable
# some of the rules.
# First, these turn off warnings about (yes) how you ignore warnings:
reportIgnoreCommentWithoutRule = false
reportUnnecessaryTypeIgnoreComment = false
# A few typically noisy warnings are next.
# How many you enable is up to you. The first few are off by default, but you can
# comment/uncomment these as desired:
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportUnreachable = false
# Ignore missing imports for third-party packages without stubs
reportMissingImports = true
reportMissingTypeStubs = true
reportMissingModuleSource = true

# Pre-existing issues tracked for incremental remediation — match pre-deletion baseline
reportMissingTypeArgument = false
reportPossiblyUnboundVariable = false
reportImplicitRelativeImport = false
reportConstantRedefinition = false
reportImportCycles = false
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
reportUninitializedInstanceVariable = false
# Warning-level rules — suppress to prevent non-zero exit code (basedpyright exits 1 on any warning)
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnannotatedClassAttribute = false
reportUnusedParameter = false
reportPrivateUsage = false
reportPrivateLocalImportUsage = false
reportUnnecessaryIsInstance = false
reportUnusedFunction = false
reportUnknownLambdaType = false
reportUnnecessaryComparison = false
reportImplicitOverride = false
reportUnusedVariable = false
reportUnusedImport = false
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archived", "tests/archived"]
pythonpath = [".", "lib/py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = "-n 16 --dist loadgroup -m 'not slow and not integration and not demo and not otel_e2e' --import-mode=importlib"
markers = [
  "slow: marks tests as slow (run with '-m slow')",
  "integration: marks tests as integration tests",
  "metrics: observability tests that report metrics (run with '-m metrics')",
  "demo: demo tests showing real behavior (run with '-k demo -v -s -n 0')",
  "e2e: end-to-end tests requiring live infra (POLECAT_E2E=1 to run)",
  "live: drives real headless clients to measure hook-format conformance (run with '-m live'; skip-if-client-unavailable)",
  "otel_e2e: spins up a real OTel collector (docker) and a real Claude Code session against it (run with '-m otel_e2e'; skip-if-docker-or-credentials-unavailable)",
]

[project.scripts]
polecat = "lib.polecat.cli:main" # resolves via [tool.hatch.build.targets.wheel] packages = ["lib", ...]
