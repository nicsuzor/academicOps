# Agent environment variable mappings for headless sessions.
#
# Two formats supported:
#   TARGET=SOURCE     — set TARGET to the value of $SOURCE from parent env.
#                       Skipped if SOURCE is not set.
#   TARGET:=VALUE     — set TARGET to the literal VALUE.
#                       Use empty VALUE (TARGET:=) to unset/clear a variable.
#
# Lines starting with # are comments. Blank lines are ignored.
#
# This file is the single source of truth for credential isolation
# and env var forwarding to agent subprocesses. It is read by:
#   - lib/agent_env.py (shared library)
#   - hooks/session_env_setup.py (Claude CLAUDE_ENV_FILE persistence)
#   - tests/conftest.py (headless test harness)

# --- Credential isolation (issue #581) ---
# Agents must use the bot PAT, not the user's personal GitHub credentials.
# GH_TOKEN is the primary env var for the gh CLI (takes precedence over GITHUB_TOKEN).
# GITHUB_TOKEN is also set for broader tool compatibility (Actions, some SDKs).
# AOPS_BOT_GH_TOKEN is forwarded as itself so the container entrypoint can
# read it directly (e.g. for git credential helpers).
GH_TOKEN=AOPS_BOT_GH_TOKEN
GITHUB_TOKEN=AOPS_BOT_GH_TOKEN
AOPS_BOT_GH_TOKEN=AOPS_BOT_GH_TOKEN

# --- Claude Code auth (single source of truth) ---
# Forwarded into polecat workers so headless `claude` can authenticate.
# CLAUDE_CODE_OAUTH_TOKEN is the ONLY supported auth mechanism — host
# `.claude/.credentials.json`, `.claude.json` oauthAccount merging, and
# `ANTHROPIC_API_KEY` fallback have all been removed (see aops-06ab3ee0).
#
# SOURCE-NAME INDIRECTION (aops-b368109a): on the host the token lives in
# `AOPS_CC_OAUTH_TOKEN`, NOT `CLAUDE_CODE_OAUTH_TOKEN`. The polecat launcher
# resolves it via lib/host_secrets (_FORWARD_SOURCE_ALIASES) and injects it
# into the container under the official name. So the orchestrator (junior)
# session never holds the official-named token and cannot leak it, yet workers
# still authenticate. Set `export AOPS_CC_OAUTH_TOKEN=$(claude setup-token …)`
# on the host before invoking polecat-claude. If nothing resolves, polecat
# fails fast.
#
# The mapping below is DELIBERATELY same-name on both sides (not
# `=AOPS_CC_OAUTH_TOKEN`): this conf is ALSO applied to host Claude sessions via
# hooks/session_env_setup.py, and mapping from AOPS_CC_OAUTH_TOKEN here would
# re-introduce the official-named token into the orchestrator session — the
# exact leak we are closing. Keeping it same-name makes this a no-op on the
# host (no CLAUDE_CODE_OAUTH_TOKEN there) while still forwarding the value the
# launcher stages into the worker env. Empty-string source is treated as unset.
CLAUDE_CODE_OAUTH_TOKEN=CLAUDE_CODE_OAUTH_TOKEN

# --- Gemini auth & runtime ---
# Same forwarding contract as Claude. GEMINI_CLI_HOME, when set, is the
# container HOME used by gemini to find ~/.gemini/... It is set explicitly
# by polecat's container launcher (see polecat/cli.py); it MUST NOT be
# defaulted here, because this file is also applied to host Claude sessions
# via hooks/session_env_setup.py — a literal default would leak the
# container path /home/worker onto the host (see issue #930).
GEMINI_API_KEY=GEMINI_API_KEY
GEMINI_SESSION_ID=GEMINI_SESSION_ID
GEMINI_CLI_HOME=GEMINI_CLI_HOME

# --- Terminal capability (interactive sessions) ---
COLORTERM=COLORTERM
FORCE_COLOR=FORCE_COLOR
NO_COLOR=NO_COLOR

# --- Non-interactive signals ---
# Suppress prompts, pagers, and progress spinners in containers.
CI=CI
NONINTERACTIVE=NONINTERACTIVE

# --- Git askpass disable (defence-in-depth) ---
# /usr/bin/true makes git refuse to prompt for credentials. Always-on inside
# polecat containers, regardless of whether a token is also forwarded.
GIT_ASKPASS:=true  # allow-fallback: defence-in-depth — must always disable git credential prompts in every context (host + container)

# Gate modes and ENFORCER_TOOL_CALL_THRESHOLD are no longer env-driven —
# they live in $AOPS_SESSIONS/polecat.yaml (loaded by lib/polecat_config.py).
# AOPS_POLECAT_CONFIG below points hooks inside the container at the staged
# copy of that file.

# --- Git Identity (bot identity) ---
# No fallbacks. User must set bot identity for git operations.


# --- PKB MCP Transport ---
# Forward PKB_MCP_URL and PKB_MCP_TOKEN to agents if set in the host environment.
# These are used to connect to the canonical PKB MCP server over HTTP/SSE.
# Empty source is skipped (treated as unset).
PKB_MCP_URL=PKB_MCP_URL
PKB_MCP_TOKEN=PKB_MCP_TOKEN

# --- SSH isolation ---
# Disconnect agent from user's SSH agent so git operations can't use personal keys.
# Forces git to use HTTPS + GH_TOKEN instead of SSH.
#
# SSH_AUTH_SOCK="" alone is NOT sufficient on macOS — keys stored in the
# Keychain are accessible directly by the ssh binary without ssh-agent.
# GIT_SSH_COMMAND=false ensures git never successfully authenticates via SSH.
# The insteadOf rewrite forces all github.com URLs to HTTPS so GH_TOKEN is used.
SSH_AUTH_SOCK:=
GIT_SSH_COMMAND:=false  # allow-fallback: defence-in-depth — block SSH so git can't use personal keys (issue #581)
GIT_TERMINAL_PROMPT:=0  # allow-fallback: defence-in-depth — block any interactive git prompt in any context
