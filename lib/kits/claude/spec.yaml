schemaVersion: "2"
kind: sandbox
name: claude
displayName: "Claude Code Sandbox"
description: "Run Claude Code inside an isolated Docker Sandbox seamlessly on your local workspace."
extends: claude

sandbox:
  entrypoint: [claude]
  command:
    default: ["--dangerously-skip-permissions"]

permissions:
  network:
    allow:
      - "api.anthropic.com:443"
      - "statsig.anthropic.com:443"
      - "github.com:443"
      - "api.github.com:443"
      - "*.githubusercontent.com:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "registry.npmjs.org:443"
      - "astral.sh:443"
      - "*.googleapis.com:443"

setup:
  install:
    - command: "which uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh"
    - command: "apt-get update && apt-get install -y --no-install-recommends git curl jq ripgrep fd-find python3 python3-pip python3-venv || true"
