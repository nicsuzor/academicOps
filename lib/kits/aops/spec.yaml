schemaVersion: "2"
kind: mixin
name: aops
displayName: "academicOps framework"
description: "Installs academicOps plugins into the sandbox: baseline from git dist during image install, and current dev plugins from the workspace during container startup."

permissions:
  network:
    allow:
      - "astral.sh:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "github.com:443"
      - "api.github.com:443"
      - "*.githubusercontent.com:443"
      - "**.ts.net:443"

setup:
  install:
    - command: >-
        git clone --depth 1 --branch dist https://github.com/nicsuzor/academicOps.git /tmp/aops-dist &&
        MP_ROOT=/tmp/aops-dist &&
        MP_NAME=academicOps &&
        PLUGINS="$(jq -r '.plugins[].name' "$MP_ROOT/.claude-plugin/marketplace.json")" &&
        mkdir -p /home/agent/.gemini/config/plugins &&
        for p in $PLUGINS; do
          src="$MP_ROOT/$p-agy";
          if [ -d "$src" ]; then
            cp -R "$src" /home/agent/.gemini/config/plugins/$p &&
            (command -v agy >/dev/null 2>&1 && agy plugin install "$src" >/dev/null 2>&1 || true);
          fi;
        done &&
        if command -v claude >/dev/null 2>&1; then
          claude plugin marketplace add "$MP_ROOT" >/dev/null 2>&1 || true;
          claude plugin marketplace update "$MP_NAME" >/dev/null 2>&1 || true;
          for p in $PLUGINS; do claude plugin install "$p@$MP_NAME" >/dev/null 2>&1 || true; done;
        fi &&
        rm -rf /tmp/aops-dist
      user: "agent"
      description: "Install baseline academicOps plugins from dist branch"
  startup:
    - command:
        - "sh"
        - "-c"
        - >-
          DIST_SRC="";
          if [ -d "/run/sandbox/source/dist" ]; then
            DIST_SRC="/run/sandbox/source/dist";
          elif [ -d "$WORKSPACE_DIR/dist" ]; then
            DIST_SRC="$WORKSPACE_DIR/dist";
          elif [ -f "$WORKSPACE_DIR/Makefile" ]; then
            cd "$WORKSPACE_DIR" && make build-agy && DIST_SRC="$WORKSPACE_DIR/dist";
          fi;
          if [ -n "$DIST_SRC" ] && [ -d "$DIST_SRC" ]; then
            PLUGINS="aops rbg ts tools aops-debug";
            mkdir -p /home/agent/.gemini/config/plugins;
            for stale in orchestrate aops-core; do
              command -v agy >/dev/null 2>&1 && agy plugin uninstall "$stale" >/dev/null 2>&1 || true;
              rm -rf /home/agent/.gemini/config/plugins/"$stale";
            done;
            for p in $PLUGINS; do
              src="$DIST_SRC/$p-agy";
              if [ -d "$src" ]; then
                rm -rf /home/agent/.gemini/config/plugins/"$p";
                cp -R "$src" /home/agent/.gemini/config/plugins/"$p";
                command -v agy >/dev/null 2>&1 && agy plugin install "$src" >/dev/null 2>&1 || true;
              fi;
            done;
            if command -v claude >/dev/null 2>&1; then
              claude plugin marketplace remove aops >/dev/null 2>&1 || true;
              claude plugin marketplace add "$DIST_SRC" >/dev/null 2>&1 || true;
              for p in $PLUGINS; do claude plugin install "$p@aops" >/dev/null 2>&1 || true; done;
            fi;
          fi;
          echo "=== dispatcher complete ==="
      user: "agent"
      description: "Copy and install current dev version of academicOps plugins from workspace into the sandbox"

