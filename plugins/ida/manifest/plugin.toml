# Doctrine `@include`s resolve against lib/ directly — injecting doctrine/
# into the plugin tree would ship a second copy of it.
[[shared]]
from = "hooks"
to = "hooks"

# The polecat launcher, which skills/dispatch invokes as
# `${CLAUDE_PLUGIN_ROOT}/polecat/cli.py`. Only the runtime modules are
# injected: `defaults/` and `entrypoint.sh` under lib/polecat/ are inputs to
# the image build (Dockerfile), not files a plugin ever reads.
[[shared]]
from = "polecat/__init__.py"
to = "polecat/__init__.py"

[[shared]]
from = "polecat/cli.py"
to = "polecat/cli.py"

[[shared]]
from = "polecat/env_contract.py"
to = "polecat/env_contract.py"
