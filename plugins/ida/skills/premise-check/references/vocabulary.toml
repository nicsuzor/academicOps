# Closed vocabularies for report arguments and checker reasons. The skill text
# and the verdict recorder both read this file; it is the single source.

# Items a checker may list under `Waived:`. Anything else is not a format item.
format_items = [
  "block",
  "numbering",
  "endnotes",
  "basis wording",
  "ask wording",
  "layout",
]

# Defect tags a `Valid:` entry may carry after `fails`.
defect_tags = ["#missing", "#scope-drift", "#conflict", "#unanswered", "#undercut"]

# Basis phrases a premise line ends with, written in words. `rank` orders
# strength: a derived claim carries the lowest rank among its premises. A
# premise whose basis matches no phrase counts at rank 0. `term` is the
# machine vocabulary carried into span attributes and Argdown exports.
[[basis]]
phrase = "rule"
term = "theory"
rank = 3

[[basis]]
phrase = "I read it"
term = "observed"
rank = 3

[[basis]]
phrase = "I did it"
term = "observed"
rank = 3

[[basis]]
phrase = "attempted, failed"
term = "attempted-and-failed"
rank = 3

[[basis]]
phrase = "worker reported, verdict"
term = "reported-by"
rank = 2

[[basis]]
phrase = "worker reported, unchecked"
term = "reported-by-unchecked"
rank = 1

[[basis]]
phrase = "assumed, not checked here"
term = "assumed"
rank = 0
