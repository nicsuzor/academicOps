# Closed vocabularies for report arguments and checker reasons. The skill text
# and the verdict recorder both read this file; it is the single source.

# The keys of the checker's reason, one per line, in the order the skill lists them.
reason_keys = [
  "Judged",
  "Valid",
  "Supported",
  "Answered",
  "Sufficient",
  "Waived",
  "Relay",
]

# Items a checker may list under `Waived:`. Anything else is not a format item.
format_items = [
  "block",
  "numbering",
  "endnotes", # obsolete: endnote pointers dropped in favour of inline citations
  "basis wording",
  "ask wording",
  "layout",
]

# Defect tags a `Valid:` entry may carry after `fails`.
defect_tags = ["#missing", "#scope-drift", "#conflict", "#unanswered", "#undercut"]

# Basis phrases for source attribution guidance. Numeric `rank` is deprecated
# and preserved only for backwards-compatibility; evidence sufficiency is evaluated
# semantically by checking agents under `Supported:` rather than by rank arithmetic.
# `term` is the machine vocabulary carried into span attributes only.
[[basis]]
phrase = "rule"
term = "theory"
rank = 2

[[basis]]
phrase = "I read it"
term = "observed"
rank = 3

[[basis]]
phrase = "I did it"
term = "observed"
rank = 3

[[basis]]
phrase = "attempted, failed"
term = "attempted-and-failed"
rank = 3

[[basis]]
phrase = "worker reported, verdict"
term = "reported-by"
rank = 2

[[basis]]
phrase = "worker reported, unchecked"
term = "reported-by-unchecked"
rank = 1

[[basis]]
phrase = "assumed, not checked here"
term = "assumed"
rank = 0
