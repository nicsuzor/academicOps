# Shared material this plugin needs from lib/, injected at build time. Delete
# this file if the plugin needs none — an absent file and an empty one both
# mean "declares nothing", and both build clean.

[[shared]]
from = "hooks"
to = "hooks"

# The polecat launcher, invoked as `${CLAUDE_PLUGIN_ROOT}/polecat/cli.py` by the
# `pc` agent (`plugins/ida/agents/pc.md`). Only the runtime modules are
# injected: `defaults/` and `entrypoint.sh` under lib/polecat/ are inputs to
# the image build (Dockerfile), not files a plugin ever reads.
[[shared]]
from = "polecat/__init__.py"
to = "polecat/__init__.py"

[[shared]]
from = "polecat/cli.py"
to = "polecat/cli.py"

[[shared]]
from = "polecat/env_contract.py"
to = "polecat/env_contract.py"
