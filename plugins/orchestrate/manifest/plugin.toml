# Shared material this plugin needs from lib/, injected at build time. Delete
# this file if the plugin needs none — an absent file and an empty one both
# mean "declares nothing", and both build clean.

[[shared]]
from = "hooks"
to = "hooks"

# Canonical Phoenix span-store facts, also read directly by
# .agents/skills/debug/SKILL.md (a dev-only skill the build never touches) via
# a relative path into lib/. Keep both sides pointed at this one file.
[[shared]]
from = "telemetry/phoenix-span-store.md"
to = "skills/session-trace/references/phoenix-span-store.md"

# The polecat launcher, invoked as `${CLAUDE_PLUGIN_ROOT}/polecat/cli.py` by the
# `pc` agent (`plugins/orchestrate/agents/pc.md`). Only the runtime modules are
# injected: `defaults/` and `entrypoint.sh` under lib/polecat/ are inputs to
# the image build (Dockerfile), not files a plugin ever reads.
[[shared]]
from = "polecat/__init__.py"
to = "polecat/__init__.py"

[[shared]]
from = "polecat/cli.py"
to = "polecat/cli.py"

[[shared]]
from = "polecat/env_contract.py"
to = "polecat/env_contract.py"

[[shared]]
from = "polecat/notify.py"
to = "polecat/notify.py"

[[shared]]
from = "polecat/staleness.py"
to = "polecat/staleness.py"
